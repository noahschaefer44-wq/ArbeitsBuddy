<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0420">
<title>RETRO ARCADIA · 10 Klassiker</title>
<meta name="description" content="10 klassische Arcade-Spiele im Browser: Dino, Snake, Tetris, Pong, Space Invaders, Pac-Man, Memory, Breakout, Flappy und Minesweeper.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><div class="stars"></div><div class="sun"></div><div class="floor"></div></div>
<div class="crt" aria-hidden="true"></div>

<header id="top">
  <h1 class="logo" id="logo"><span data-t="RETRO">RETRO</span><span data-t="ARCADIA">ARCADIA</span></h1>
  <p class="tag">10 KLASSIKER &middot; 0 WERBUNG &middot; <b class="blink">INSERT COIN</b></p>
</header>

<main id="menu">
  <div class="cards" id="cards"></div>
</main>

<section id="view" hidden>
  <div class="bar">
    <button id="back" class="btn">◀ MENÜ</button>
    <div class="gtitle" id="gtitle"></div>
    <button id="pause" class="btn sq" title="Pause (P)">❚❚</button>
    <button id="mute" class="btn sq" title="Ton">🔊</button>
  </div>
  <div class="hud">
    <div>SCORE<b id="score">0</b></div>
    <div id="livesBox">LEBEN<b id="lives">-</b></div>
    <div>HIGH<b id="hi">0</b></div>
  </div>
  <div class="cabinet"><div class="screen"><canvas id="cv" width="640" height="480"></canvas></div></div>
  <p class="ctl" id="ctl"></p>
  <div class="touch" id="touch">
    <div class="dpad">
      <button data-k="ArrowUp" class="u">▲</button>
      <button data-k="ArrowLeft" class="l">◀</button>
      <button data-k="ArrowRight" class="r">▶</button>
      <button data-k="ArrowDown" class="d">▼</button>
    </div>
    <button data-k="Space" class="act">A</button>
  </div>
</section>

<aside id="secret" hidden aria-label="Geheimes Menü">
  <div class="s-head"><span>▓▒░ SECRET MENU ░▒▓</span><button id="s-close" class="btn sq">✕</button></div>
  <div id="s-login" class="s-body">
    <p class="s-hint">ZUGANGSCODE EINGEBEN</p>
    <input id="s-pass" type="password" autocomplete="off" spellcheck="false" placeholder="••••••">
    <button id="s-go" class="btn wide">ENTER</button>
    <p class="s-err" id="s-err"></p>
  </div>
  <div id="s-main" class="s-body" hidden>
    <div class="chips" id="s-chips"></div>
    <p class="s-hint" id="s-sub"></p>
    <div class="cheats" id="s-list"></div>
    <div class="s-actions">
      <button id="s-all" class="btn">ALLE AN</button>
      <button id="s-none" class="btn">ALLE AUS</button>
      <button id="s-restart" class="btn">NEUSTART</button>
    </div>
    <p class="s-note">Tasten <kbd>1</kbd>–<kbd>0</kbd> schalten Cheats · <kbd>`</kbd> öffnet/schließt · Mit Cheats wird kein Highscore gespeichert.</p>
  </div>
</aside>

<footer>© 1985–2026 RETRO ARCADIA &middot; <span id="heart">♥</span> GEBAUT FÜR NOSTALGIKER</footer>
<div id="toast" role="status"></div>

<script src="js/engine.js"></script>
<script src="js/dino.js"></script>
<script src="js/snake.js"></script>
<script src="js/tetris.js"></script>
<script src="js/pong.js"></script>
<script src="js/invaders.js"></script>
<script src="js/pacman.js"></script>
<script src="js/memory.js"></script>
<script src="js/breakout.js"></script>
<script src="js/flappy.js"></script>
<script src="js/mines.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
