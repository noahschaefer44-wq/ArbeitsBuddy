<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#171d21">
<title>ArbeitsBuddy – Checklisten für den Arbeitsalltag</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23f6c200'/%3E%3Cpath d='M10.5 20 17 26.5l12.5-13.500' fill='none' stroke='%231b2125' stroke-width='4.6' stroke-linecap='square'/%3E%3C/svg%3E">
<style>
/* ==========================================================
   ArbeitsBuddy – Designsystem
   Anthrazit, Signalgelb, Gebotsblau, Sicherheitsgrün
   (angelehnt an Werkstatt-Beschilderung nach ISO 7010)
   ========================================================== */

:root {
  color-scheme: light;
  --font-body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
  --font-head: "Bahnschrift", "DIN Condensed", "Barlow Condensed", "Roboto Condensed", "Arial Narrow", "DejaVu Sans Condensed", "Helvetica Neue", Arial, sans-serif;

  --bg: #e8ebe8;
  --surface: #f8f9f7;
  --surface-2: #eef1ee;
  --ink: #1b2125;
  --ink-2: #3d474c;
  --muted: #59646a;
  --line: #ccd2ce;
  --line-strong: #98a39e;

  --yellow: #f6c200;
  --yellow-hot: #ffd21f;
  --yellow-soft: #fbefb4;
  --blue: #1f5fa8;
  --blue-soft: #dae7f6;
  --green: #1b7a4b;
  --green-deep: #13603a;
  --green-soft: #d5eddf;
  --red: #b3312a;
  --red-soft: #f5dad7;
  --red-line: #d99a96;
  --graphite: #2c353b;

  --rail: #171d21;
  --rail-2: #222a2f;
  --rail-ink: #eaeeec;
  --rail-muted: #9aa6ab;

  --focus: #1f5fa8;
  --toast-bg: #1b2125;
  --toast-ink: #f3f5f3;
  --toast-link: #ffd21f;
  --track: rgba(27, 33, 37, .13);

  --r-panel: 10px;
  --r-sign: 5px;
  --r-tile: 9px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101417;
  --surface: #1a2024;
  --surface-2: #222a2f;
  --ink: #eaeeec;
  --ink-2: #c5cdca;
  --muted: #9aa6ab;
  --line: #2f383e;
  --line-strong: #56636a;

  --yellow: #ffcb0a;
  --yellow-hot: #ffdb47;
  --yellow-soft: #3a3312;
  --blue: #6aa8ee;
  --blue-soft: #1b2f47;
  --green: #4cc287;
  --green-deep: #2f9c68;
  --green-soft: #173427;
  --red: #f27a72;
  --red-soft: #3d2422;
  --red-line: #7d3f3b;
  --graphite: #48545b;

  --rail: #0b0e10;
  --rail-2: #171d21;

  --focus: #6aa8ee;
  --toast-bg: #eaeeec;
  --toast-ink: #1b2125;
  --toast-link: #1f5fa8;
  --track: rgba(234, 238, 236, .14);
}

/* ---------- Basis ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15.5px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body.no-scroll { overflow: hidden; }
h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.rail :focus-visible, .focus-mode :focus-visible, .ticket :focus-visible { outline-color: var(--yellow); }
.i { display: block; flex: none; }
.i.filled path, .i.filled polygon { fill: currentColor; }
.muted { color: var(--muted); }
.skip {
  position: fixed; left: 12px; top: -60px; z-index: 300;
  background: var(--yellow); color: #1b2125; font-weight: 700;
  padding: 10px 16px; border-radius: 7px; transition: top .15s;
}
.skip:focus { top: 12px; }

h1 { font: 600 clamp(38px, 5.4vw, 58px)/.96 var(--font-head); letter-spacing: .004em; }
h2 { font: 600 27px/1.1 var(--font-head); letter-spacing: .005em; }
h3 { font: 600 22px/1.15 var(--font-head); letter-spacing: .005em; }
.lede { color: var(--muted); margin-top: 10px; max-width: 62ch; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 0 16px;
  border: 1.5px solid var(--line-strong); border-radius: 7px;
  background: transparent; color: var(--ink);
  font-weight: 600; white-space: nowrap; text-decoration: none;
  transition: background-color .15s, border-color .15s, transform .06s;
}
.btn:hover { background: var(--surface-2); border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: var(--yellow); border-color: var(--yellow); color: #1b2125;
  box-shadow: inset 0 -3px 0 rgba(27, 33, 37, .22);
}
.btn.primary:hover { background: var(--yellow-hot); border-color: var(--yellow-hot); }
.btn.primary:active { box-shadow: inset 0 -1px 0 rgba(27, 33, 37, .22); }
.btn.danger { color: var(--red); border-color: var(--red-line); }
.btn.danger:hover { background: var(--red-soft); border-color: var(--red); }
.btn.danger.solid { background: var(--red); border-color: var(--red); color: #fff; }
.btn.danger.solid:hover { background: var(--red); filter: brightness(1.08); }
.btn.quiet { border-color: transparent; }
.btn.quiet:hover { border-color: transparent; }
.btn.small { min-height: 32px; padding: 0 11px; font-size: 14px; border-radius: 6px; }
.btn.icon { width: 40px; padding: 0; }
.btn.small.icon { width: 32px; }
.btn.big { min-height: 58px; padding: 0 30px; font-size: 20px; border-radius: 9px; }
.btn.on-dark { color: #fff; border-color: rgba(255, 255, 255, .34); }
.btn.on-dark:hover { background: rgba(255, 255, 255, .09); border-color: rgba(255, 255, 255, .6); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link-btn { color: var(--blue); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
.link-btn:hover { text-decoration-thickness: 2.5px; }

/* ---------- Layout ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }

.rail {
  position: sticky; top: 0; height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
  padding: 20px 14px 16px;
  background: var(--rail); color: var(--rail-ink);
}
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 24px; text-decoration: none; }
.brand-mark { width: 38px; height: 38px; flex: none; }
.brand-name { font: 700 24px/1 var(--font-head); white-space: nowrap; }
.brand-sub { font-size: 12.5px; color: var(--rail-muted); margin-top: 3px; }

.nav { display: grid; gap: 3px; }
.nav a {
  position: relative; display: flex; align-items: center; gap: 12px;
  min-height: 44px; padding: 0 12px; border-radius: 7px;
  color: var(--rail-muted); text-decoration: none; font-weight: 500;
}
.nav a:hover { background: rgba(255, 255, 255, .06); color: var(--rail-ink); }
.nav a[aria-current="page"] { background: rgba(255, 255, 255, .09); color: #fff; font-weight: 600; }
.nav a[aria-current="page"]::before {
  content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 4px;
  border-radius: 0 3px 3px 0; background: var(--yellow);
}
.nav .count {
  margin-left: auto; min-width: 26px; padding: 0 7px; text-align: center;
  font: 600 15px/22px var(--font-head); border-radius: 4px; background: rgba(255, 255, 255, .11); color: var(--rail-ink);
}
.nav .count.alert { background: var(--yellow); color: #1b2125; }

.rail-foot { margin-top: auto; display: grid; gap: 12px; }
.day-mini { display: block; padding: 14px; border-radius: 9px; background: var(--rail-2); text-decoration: none; }
.day-mini:hover { background: #2a343a; }
.day-mini .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px; }
.day-mini strong { font: 600 22px/1 var(--font-head); }
.day-mini span { font-size: 13.5px; color: var(--rail-muted); }
.rail .tape { height: 10px; }

.main { min-width: 0; padding: 0 clamp(16px, 3vw, 40px) 64px; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 20px 0 6px; }
.m-brand { display: none; align-items: center; gap: 9px; text-decoration: none; }
.m-brand .brand-mark { width: 34px; height: 34px; }
.search-btn {
  flex: 1; max-width: 500px; display: flex; align-items: center; gap: 10px;
  min-height: 42px; padding: 0 12px;
  border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface);
  color: var(--muted); text-align: left;
}
.search-btn:hover { border-color: var(--line-strong); }
.search-btn .grow { flex: 1; }
kbd {
  font: 600 12px/1 var(--font-body); padding: 4px 6px;
  border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px;
  background: var(--surface-2); color: var(--ink-2);
}
.top-actions { margin-left: auto; display: flex; gap: 8px; }
.page { max-width: 1240px; padding-top: 20px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }

/* ---------- Warnband und Segmente ---------- */
.tape { height: 14px; border-radius: 3px; background: var(--track); overflow: hidden; }
.tape > span {
  display: block; height: 100%; width: 0;
  background: repeating-linear-gradient(-45deg, var(--yellow) 0 9px, #1b2125 9px 18px);
  transition: width .8s var(--ease);
}
.tape.complete > span { background: repeating-linear-gradient(-45deg, var(--green) 0 9px, var(--green-deep) 9px 18px); }

.segs { display: flex; gap: 4px; align-items: center; min-width: 0; }
.seg { flex: 1; min-width: 5px; height: 10px; border-radius: 2px; background: var(--line); padding: 0; border: 0; position: relative; }
.seg.done { background: var(--green); }
.seg.next { background: var(--yellow); }
.seg.skip { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.seg.just { animation: segpop .4s var(--ease); }
button.seg::after { content: ""; position: absolute; inset: -8px -2px; }
button.seg:hover { filter: brightness(.9); }
.segs.lg .seg { height: 16px; }
.smooth { height: 10px; border-radius: 3px; background: var(--line); overflow: hidden; }
.smooth > span { display: block; height: 100%; background: var(--green); transition: width .6s var(--ease); }

/* ---------- Symbole und Chips ---------- */
.tile {
  width: 44px; height: 44px; flex: none; display: grid; place-items: center;
  border-radius: var(--r-tile); background: var(--graphite); color: #fff;
}
.tile.blue { background: var(--blue); color: #fff; }
:root[data-theme="dark"] .tile.blue { background: #2c6fbb; }
.tile.green { background: var(--green-deep); }
.tile.red { background: var(--red); color: #fff; }
:root[data-theme="dark"] .tile.red { background: #c2453d; }
.tile.yellow { background: var(--yellow); color: #1b2125; }
.tile.graphite { background: var(--graphite); }
.tile.sm { width: 32px; height: 32px; border-radius: 7px; }
.tile.lg { width: 66px; height: 66px; border-radius: 13px; }
.tile .emo { font-size: 22px; line-height: 1; }
.tile.sm .emo { font-size: 16px; }
.tile.lg .emo { font-size: 32px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px;
  border: 1px solid var(--line); border-radius: var(--r-sign);
  background: var(--surface-2); color: var(--ink-2); font-size: 13.5px; font-weight: 500; white-space: nowrap;
}
.chip.optional { border-style: dashed; border-color: var(--line-strong); background: transparent; }
.chip.tpl { background: var(--blue-soft); border-color: transparent; color: var(--blue); font-weight: 600; }
.chip.warn { background: var(--yellow-soft); border-color: transparent; color: var(--ink); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.prio { display: inline-block; flex: none; }

.state { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14.5px; color: var(--muted); }
.state.done { color: var(--green); }
.state.run { color: var(--blue); }

/* ---------- Kopf der Übersicht: Nächste Aufgabe ---------- */
.ticket {
  position: relative; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(250px, 1fr); gap: 34px;
  padding: 40px 32px 30px; border-radius: 12px; overflow: hidden;
  background: var(--rail); color: var(--rail-ink);
}
.ticket::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 10px;
  background: repeating-linear-gradient(-45deg, var(--yellow) 0 14px, #12171a 14px 28px);
}
.ticket-kicker { color: var(--rail-muted); font-weight: 500; }
.task-big { font: 600 clamp(34px, 4.8vw, 56px)/1 var(--font-head); margin: 8px 0 16px; letter-spacing: .003em; }
.ticket-from { display: flex; align-items: center; gap: 10px; color: var(--rail-muted); font-weight: 500; margin-bottom: 16px; }
.ticket-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.ticket-later { margin-top: 18px; color: var(--rail-muted); font-size: 14.5px; }
.ticket-side { align-self: end; padding-top: 6px; }
.big-num { font: 600 clamp(64px, 8vw, 96px)/.85 var(--font-head); font-variant-numeric: tabular-nums; }
.big-num small { font-size: .45em; color: var(--rail-muted); margin-left: 4px; font-weight: 500; }
.ticket-side p { color: var(--rail-muted); margin: 8px 0 14px; }
.ticket .tape { height: 16px; }
.ticket.calm .task-big { max-width: 16ch; }

.detail { display: flex; gap: 10px; padding: 10px 13px; border-radius: 7px; font-size: 14.5px; color: var(--ink-2); max-width: 66ch; }
.detail .i { margin-top: 2px; }
.detail.hint { background: var(--yellow-soft); border-left: 4px solid var(--yellow); }
.detail.note { background: var(--surface-2); }
.detail.on-dark { background: rgba(255, 210, 31, .13); color: var(--rail-ink); }

.overview-cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr); gap: 30px; margin-top: 34px; align-items: start; }
.stack { display: grid; gap: 10px; }
.lrow {
  position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(90px, 210px) auto; gap: 14px; align-items: center;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface);
  transition: border-color .15s;
}
.lrow:hover { border-color: var(--line-strong); }
.lrow a.cover { text-decoration: none; font-weight: 600; }
.lrow a.cover::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.lrow .sub { font-size: 14px; color: var(--muted); }
.lrow .pct { font: 600 20px/1 var(--font-head); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

.qstart { display: flex; gap: 10px; flex-wrap: wrap; }
.qs {
  display: inline-flex; align-items: center; gap: 10px; padding: 7px 14px 7px 7px;
  border: 1.5px solid var(--line-strong); border-radius: 9px; text-align: left; background: transparent;
  transition: background-color .15s;
}
.qs:hover { background: var(--surface); border-color: var(--ink-2); }
.qs strong { display: block; font-weight: 600; line-height: 1.2; }
.qs span.sub { font-size: 13.5px; color: var(--muted); }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 96px; padding: 4px 2px 0; }
.wd { display: grid; grid-template-rows: 1fr auto auto; justify-items: center; align-items: end; height: 100%; gap: 3px; }
.wd .bar { width: 100%; max-width: 30px; min-height: 5px; border-radius: 3px 3px 1px 1px; background: var(--line-strong); }
.wd.today .bar { background: var(--yellow); box-shadow: inset 0 0 0 1.5px var(--ink); }
.wd .cnt { font: 600 15px/1 var(--font-head); color: var(--ink-2); min-height: 15px; }
.wd .lab { font-size: 13px; color: var(--muted); }
.wd.today .lab { color: var(--ink); font-weight: 700; }
.hist { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.hist:last-child { border-bottom: 0; }
.hist .grow { flex: 1; min-width: 0; }
.hist strong { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist .sub { font-size: 13.5px; color: var(--muted); }
.hist .dur { font: 600 16px/1 var(--font-head); color: var(--ink-2); white-space: nowrap; }
.panel { border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--surface); }
.panel-pad { padding: 18px; }

/* ---------- Checklisten-Karten ---------- */
.tabs { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); }
.tabs a { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 6px; font-weight: 600; color: var(--muted); text-decoration: none; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.tabs .n { font: 600 15px/1 var(--font-head); color: var(--muted); }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.lcard {
  position: relative; display: flex; flex-direction: column; gap: 14px; padding: 18px;
  border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--surface);
  transition: border-color .15s;
}
.lcard:hover { border-color: var(--line-strong); }
.lcard .head { display: flex; gap: 13px; align-items: flex-start; }
.lcard .head > div { min-width: 0; }
.lcard h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lcard h3 a { text-decoration: none; }
.lcard h3 a::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.lcard p { color: var(--muted); font-size: 14.5px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lcard .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.lcard .foot { display: flex; align-items: center; gap: 8px; margin-top: auto; position: relative; z-index: 1; }
.lcard .foot .grow { flex: 1; }
.fav-on { color: #b78a00; }
:root[data-theme="dark"] .fav-on { color: var(--yellow); }

.empty { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 56px 20px; border: 2px dashed var(--line-strong); border-radius: 12px; }
.empty .tile { background: var(--surface-2); color: var(--muted); }
.empty h3 { font-size: 26px; }
.empty p { color: var(--muted); max-width: 46ch; }
.empty.tight { padding: 30px 20px; }

.trow { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.trow .grow { flex: 1; min-width: 0; }
.trow .grow strong { display: block; font-weight: 600; font-size: 16.5px; }
.trow .sub { color: var(--muted); font-size: 14.5px; }
.trow .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Detailansicht ---------- */
.crumb { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-weight: 600; margin-bottom: 14px; }
.crumb:hover { color: var(--ink); }
.list-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; flex-wrap: wrap; }
.list-head .who { display: flex; gap: 18px; align-items: center; min-width: 0; }
.list-head h1 { font-size: clamp(34px, 4.6vw, 50px); overflow-wrap: anywhere; }
.list-head .chips { margin-top: 10px; }
.progress-band { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 20px; align-items: center; margin: 26px 0 4px; }
.progress-band .label { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.progress-band .label strong { font: 600 26px/1 var(--font-head); font-variant-numeric: tabular-nums; }
.progress-band .label span { color: var(--muted); }
.stamp {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 5px;
  border: 3px double var(--green); border-radius: 6px; color: var(--green);
  font: 700 22px/1 var(--font-head); letter-spacing: .05em; transform: rotate(-4deg);
}
.stamp.in { animation: stamp .5s var(--ease) both; }
.tpl-note { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; padding: 14px 16px; margin: 20px 0 0; border-radius: 9px; background: var(--blue-soft); color: var(--ink); }
.tpl-note p { max-width: 60ch; }

.detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 26px; align-items: start; margin-top: 22px; }
.side { position: sticky; top: 18px; }
.side .block + .block { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; }
.side .num { font: 600 38px/1 var(--font-head); font-variant-numeric: tabular-nums; }
.side .num small { font-size: .55em; color: var(--muted); font-weight: 500; }
.side .cap { color: var(--muted); font-size: 14px; margin-top: 2px; }
.side-list { display: grid; gap: 2px; margin: 0 -8px; }
.side-list button {
  display: flex; align-items: center; gap: 11px; width: 100%; min-height: 40px; padding: 0 10px;
  border-radius: 7px; text-align: left; color: var(--ink-2); font-weight: 500;
}
.side-list button:hover { background: var(--surface-2); color: var(--ink); }
.side-list button.danger { color: var(--red); }
.side-list button.danger:hover { background: var(--red-soft); }

.quick-add { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
.filters { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; margin: 18px 0 2px; }
.fchips { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip {
  display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 12px;
  border: 1.5px solid var(--line-strong); border-radius: 999px; font-weight: 600; font-size: 14.5px; color: var(--ink-2);
}
.fchip:hover { border-color: var(--ink-2); }
.fchip .n { font: 600 15px/1 var(--font-head); opacity: .75; }
.fchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.filter-tools { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-tools .input { min-height: 34px; padding: 4px 10px; font-size: 14.5px; width: 170px; }
.filter-tools .select { min-height: 34px; padding: 4px 8px; font-size: 14.5px; width: auto; }

/* ---------- Aufgaben ---------- */
.tasks { display: grid; gap: 8px; margin-top: 14px; }
.task {
  position: relative; padding: 12px 10px 12px 14px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  transition: background-color .15s, border-color .15s;
}
.task::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 5px; border-radius: 8px 0 0 8px; background: var(--blue); }
.task.optional::before { background: repeating-linear-gradient(180deg, var(--line-strong) 0 6px, transparent 6px 10px); }
.task:hover { border-color: var(--line-strong); }
.task.done { background: var(--surface-2); }
.task.dragging { opacity: .4; }
.task.drop-before { box-shadow: 0 -3px 0 0 var(--yellow); }
.task.drop-after { box-shadow: 0 3px 0 0 var(--yellow); }
.task.flash { animation: flash 1.8s ease-out; }
.task-row { display: flex; gap: 10px; align-items: flex-start; }
.grip { display: grid; place-items: center; width: 22px; height: 28px; margin-left: -6px; color: var(--line-strong); cursor: grab; touch-action: none; }
.grip:hover { color: var(--ink-2); }
.task-body { flex: 1; min-width: 0; padding-top: 2px; }
.task-line { display: flex; gap: 8px; align-items: flex-start; }
.title { font-weight: 600; font-size: 16.5px; line-height: 1.3; overflow-wrap: anywhere;
  background: linear-gradient(currentColor, currentColor) no-repeat 0 58% / 0 2px; }
.task.done .title { color: var(--muted); background-size: 100% 2px; }
.task.skipped .title { color: var(--muted); font-style: italic; }
.task.pop .title { animation: strike .4s var(--ease); }
.task-title-btn { display: inline-flex; gap: 6px; align-items: flex-start; text-align: left; }
.task-title-btn .chev { margin-top: 3px; color: var(--muted); transition: transform .2s var(--ease); }
.task-title-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.task .chips { margin-top: 6px; }
.details { display: grid; gap: 8px; margin: 10px 0 2px; }

.check {
  position: relative; flex: none; width: 28px; height: 28px; display: grid; place-items: center;
  border: 2px solid var(--ink-2); border-radius: 6px; background: var(--surface); color: #fff;
  transition: background-color .15s, border-color .15s;
}
.check:hover { border-color: var(--ink); background: var(--surface-2); }
.check svg { width: 18px; height: 18px; overflow: visible; }
.check path { fill: none; stroke: currentColor; stroke-width: 3.4; stroke-linecap: square; stroke-linejoin: miter; stroke-dasharray: 24; stroke-dashoffset: 24; }
.check[aria-checked="true"] { background: var(--green); border-color: var(--green); }
:root[data-theme="dark"] .check[aria-checked="true"] { color: #0d2418; }
.check[aria-checked="true"] path { stroke-dashoffset: 0; }
.task.pop .check path { animation: draw .3s .04s var(--ease) both; }
.stepno { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; background: var(--surface-2); font: 600 17px/1 var(--font-head); color: var(--ink-2); font-variant-numeric: tabular-nums; }

.tact { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; margin: -2px 0 0 auto; flex: none; }
.task:hover .tact, .task:focus-within .tact { opacity: 1; }
@media (hover: none) { .tact { opacity: 1; } }

/* ---------- Heute ---------- */
.today-wrap { max-width: 860px; }
.today-sum { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 22px; align-items: center; padding: 20px 22px; border-radius: 11px; background: var(--rail); color: var(--rail-ink); margin-bottom: 26px; }
.today-sum .big-num { font-size: 64px; }
.today-sum p { color: var(--rail-muted); margin-bottom: 8px; }
.group { margin-top: 24px; }
.group-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.group-head .grow { flex: 1; min-width: 0; }
.group-head h2 { font-size: 24px; }
.group-head .sub { color: var(--muted); font-size: 14px; }

/* ---------- Einstellungen ---------- */
.settings { display: grid; gap: 16px; max-width: 820px; }
.setting { padding: 20px; border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--surface); }
.setting h3 { margin-bottom: 4px; }
.setting > p { color: var(--muted); font-size: 14.5px; margin-bottom: 14px; max-width: 60ch; }
.theme-picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.theme-pick { display: grid; gap: 8px; padding: 10px; border: 1.5px solid var(--line); border-radius: 9px; text-align: left; font-weight: 600; }
.theme-pick:hover { border-color: var(--line-strong); }
.theme-pick[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.swatch { height: 46px; border-radius: 6px; border: 1px solid var(--line); position: relative; overflow: hidden; }
.swatch::after { content: ""; position: absolute; left: 8px; right: 30%; top: 10px; height: 6px; border-radius: 2px; background: currentColor; opacity: .5; }
.swatch.light { background: #f8f9f7; color: #1b2125; }
.swatch.dark { background: #1a2024; color: #eaeeec; }
.swatch.system { background: linear-gradient(105deg, #f8f9f7 50%, #1a2024 50%); color: #7d878c; }
.toggle-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 10px 0; }
.toggle-row + .toggle-row { border-top: 1px solid var(--line); }
.toggle-row .sub { color: var(--muted); font-size: 14px; }
.switch { position: relative; flex: none; width: 48px; height: 28px; }
.switch input { appearance: none; -webkit-appearance: none; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; border-radius: 6px; background: var(--line-strong); cursor: pointer; transition: background-color .15s; }
.switch input::before { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 4px; background: #fff; transition: transform .18s var(--ease); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.switch input:checked { background: var(--green); }
:root[data-theme="dark"] .switch input:checked { background: var(--green-deep); }
.switch input:checked::before { transform: translateX(20px); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.data-facts { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 16px; }
.data-facts div { display: grid; }
.data-facts strong { font: 600 30px/1 var(--font-head); font-variant-numeric: tabular-nums; }
.data-facts span { color: var(--muted); font-size: 14px; }
.shortcut-list { display: grid; gap: 4px; }
.shortcut-list div { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.shortcut-list div:last-child { border-bottom: 0; }
.shortcut-list dt { color: var(--ink-2); }
.shortcut-list dd { display: flex; gap: 6px; }

/* ---------- Formulare und Dialoge ---------- */
.input, .select, .textarea {
  width: 100%; min-height: 42px; padding: 9px 12px;
  border: 1.5px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: var(--ink);
}
.textarea { resize: vertical; min-height: 92px; }
.input::placeholder, .textarea::placeholder { color: var(--muted); opacity: .8; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 16px; }
.field { display: grid; gap: 7px; align-content: start; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field > label, .field > .lab, legend.lab { font-weight: 600; font-size: 14.5px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend.lab { padding: 0; margin-bottom: 7px; }
.opts { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); flex-wrap: wrap; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: 6px; font-weight: 600; color: var(--muted); }
.opt input:checked + span { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.opt input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 1px; }
.picker { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.pick { position: relative; }
.pick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.pick span { display: grid; place-items: center; height: 48px; border: 1.5px solid var(--line); border-radius: 8px; color: var(--ink-2); }
.pick:hover span { border-color: var(--line-strong); }
.pick input:checked + span { border-color: var(--ink); background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
.pick input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 1px; }
.swatches { display: flex; gap: 12px; flex-wrap: wrap; }
.sw { position: relative; }
.sw input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.sw span { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: #fff; border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line-strong); }
.sw span .i { opacity: 0; }
.sw input:checked + span { box-shadow: 0 0 0 2.5px var(--ink); }
.sw input:checked + span .i { opacity: 1; }
.sw input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 3px; }
.sw .blue { background: var(--blue); } .sw .green { background: var(--green-deep); } .sw .red { background: var(--red); }
.sw .yellow { background: var(--yellow); color: #1b2125; } .sw .graphite { background: var(--graphite); }
.hint-text { font-size: 13.5px; color: var(--muted); }

.scrim { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(10, 14, 16, .58); animation: fade .15s; }
.scrim.top { place-items: start center; padding-top: min(12vh, 110px); }
.dialog { width: min(640px, 100%); max-height: min(92vh, 920px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .55); animation: rise .22s var(--ease); }
.dialog.narrow { width: min(460px, 100%); }
.dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 16px 14px 22px; border-bottom: 1px solid var(--line); }
.dialog-head h2 { font-size: 28px; }
.dialog-body { padding: 22px; overflow: auto; }
.dialog-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding: 14px 22px; border-top: 1px solid var(--line); }

.palette { width: min(660px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .55); overflow: hidden; animation: rise .2s var(--ease); }
.pal-search { display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); color: var(--muted); }
.pal-search input { flex: 1; min-height: 56px; border: 0; background: transparent; font-size: 17px; color: var(--ink); outline: none; }
.pal-list { max-height: min(58vh, 460px); overflow: auto; padding: 6px 6px 8px; }
.pal-group { padding: 10px 12px 4px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.pal-item { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 6px 12px; border-radius: 7px; cursor: pointer; }
.pal-item .grow { flex: 1; min-width: 0; }
.pal-item .grow > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-item .sub { font-size: 13.5px; color: var(--muted); }
.pal-item[aria-selected="true"] { background: var(--surface-2); box-shadow: inset 4px 0 0 var(--yellow); }
.pal-item .ic { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 7px; background: var(--surface-2); color: var(--ink-2); flex: none; }
.pal-empty { padding: 26px 16px; text-align: center; color: var(--muted); }
.pal-foot { display: flex; gap: 16px; padding: 9px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.pal-foot span { display: inline-flex; gap: 6px; align-items: center; }

.toast {
  position: fixed; left: 50%; bottom: 26px; z-index: 120; transform: translate(-50%, 18px);
  display: flex; align-items: center; gap: 16px; max-width: min(560px, calc(100vw - 32px));
  padding: 12px 16px; border-radius: 9px; background: var(--toast-bg); color: var(--toast-ink);
  font-weight: 500; opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .2s var(--ease);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: var(--toast-link); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200; }

/* ---------- Arbeitsmodus ---------- */
.focus-mode { position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column; background: var(--rail); color: var(--rail-ink); animation: fade .2s; overflow: auto; }
.focus-mode::before { content: ""; flex: none; height: 10px; background: repeating-linear-gradient(-45deg, var(--yellow) 0 14px, #12171a 14px 28px); }
.focus-top { display: flex; align-items: center; gap: 18px; padding: 22px clamp(18px, 4vw, 52px) 0; }
.focus-top .segs { flex: 1; }
.focus-top .segs .seg { background: rgba(255, 255, 255, .16); height: 8px; }
.focus-top .segs .seg.done { background: var(--green); }
.focus-top .segs .seg.now { background: var(--yellow); }
.focus-top .segs .seg.skip { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .4); }
.focus-clock { font: 600 22px/1 var(--font-head); font-variant-numeric: tabular-nums; color: var(--rail-muted); min-width: 54px; text-align: right; }
.focus-body { flex: 1; width: 100%; max-width: 1080px; margin: 0 auto; padding: 28px clamp(18px, 6vw, 80px); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
.focus-step { display: flex; gap: 12px; align-items: center; color: var(--rail-muted); font-weight: 500; }
.focus-title { font: 600 clamp(40px, 8.4vw, 92px)/.98 var(--font-head); margin: 14px 0 24px; overflow-wrap: anywhere; }
.focus-body .detail { font-size: 17px; margin-bottom: 10px; }
.focus-body .detail.note { background: rgba(255, 255, 255, .08); color: var(--rail-ink); }
.focus-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
.focus-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 0 clamp(18px, 4vw, 52px) 26px; color: var(--rail-muted); font-size: 14px; }
.focus-foot .btn { color: var(--rail-muted); border-color: transparent; }
.focus-foot .btn:hover { color: #fff; background: rgba(255, 255, 255, .08); }
.summary { display: flex; gap: 34px; flex-wrap: wrap; margin: 6px 0 24px; }
.summary div { display: grid; }
.summary strong { font: 600 56px/1 var(--font-head); font-variant-numeric: tabular-nums; }
.summary span { color: var(--rail-muted); }
.focus-mode .stamp { color: #6fe0a5; border-color: #6fe0a5; font-size: 30px; }

/* ---------- Druckansicht ---------- */
#print-root { display: none; }
.pr { font-family: var(--font-body); color: #000; }
.pr h1 { font: 700 30pt/1 var(--font-head); margin-bottom: 4pt; }
.pr .pr-sub { color: #444; margin-bottom: 14pt; }
.pr .pr-meta { display: flex; gap: 30pt; margin-bottom: 18pt; padding-bottom: 8pt; border-bottom: 2px solid #000; }
.pr .pr-meta span { flex: 1; border-bottom: 1px solid #666; padding-bottom: 2pt; color: #444; }
.pr li { display: flex; gap: 12pt; padding: 8pt 0; border-bottom: 1px solid #aaa; break-inside: avoid; }
.pr .box { width: 15pt; height: 15pt; border: 2px solid #000; flex: none; margin-top: 2pt; }
.pr .pr-t { font-weight: 600; font-size: 12pt; }
.pr .pr-o { font-size: 9.5pt; color: #444; font-weight: 500; }
.pr .pr-d { font-size: 10pt; color: #333; margin-top: 2pt; }
.pr .pr-foot { margin-top: 18pt; font-size: 9pt; color: #555; }

/* ---------- Animationen ---------- */
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.985); } }
@keyframes draw { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
@keyframes strike { from { background-size: 0 2px; } to { background-size: 100% 2px; } }
@keyframes segpop { 0% { transform: scaleY(.4); } 60% { transform: scaleY(1.5); } 100% { transform: scaleY(1); } }
@keyframes flash { from { background: var(--yellow-soft); } to { background: var(--surface); } }
@keyframes stamp { 0% { transform: rotate(-16deg) scale(1.9); opacity: 0; } 55% { opacity: 1; } 100% { transform: rotate(-4deg) scale(1); } }

:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ---------- Responsive ---------- */
@media (max-width: 1080px) {
  .detail-grid { grid-template-columns: 1fr; }
  .side { position: static; }
  .ticket { grid-template-columns: 1fr; gap: 26px; }
  .overview-cols { grid-template-columns: 1fr; }
}

@media (max-width: 820px) {
  .app { display: block; }
  .rail {
    position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; top: auto; height: auto;
    flex-direction: row; padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255, 255, 255, .08);
  }
  .rail .brand, .rail-foot { display: none; }
  .nav { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; gap: 2px; }
  .nav a { flex-direction: column; justify-content: center; gap: 3px; min-height: 54px; padding: 4px 2px; font-size: 12.5px; text-align: center; }
  .nav a[aria-current="page"]::before { left: 20%; right: 20%; top: 0; bottom: auto; width: auto; height: 3px; border-radius: 0 0 3px 3px; }
  .nav .count { position: absolute; top: 3px; right: 50%; margin: 0 -26px 0 0; min-width: 18px; padding: 0 5px; font-size: 13px; line-height: 18px; }
  .nav .count:not(.alert) { display: none; }
  .main { padding-bottom: 104px; }
  .m-brand { display: flex; }
  .search-btn kbd { display: none; }
  .toast { bottom: 88px; }
  .top-actions .btn.primary .lbl { display: none; }
  .top-actions .btn.primary { width: 42px; padding: 0; }
  .lrow { grid-template-columns: auto minmax(0, 1fr) auto; }
  .lrow .segs { display: none; }
}

@media (max-width: 620px) {
  .form { grid-template-columns: 1fr; }
  .picker { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .theme-picks { grid-template-columns: 1fr; }
  .grip { display: none; }
  .tact { flex-wrap: wrap; justify-content: flex-end; }
  .task-row { flex-wrap: wrap; }
  .task-row .task-body { flex-basis: calc(100% - 46px); }
  .tact { flex-basis: 100%; margin: 4px 0 0; }
  .ticket { padding: 34px 20px 24px; }
  .list-head .who { align-items: flex-start; }
  .tile.lg { width: 52px; height: 52px; }
  .quick-add { grid-template-columns: 1fr auto; }
  .quick-add .opts { grid-column: 1 / -1; justify-self: start; }
  .filter-tools .input { width: 130px; }
  .today-sum { grid-template-columns: 1fr; }
  .btn.big { min-height: 54px; padding: 0 22px; }
  .focus-actions .btn { flex: 1 1 auto; }
}

@media print {
  body { background: #fff; }
  #app, #modal-root, #focus-root, #palette-root, #toast, #confetti { display: none !important; }
  #print-root { display: block; }
}


/* ---------- Feinschliff ---------- */
.stamp { text-transform: uppercase; }
.progress-band .label { justify-content: flex-start; }
.toast:not(.show) { visibility: hidden; transition: opacity .18s, transform .2s var(--ease), visibility 0s .2s; }
.detail span { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.ticket .detail { color: var(--rail-ink); }

.focus-title { font-size: clamp(38px, 7.4vw, 84px); }

/* Dunkelmodus: Karten heben sich vom Grund ab */
:root[data-theme="dark"] .ticket, :root[data-theme="dark"] .today-sum { background: #1d252a; }
:root[data-theme="dark"] .ticket .tape, :root[data-theme="dark"] .today-sum .tape { background: rgba(255, 255, 255, .12); }

function starShape() {

    const a = -Math.PI / 2 + i * Math.PI / 5;

  }

}
function gearShape() {
  const n = 8, step = Math.PI * 2 / n, ro = 10, ri = 7.6, pts = [];
  for (let i = 0; i < n; i++) {
    [[-0.3, ri], [-0.17, ro], [0.17, ro], [0.3, ri]].forEach(([d, r]) => {
      const a = (i + d) * step;
      pts.push((12 + r * Math.cos(a)).toFixed(2) + " " + (12 + r * Math.sin(a)).toFixed(2));

  return `<polygon points="${pts.join(" ")}"/><circle cx="12" cy="12" r="3"/>`;

const ICONS = {
  dash: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',

  chev: '<path d="m6 9 6 6 6-6"/>',

  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',

  command: '<path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/>',

  wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',

  box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',

};
const LIST_ICONS = ["clipboard", "wrench", "gear", "helmet", "box", "bolt", "shield", "drop", "flame", "truck", "moon", "sun"];
const ICON_LABELS = { clipboard: "Klemmbrett", wrench: "Schraubenschlüssel", gear: "Zahnrad", helmet: "Schutzhelm", box: "Material", bolt: "Strom", shield: "Sicherheit", drop: "Flüssigkeit", flame: "Feuer", truck: "Transport", moon: "Feierabend", sun: "Tagesbeginn" };

function icon(name, size = 20, cls = "") {
  const body = ICONS[name];
  if (!body) return "";
  return `<svg class="i ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${body}</svg>`;
}

function prioSign(p) {
  if (p !== "high" && p !== "medium") return "";
  const label = p === "high" ? "Sehr wichtig" : "Wichtig";
  const fill = p === "high" ? 'fill="#f6c200" stroke="#1b2125"' : 'fill="none" stroke="currentColor"';
  const mark = p === "high" ? "#1b2125" : "currentColor";
  return `<svg class="prio" width="22" height="20" viewBox="0 0 24 22" role="img" aria-label="${label}"><title>${label}</title><path d="M12 1.6 22.5 20.3H1.5z" ${fill} stroke-width="1.7" stroke-linejoin="round"/><path d="M12 8v5.4M12 16.5v.1" stroke="${mark}" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>`;
}

const LOGO = `<svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><rect y="3" width="40" height="37" rx="9" fill="#a88400"/><rect width="40" height="37" rx="9" fill="#f6c200"/><path d="M10.5 19.5 17 26l12.5-14" fill="none" stroke="#1b2125" stroke-width="4.6" stroke-linecap="square"/></svg>`;

/* ==========================================================
   Datenmodell
   ========================================================== */
const COLORS = ["blue", "green", "yellow", "red", "graphite"];
const COLOR_LABELS = { blue: "Blau", green: "Grün", yellow: "Gelb", red: "Rot", graphite: "Anthrazit" };
const COLOR_MAP = { mint: "green", lavender: "graphite" };
const EMOJI_MAP = { "🔧": "wrench", "⚙️": "gear", "⚙": "gear", "🌙": "moon", "📋": "clipboard" };
const PRIOS = ["normal", "medium", "high"];
const REPEATS = ["keine", "täglich", "werktags", "wöchentlich", "monatlich"];
const SORTS = ["updated", "alpha", "favorite", "progress"];
const DEFAULT_SETTINGS = { theme: "system", animations: true, confirmDelete: true, autoRepeat: true, sort: "updated" };

function makeTask(p = {}) {
  return { id: uid(), title: "", type: "required", completed: false, skipped: false, priority: "normal", note: "", hint: "", category: "", ...p };
}
function makeList(p = {}) {
  return {
    id: uid(), title: "", description: "", icon: "clipboard", color: "blue", category: "Arbeitsablauf",
    favorite: false, archived: false, template: false, updatedAt: Date.now(), repeat: "keine",
    runId: uid(), startedAt: null, completedAt: null, tasks: [], ...p
  };
}
function makeRun(src) {
  const run = clone(src);
  run.id = uid();
  run.template = false;
  run.favorite = false;
  run.archived = false;
  run.updatedAt = Date.now();
  run.runId = uid();
  run.startedAt = null;
  run.completedAt = null;
  run.tasks = run.tasks.map(t => ({ ...t, id: uid(), completed: false, skipped: false }));
  return run;
}

function seedState() {
  const beginn = () => [
    makeTask({ title: "Arbeitsplatz vorbereiten", category: "Arbeitsplatz" }),
    makeTask({ title: "Arbeitsauftrag prüfen", priority: "high", category: "Auftrag" }),
    makeTask({ title: "Sicherheitsausrüstung kontrollieren", priority: "high", note: "Auf vollständige Schutzausrüstung achten.", category: "Sicherheit" }),
    makeTask({ title: "Maschine überprüfen", hint: "Vor dem Einschalten Schutzabdeckung kontrollieren.", category: "Maschinen" }),
    makeTask({ title: "Materialbestand kontrollieren", type: "optional", hint: "Nur nachfüllen, wenn der Bestand niedrig ist.", category: "Material" }),
    makeTask({ title: "Arbeitsplatz reinigen", type: "optional", category: "Arbeitsplatz" })
  ];
  const kontrolle = () => [
    makeTask({ title: "Ölstand kontrollieren", priority: "high", note: "Wert im erlaubten Bereich halten.", hint: "Zwischen MIN und MAX prüfen.", category: "Maschinen" }),
    makeTask({ title: "Sichtprüfung durchführen", category: "Sicherheit" }),
    makeTask({ title: "Material nachfüllen", type: "optional", hint: "Nur bei Bedarf.", category: "Material" })
  ];
  const ende = () => [
    makeTask({ title: "Auftrag abschließen", priority: "high", category: "Auftrag" }),
    makeTask({ title: "Arbeitsplatz ordentlich hinterlassen", category: "Arbeitsplatz" }),
    makeTask({ title: "Werkzeuge zurücklegen", category: "Werkzeuge" })
  ];
  const now = Date.now();
  const tplBeginn = makeList({ title: "Arbeitsbeginn", description: "Wichtige Schritte vor dem Start.", icon: "wrench", color: "blue", category: "Arbeitsablauf", template: true, repeat: "werktags", tasks: beginn(), updatedAt: now - 30000 });
  const tplKontrolle = makeList({ title: "Maschinenkontrolle", description: "Kurze Routineprüfung.", icon: "gear", color: "green", category: "Maschinen", template: true, repeat: "täglich", tasks: kontrolle(), updatedAt: now - 40000 });
  const tplEnde = makeList({ title: "Arbeitsende", description: "Ordnung und Abschluss.", icon: "moon", color: "graphite", category: "Arbeitsablauf", template: true, repeat: "werktags", tasks: ende(), updatedAt: now - 50000 });
  const runBeginn = makeRun(tplBeginn);
  runBeginn.favorite = true;
  runBeginn.updatedAt = now - 1000;
  const runKontrolle = makeRun(tplKontrolle);
  runKontrolle.updatedAt = now - 2000;
  return {
    settings: { ...DEFAULT_SETTINGS },
    checklists: [runBeginn, runKontrolle, tplBeginn, tplKontrolle, tplEnde],
    history: []
  };
}

/* ---------- Prüfen und Migrieren (Laden, Import, alte Version) ---------- */
function sanitizeTask(t) {
  if (!t || typeof t !== "object") return null;
  const title = String(t.title || "").trim();
  if (!title) return null;
  const type = t.type === "optional" ? "optional" : "required";
  const completed = !!t.completed;
  return {
    id: typeof t.id === "string" && t.id ? t.id : uid(),
    title: title.slice(0, 300),
    type,
    completed,
    skipped: type === "optional" && !completed && !!t.skipped,
    priority: PRIOS.includes(t.priority) ? t.priority : "normal",
    note: String(t.note || "").slice(0, 4000),
    hint: String(t.hint || "").slice(0, 1000),
    category: String(t.category || "").trim().slice(0, 60)
  };
}
function sanitizeList(l) {
  if (!l || typeof l !== "object") return null;
  const seen = new Set();
  const tasks = (Array.isArray(l.tasks) ? l.tasks : []).map(sanitizeTask).filter(Boolean).map(t => {
    if (seen.has(t.id)) t.id = uid();
    seen.add(t.id);
    return t;
  });
  const rawIcon = String(l.icon || "").trim();
  const iconKey = LIST_ICONS.includes(rawIcon) ? rawIcon : (EMOJI_MAP[rawIcon] || rawIcon.slice(0, 8) || "clipboard");
  const num = v => (Number.isFinite(v) ? v : null);
  return {
    id: typeof l.id === "string" && l.id ? l.id : uid(),
    title: String(l.title || "").trim().slice(0, 120) || "Ohne Titel",
    description: String(l.description || "").trim().slice(0, 400),
    icon: iconKey,
    color: COLOR_MAP[l.color] || (COLORS.includes(l.color) ? l.color : "blue"),
    category: String(l.category || "").trim().slice(0, 60) || "Arbeitsablauf",
    favorite: !!l.favorite,
    archived: !!l.archived,
    template: !!l.template,
    updatedAt: num(l.updatedAt) ?? Date.now(),
    repeat: REPEATS.includes(l.repeat) ? l.repeat : "keine",
    runId: typeof l.runId === "string" && l.runId ? l.runId : uid(),
    startedAt: num(l.startedAt),
    completedAt: num(l.completedAt),
    tasks
  };
}
function sanitizeState(raw) {
  const s = raw && typeof raw === "object" ? raw : {};
  const rs = s.settings && typeof s.settings === "object" ? s.settings : {};
  const settings = {
    theme: ["system", "light", "dark"].includes(rs.theme) ? rs.theme : DEFAULT_SETTINGS.theme,
    animations: typeof rs.animations === "boolean" ? rs.animations : DEFAULT_SETTINGS.animations,
    confirmDelete: typeof rs.confirmDelete === "boolean" ? rs.confirmDelete : DEFAULT_SETTINGS.confirmDelete,
    autoRepeat: typeof rs.autoRepeat === "boolean" ? rs.autoRepeat : DEFAULT_SETTINGS.autoRepeat,
    sort: SORTS.includes(rs.sort) ? rs.sort : DEFAULT_SETTINGS.sort
  };
  const ids = new Set();
  const checklists = (Array.isArray(s.checklists) ? s.checklists : []).map(sanitizeList).filter(Boolean).map(l => {
    if (ids.has(l.id)) l.id = uid();
    ids.add(l.id);
    return l;
  });
  const history = (Array.isArray(s.history) ? s.history : []).filter(h => h && typeof h === "object" && Number.isFinite(h.at)).map(h => ({
    id: typeof h.id === "string" ? h.id : uid(),
    runId: typeof h.runId === "string" ? h.runId : "",
    listId: typeof h.listId === "string" ? h.listId : "",
    title: String(h.title || "Checkliste").slice(0, 120),
    icon: String(h.icon || "clipboard").slice(0, 8),
    color: COLORS.includes(h.color) ? h.color : "blue",
    at: h.at,
    duration: Number.isFinite(h.duration) ? h.duration : null,
    tasks: Number.isFinite(h.tasks) ? h.tasks : 0
  })).slice(0, 200);
  return { settings, checklists, history };
}

let storageWarned = false;
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.checklists)) return sanitizeState(parsed);
    }
  } catch (e) { /* Speicher leer oder nicht lesbar: Beispieldaten laden */ }
  return seedState();
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    if (!storageWarned) {
      storageWarned = true;
      toast("Speichern im Browser ist nicht möglich. Exportiere deine Daten unter Einstellungen, damit nichts verloren geht.", { ms: 8000 });
    }
  }
}

let state = loadState();

/* ==========================================================
   Hilfsfunktionen zu Checklisten
   ========================================================== */
const getList = id => state.checklists.find(c => c.id === id);
const runs = () => state.checklists.filter(c => !c.archived && !c.template);
const templates = () => state.checklists.filter(c => !c.archived && c.template);
const touch = list => { list.updatedAt = Date.now(); };

function stats(list) {
  const req = list.tasks.filter(t => t.type === "required");
  const opt = list.tasks.filter(t => t.type === "optional");
  const reqDone = req.filter(t => t.completed).length;
  return {
    reqTotal: req.length,
    reqDone,
    optTotal: opt.length,
    optDone: opt.filter(t => t.completed).length,
    optSkipped: opt.filter(t => t.skipped).length,
    percent: req.length ? Math.round(reqDone / req.length * 100) : 0
  };
}
function isDone(list) {
  const s = stats(list);
  return !list.template && s.reqTotal > 0 && s.reqDone === s.reqTotal;
}
function dayStats() {
  let req = 0, done = 0;
  runs().forEach(l => { const s = stats(l); req += s.reqTotal; done += s.reqDone; });
  return { req, done, open: req - done, percent: req ? Math.round(done / req * 100) : 0 };
}

function sortLists(lists) {
  const by = state.settings.sort;
  return [...lists].sort((a, b) => {
    if (by === "alpha") return a.title.localeCompare(b.title, "de");
    if (by === "favorite") return Number(b.favorite) - Number(a.favorite) || b.updatedAt - a.updatedAt;
    if (by === "progress") return stats(b).percent - stats(a).percent || b.updatedAt - a.updatedAt;
    return b.updatedAt - a.updatedAt;
  });
}
function sortTasks(tasks, mode) {
  const copy = [...tasks];
  const w = { high: 0, medium: 1, normal: 2 };
  if (mode === "alpha") return copy.sort((a, b) => a.title.localeCompare(b.title, "de"));
  if (mode === "priority") return copy.sort((a, b) => (w[a.priority] ?? 2) - (w[b.priority] ?? 2));
  if (mode === "required") return copy.sort((a, b) => Number(b.type === "required") - Number(a.type === "required"));
  if (mode === "open") return copy.sort((a, b) => Number(a.completed) - Number(b.completed));
  return copy;
}

/* Abschluss einer Durchführung: Verlauf pflegen, Zeiten erfassen */
function syncCompletion(list) {
  if (list.template) return null;
  const done = isDone(list);
  if (done && !list.completedAt) {
    list.completedAt = Date.now();
    state.history.unshift({
      id: uid(), runId: list.runId, listId: list.id, title: list.title, icon: list.icon, color: list.color,
      at: list.completedAt,
      duration: list.startedAt ? list.completedAt - list.startedAt : null,
      tasks: list.tasks.filter(t => t.completed).length
    });
    state.history = state.history.slice(0, 200);
    return "finished";
  }
  if (!done && list.completedAt) {
    list.completedAt = null;
    state.history = state.history.filter(h => h.runId !== list.runId);
    return "reopened";
  }
  return null;
}
function setCompleted(list, task, value) {
  task.completed = value;
  if (value) {
    task.skipped = false;
    if (!list.startedAt) list.startedAt = Date.now();
  }
  touch(list);
  return syncCompletion(list) === "finished";
}

/* ==========================================================
   Zeit und Text
   ========================================================== */
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
function relTime(ts) {
  const d = new Date(ts);
  const diff = Math.round((startOfDay(new Date()) - startOfDay(d)) / 864e5);
  const time = new Intl.DateTimeFormat("de-DE", { hour: "2-digit", minute: "2-digit" }).format(d);
  if (diff === 0) return `heute, ${time} Uhr`;
  if (diff === 1) return `gestern, ${time} Uhr`;
  return new Intl.DateTimeFormat("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" }).format(d);
}
function fmtDuration(ms) {
  if (!Number.isFinite(ms) || ms < 0 || ms > 864e5) return "";
  const min = Math.round(ms / 60000);
  if (min < 1) return "unter 1 Min.";
  if (min < 60) return `${min} Min.`;
  return `${Math.floor(min / 60)} Std. ${String(min % 60).padStart(2, "0")} Min.`;
}
function fmtClock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
}
const REPEAT_LABEL = { "täglich": "Täglich", werktags: "Werktags", "wöchentlich": "Wöchentlich", monatlich: "Monatlich" };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

/* ==========================================================
   Zustand der Oberfläche (wird nicht gespeichert)
   ========================================================== */
const ui = {
  route: { view: "overview" },
  filter: "all", sort: "manual", q: "",
  quick: "", quickType: "required",
  expanded: new Set(),
  flash: null, pop: null, justFinished: null, scrollTo: null,
  prevPct: {},
  focus: null, palette: null, undo: null
};

function parseRoute() {
  const h = (location.hash || "").replace(/^#\/?/, "");
  const [a, b] = h.split("/");
  switch (a) {
    case "today": return { view: "today" };
    case "lists": return { view: "lists", tab: ["favorites", "archive"].includes(b) ? b : "active" };
    case "list": return getList(b) ? { view: "list", listId: b } : { view: "lists", tab: "active" };
    case "templates": return { view: "templates" };
    case "settings": return { view: "settings" };
    default: return { view: "overview" };
  }
}
function go(path) {
  if (location.hash === "#" + path) { render({ top: true }); return; }
  location.hash = path;
}

/* ==========================================================
   Bausteine
   ========================================================== */
function tile(list, size = "") {
  const known = LIST_ICONS.includes(list.icon);
  const px = size === "lg" ? 32 : size === "sm" ? 18 : 24;
  const inner = known ? icon(list.icon, px) : `<span class="emo" aria-hidden="true">${esc(list.icon)}</span>`;
  return `<span class="tile ${list.color} ${size}">${inner}</span>`;
}

function segsHtml(list, opts = {}) {
  const req = list.tasks.filter(t => t.type === "required");
  if (!req.length) return "";
  const nextId = list.template ? null : (req.find(t => !t.completed) || {}).id;
  const cells = req.map(t => {
    const cls = (t.completed ? "done" : t.id === nextId ? "next" : "") + (ui.pop === t.id ? " just" : "");
    if (opts.clickable) {
      return `<button type="button" class="seg ${cls}" data-act="jump" data-list="${list.id}" data-task="${t.id}" aria-label="${esc(t.title)}: ${t.completed ? "erledigt" : "offen"}" title="${esc(t.title)}"></button>`;
    }
    return `<span class="seg ${cls}"></span>`;
  }).join("");
  const s = stats(list);
  const attrs = opts.clickable
    ? `role="group" aria-label="Pflichtaufgaben"`
    : `role="img" aria-label="${s.reqDone} von ${s.reqTotal} Pflichtaufgaben erledigt"`;
  return `<div class="segs ${opts.large ? "lg" : ""}" ${attrs}>${cells}</div>`;
}

function bar(key, pct, cls = "tape") {
  const from = ui.prevPct[key] ?? 0;
  return `<div class="${cls}${pct === 100 ? " complete" : ""}" data-bar="${key}" data-to="${pct}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Fortschritt"><span style="width:${from}%"></span></div>`;
}

function stateLabel(list) {
  if (list.template) return `<span class="chip tpl">Vorlage</span>`;
  const s = stats(list);
  if (isDone(list)) return `<span class="state done">${icon("check", 16)} Erledigt</span>`;
  if (s.reqDone > 0) return `<span class="state run">In Arbeit</span>`;
  return `<span class="state">Offen</span>`;
}

function emptyState({ ic = "clipboard", title, text, actions = "", tight = false }) {
  return `<div class="empty ${tight ? "tight" : ""}"><span class="tile">${icon(ic, 26)}</span><h3>${esc(title)}</h3><p>${esc(text)}</p>${actions ? `<div class="btn-row" style="justify-content:center">${actions}</div>` : ""}</div>`;
}

const greeting = () => { const h = new Date().getHours(); return h < 11 ? "Guten Morgen" : h < 18 ? "Guten Tag" : "Guten Abend"; };
const dateLong = () => new Intl.DateTimeFormat("de-DE", { weekday: "long", day: "numeric", month: "long" }).format(new Date());

/* ==========================================================
   Gerüst: Seitenleiste und Kopfzeile
   ========================================================== */
function resolveTheme() {
  const t = state.settings.theme;
  if (t === "dark" || t === "light") return t;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function renderRail(route) {
  const d = dayStats();
  const cur = route.view === "list" ? (getList(route.listId)?.template ? "templates" : "lists") : route.view;
  const items = [
    ["overview", "#/", "dash", "Übersicht", 0],
    ["today", "#/today", "today", "Heute", d.open],
    ["lists", "#/lists", "clipboard", "Checklisten", 0],
    ["templates", "#/templates", "layers", "Vorlagen", 0],

    <aside class="rail">

      <nav class="nav" aria-label="Hauptnavigation">

          <a href="${href}" ${cur === id ? 'aria-current="page"' : ""}>${icon(ic, 20)}<span>${label}</span>${n ? `<span class="count alert" aria-label="${n} offen">${n}</span>` : ""}</a>`).join("")}

function renderTopbar() {
  const dark = resolveTheme() === "dark";
  return `
    <header class="topbar">
      <a class="m-brand" href="#/" aria-label="ArbeitsBuddy, zur Übersicht">${LOGO}<span class="brand-name">ArbeitsBuddy</span></a>
      <button class="search-btn" type="button" data-act="palette" aria-label="Suchen und Befehle (${MOD} K)">
        ${icon("search", 18)}<span class="grow">Suchen …</span><kbd>${MOD} K</kbd>
      </button>
      <div class="top-actions">
        <button class="btn icon" type="button" data-act="theme" aria-label="${dark ? "Helles Design einschalten" : "Dunkles Design einschalten"}" title="${dark ? "Hell" : "Dunkel"}">${icon(dark ? "sun" : "moon", 20)}</button>
        <button class="btn primary" type="button" data-act="new-list">${icon("plus", 18)}<span class="lbl">Neue Checkliste</span></button>
      </div>

}

/* ==========================================================
   Übersicht
   ========================================================== */
function nextTask() {
  const open = runs().filter(l => l.tasks.some(t => t.type === "required" && !t.completed));
  if (!open.length) return null;
  open.sort((a, b) => Number(!!b.startedAt) - Number(!!a.startedAt) || b.updatedAt - a.updatedAt);
  const list = open[0];
  const req = list.tasks.filter(t => t.type === "required");
  const task = req.find(t => !t.completed);
  const idx = req.indexOf(task);
  const later = req.slice(idx + 1).find(t => !t.completed) || null;
  return { list, task, step: idx + 1, total: req.length, later };
}

function renderTicket(d) {
  const nt = nextTask();
  if (nt) {
    const { list, task, step, total, later } = nt;
    return `
      <section class="ticket" aria-label="Nächste Aufgabe">
        <div>
          <p class="ticket-kicker">Als Nächstes</p>
          <h2 class="task-big">${esc(task.title)}</h2>
          <div class="ticket-from">${tile(list, "sm")}<span>${esc(list.title)}, Schritt ${step} von ${total}</span></div>
          ${task.hint ? `<div class="detail hint on-dark">${icon("bulb", 18)}<span>${esc(task.hint)}</span></div>` : ""}
          ${task.note ? `<div class="detail note on-dark" style="margin-top:8px">${icon("note", 18)}<span>${esc(task.note)}</span></div>` : ""}
          <div class="ticket-actions">
            <button type="button" class="btn primary big" data-act="complete" data-list="${list.id}" data-task="${task.id}">${icon("check", 24)} Erledigt</button>
            <button type="button" class="btn on-dark big" data-act="focus" data-list="${list.id}">${icon("play", 20)} Arbeitsmodus</button>
          </div>
          <p class="ticket-later">${later ? `Danach: ${esc(later.title)}` : "Danach ist diese Checkliste fertig."}</p>
        </div>
        <div class="ticket-side">
          <div class="big-num">${d.done}<small>/${d.req}</small></div>
          <p>Pflichtaufgaben heute erledigt</p>
          ${bar("ticket", d.percent)}
        </div>
      </section>`;
  }
  if (!runs().length) {
    return `
      <section class="ticket calm" aria-label="Erste Schritte">
        <div>
          <p class="ticket-kicker">Noch nichts im Einsatz</p>
          <h2 class="task-big">Starte mit einer Vorlage.</h2>
          <div class="ticket-actions">
            <a class="btn primary big" href="#/templates">Vorlage wählen</a>
            <button type="button" class="btn on-dark big" data-act="new-list">Neue Checkliste</button>
          </div>
        </div>
        <div class="ticket-side"><p>Vorlagen sparen Zeit: einmal anlegen, jeden Tag neu starten.</p></div>
      </section>`;
  }
  return `
    <section class="ticket calm" aria-label="Stand heute">
      <div>
        <p class="ticket-kicker">Stand für heute</p>
        <h2 class="task-big">Alles erledigt.</h2>
        <p class="ticket-later" style="margin-top:0">Alle Pflichtaufgaben sind abgehakt.</p>
        <div class="ticket-actions">
          <a class="btn primary big" href="#/templates">Neue Runde starten</a>
          <a class="btn on-dark big" href="#/lists">Checklisten ansehen</a>
        </div>
      </div>
      <div class="ticket-side">
        <div class="big-num">${d.done}<small>/${d.req}</small></div>
        <p>Pflichtaufgaben heute erledigt</p>
        ${bar("ticket", d.percent)}
      </div>
    </section>`;
}

function weekData() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = startOfDay(new Date());
    d.setDate(d.getDate() - i);
    days.push({ d, n: 0, today: i === 0 });
  }
  state.history.forEach(h => {
    const day = days.find(x => +x.d === +startOfDay(h.at));
    if (day) day.n++;
  });
  return days;
}

function renderOverview() {
  const d = dayStats();
  const active = runs();
  const openLists = active.filter(l => !isDone(l)).length;
  const lede = !d.req
    ? "Noch keine Checkliste im Einsatz."
    : d.open === 0
      ? "Alle Pflichtaufgaben für heute sind erledigt."
      : `${plural(d.open, "Pflichtaufgabe", "Pflichtaufgaben")} offen in ${plural(openLists, "Checkliste", "Checklisten")}.`;

  const rows = sortLists(active).slice(0, 5).map(l => {
    const s = stats(l);
    return `
      <div class="lrow">
        ${tile(l, "sm")}
        <div style="min-width:0">
          <a class="cover" href="#/list/${l.id}">${esc(l.title)}</a>
          <div class="sub">${isDone(l) ? "Erledigt" : `${s.reqDone} von ${s.reqTotal} Pflichtaufgaben`}</div>
        </div>
        ${segsHtml(l) || "<span></span>"}
        <span class="pct">${s.percent}%</span>
      </div>`;
  }).join("");

  const tpls = templates();
  const quick = tpls.length
    ? `<div class="qstart">${tpls.map(t => `
        <button type="button" class="qs" data-act="start-template" data-list="${t.id}">
          ${tile(t, "sm")}<span><strong>${esc(t.title)}</strong><span class="sub">${plural(stats(t).reqTotal, "Pflichtaufgabe", "Pflichtaufgaben")}</span></span>
        </button>`).join("")}</div>`
    : `<p class="hint-text">Noch keine Vorlagen. Speichere eine Checkliste als Vorlage, um sie täglich neu zu starten.</p>`;

  const week = weekData();
  const max = Math.max(1, ...week.map(x => x.n));
  const anyWeek = week.some(x => x.n);
  const recent = state.history.slice(0, 4);
  const hist = anyWeek || recent.length ? `
    <div class="week" role="img" aria-label="Abgeschlossene Checklisten der letzten sieben Tage">
      ${week.map(x => `
        <div class="wd ${x.today ? "today" : ""}">
          <div class="bar" style="height:${x.n ? 14 + Math.round(x.n / max * 86) : 0}%"></div>
          <span class="cnt">${x.n || ""}</span>
          <span class="lab">${new Intl.DateTimeFormat("de-DE", { weekday: "short" }).format(x.d).replace(".", "")}</span>
        </div>`).join("")}
    </div>
    <div style="margin-top:12px">
      ${recent.map(h => `
        <div class="hist">
          ${tile({ icon: h.icon, color: h.color }, "sm")}
          <div class="grow"><strong>${esc(h.title)}</strong><span class="sub">${relTime(h.at)}</span></div>
          <span class="dur">${fmtDuration(h.duration)}</span>
        </div>`).join("")}
    </div>`
    : `<p class="hint-text">Sobald du eine Checkliste abschließt, erscheint sie hier mit Datum und Dauer.</p>`;

  return `
    <div class="page-head"><div><h1>${greeting()}</h1><p class="lede">${dateLong()}. ${lede}</p></div></div>
    ${renderTicket(d)}
    <div class="overview-cols">
      <section aria-labelledby="hRun">
        <div class="sec-head"><h2 id="hRun">Laufende Checklisten</h2><a class="link-btn" href="#/lists">Alle anzeigen</a></div>
        ${rows ? `<div class="stack">${rows}</div>` : emptyState({ ic: "clipboard", tight: true, title: "Keine laufende Checkliste", text: "Starte eine Vorlage oder lege eine neue Checkliste an.", actions: `<a class="btn" href="#/templates">Vorlagen öffnen</a>` })}
      </section>
      <div class="stack" style="gap:28px">
        <section aria-labelledby="hQuick">
          <div class="sec-head"><h2 id="hQuick">Aus Vorlage starten</h2></div>
          ${quick}
        </section>
        <section aria-labelledby="hHist">
          <div class="sec-head"><h2 id="hHist">Zuletzt erledigt</h2></div>
          <div class="panel panel-pad">${hist}</div>
        </section>
      </div>
    </div>`;
}

/* ==========================================================
   Heute
   ========================================================== */
function renderToday() {
  const d = dayStats();
  const active = runs();
  const withOpen = sortLists(active).filter(l => l.tasks.some(t => !t.completed && !t.skipped));
  const finished = active.filter(l => isDone(l) && !l.tasks.some(t => !t.completed && !t.skipped));

  const groups = withOpen.map(l => {
    const open = l.tasks.filter(t => !t.completed && !t.skipped);
    const ordered = [...open.filter(t => t.type === "required"), ...open.filter(t => t.type === "optional")];
    return `
      <section class="group" aria-labelledby="g-${l.id}">
        <div class="group-head">
          ${tile(l, "sm")}
          <div class="grow"><h2 id="g-${l.id}"><a href="#/list/${l.id}" style="text-decoration:none">${esc(l.title)}</a></h2><div class="sub">${plural(open.length, "Aufgabe", "Aufgaben")} offen</div></div>
          <button type="button" class="btn small" data-act="focus" data-list="${l.id}">${icon("play", 14)} Arbeitsmodus</button>
        </div>
        <ul class="tasks">${ordered.map(t => renderTask(t, l, { compact: true })).join("")}</ul>
      </section>`;
  }).join("");

  const done = finished.length ? `
    <section class="group" aria-labelledby="gDone">
      <div class="group-head"><div class="grow"><h2 id="gDone">Abgeschlossen</h2></div></div>
      <div class="stack">${finished.map(l => `
        <div class="lrow" style="grid-template-columns:auto minmax(0,1fr) auto">
          ${tile(l, "sm")}
          <a class="cover" href="#/list/${l.id}">${esc(l.title)}</a>
          <span class="state done">${icon("check", 16)} Erledigt</span>
        </div>`).join("")}</div>
    </section>` : "";

  let body;
  if (!active.length) {
    body = emptyState({ ic: "today", title: "Für heute ist nichts geplant", text: "Starte eine Vorlage, dann erscheinen die offenen Aufgaben hier.", actions: `<a class="btn primary" href="#/templates">Vorlage wählen</a>` });
  } else if (!withOpen.length) {
    body = emptyState({ ic: "check", title: "Alles erledigt", text: "Keine offenen Aufgaben mehr. Feierabend, oder starte die nächste Runde.", actions: `<a class="btn primary" href="#/templates">Neue Runde starten</a>` }) + done;
  } else {
    body = groups + done;
  }

  return `
    <div class="today-wrap">
      <div class="page-head"><div><h1>Heute</h1><p class="lede">Nur das, was gerade noch offen ist. Pflicht steht vor Optional.</p></div></div>
      ${d.req ? `<div class="today-sum"><div class="big-num">${d.open}</div><div><p>Pflichtaufgaben noch offen</p>${bar("today", d.percent)}</div></div>` : ""}
      ${body}
    </div>`;
}

function renderLists(route) {
  const tab = route.tab;
  const active = runs();

}

/* ==========================================================
   Detailansicht einer Checkliste
   ========================================================== */
const canReorder = () => ui.filter === "all" && ui.sort === "manual" && !ui.q.trim();

function visibleTasks(list) {
  let t = list.tasks;
  const q = norm(ui.q.trim());
  if (q) t = t.filter(x => norm(`${x.title} ${x.note} ${x.hint} ${x.category}`).includes(q));
  if (ui.filter === "required") t = t.filter(x => x.type === "required");
  if (ui.filter === "optional") t = t.filter(x => x.type === "optional");
  if (ui.filter === "open") t = t.filter(x => !x.completed && !x.skipped);
  if (ui.filter === "done") t = t.filter(x => x.completed);
  return sortTasks(t, ui.sort);
}

function filterCounts(list) {
  const t = list.tasks;
  return {
    all: t.length,
    required: t.filter(x => x.type === "required").length,
    optional: t.filter(x => x.type === "optional").length,
    open: t.filter(x => !x.completed && !x.skipped).length,
    done: t.filter(x => x.completed).length
  };
}

function renderTask(t, list, o = {}) {
  const has = !!(t.note || t.hint);
  const open = has && ui.expanded.has(t.id);
  const cls = ["task", t.completed && "done", t.type === "optional" && "optional", t.skipped && "skipped", ui.pop === t.id && "pop", ui.flash === t.id && "flash"].filter(Boolean).join(" ");
  const full = !o.compact;
  const reorder = full && canReorder();

  const lead = list.template
    ? `<span class="stepno" aria-hidden="true">${list.tasks.indexOf(t) + 1}</span>`
    : `<button type="button" class="check" role="checkbox" aria-checked="${t.completed}" aria-label="${esc(t.title)}" data-act="toggle" data-list="${list.id}" data-task="${t.id}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></svg></button>`;

  const titleInner = `<span class="title">${esc(t.title)}</span>`;
  const title = has
    ? `<button type="button" class="task-title-btn" data-act="expand" data-task="${t.id}" aria-expanded="${open}" aria-controls="d-${t.id}">${titleInner}${icon("chev", 16, "chev")}</button>`
    : titleInner;

  const chips = [
    t.type === "optional" ? `<span class="chip optional">Optional</span>` : "",
    t.skipped ? `<span class="chip warn">Übersprungen</span>` : "",
    o.compact && o.showList ? `<span class="chip">${esc(list.title)}</span>` : "",
    t.category ? `<span class="chip">${esc(t.category)}</span>` : "",
    !open && t.hint ? `<span class="chip warn">${icon("bulb", 14)} Hinweis</span>` : "",
    !open && t.note ? `<span class="chip">${icon("note", 14)} Notiz</span>` : ""
  ].join("");

  const details = open ? `
    <div class="details" id="d-${t.id}">
      ${t.hint ? `<div class="detail hint">${icon("bulb", 18)}<span>${esc(t.hint)}</span></div>` : ""}
      ${t.note ? `<div class="detail note">${icon("note", 18)}<span>${esc(t.note)}</span></div>` : ""}
    </div>` : "";

  const btn = (act, label, ic, extra = "", disabled = false) =>
    `<button type="button" class="btn small icon quiet ${extra}" data-act="${act}" data-list="${list.id}" data-task="${t.id}" aria-label="${label}: ${esc(t.title)}" title="${label}" ${disabled ? "disabled" : ""}>${icon(ic, 17)}</button>`;

  const tact = full ? `
    <div class="tact">
      ${btn("edit", "Bearbeiten", "edit")}
      ${t.type === "optional" && !t.completed && !list.template ? btn("skip", t.skipped ? "Wieder öffnen" : "Überspringen", t.skipped ? "undo" : "skip") : ""}
      ${reorder ? btn("up", "Nach oben", "up", "", o.index === 0) + btn("down", "Nach unten", "down", "", o.index === o.count - 1) : ""}
      ${btn("delete", "Löschen", "trash", "danger")}
    </div>` : "";

  return `
    <li class="${cls}" id="task-${t.id}" data-tid="${t.id}">
      <div class="task-row">
        ${reorder ? `<span class="grip" title="Ziehen zum Sortieren" aria-hidden="true">${icon("grip", 18)}</span>` : ""}
        ${lead}
        <div class="task-body">
          <div class="task-line">${prioSign(t.priority)}${title}</div>
          ${chips ? `<div class="chips">${chips}</div>` : ""}
          ${details}
        </div>
        ${tact}
      </div>
    </li>`;
}

function renderTaskItems(list) {
  const items = visibleTasks(list);
  if (!list.tasks.length) {
    return emptyState({ ic: "clipboard", tight: true, title: "Noch keine Aufgaben", text: "Schreibe oben den ersten Arbeitsschritt auf und drücke Enter." });
  }
  if (!items.length) {
    return emptyState({ ic: "search", tight: true, title: "Keine Treffer", text: "Mit diesem Filter ist nichts zu sehen.", actions: `<button type="button" class="btn" data-act="filter-reset">Filter zurücksetzen</button>` });
  }
  return `<ul class="tasks" id="taskList">${items.map((t, i) => renderTask(t, list, { index: i, count: items.length })).join("")}</ul>`;
}
