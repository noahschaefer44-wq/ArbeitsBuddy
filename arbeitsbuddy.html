    const body = JSON.stringify({ data: state, version: v + 1, device: DEVICE, updated_at: new Date().toISOString() });
    let rows;
    if (!v) rows = await sbFetch("/rest/v1/app_state", { method: "POST", headers: { Prefer: "return=representation" }, body });
    else rows = await sbFetch(`${rowPath()}&version=eq.${v}`, { method: "PATCH", headers: { Prefer: "return=representation" }, body });
    if (rows && rows.length) { sync.version = v + 1; sync.dirty = false; sync.last = Date.now(); saveSync(); showSync(""); }
    else { syncBusy = false; await pullState(true); return; }
  } catch (e) { showSync(e.status ? `Sync-Fehler: ${e.message}` : "Sync: offline, wird nachgeholt"); }
  syncBusy = false;
}
/* conflict = eigene Änderung wurde abgelehnt, weil das andere Gerät schneller war */
async function pullState(conflict = false) {
  if (!sync.session || syncBusy || !navigator.onLine) return;
  syncBusy = true;
  try {
    const head = await sbFetch(`${rowPath()}&select=version`);
    const remoteV = head && head[0] ? head[0].version : 0;
    if (!remoteV) { syncBusy = false; if (!sync.version) { sync.dirty = true; saveSync(); } return pushState(); }
    if (remoteV > (sync.version || 0)) {
      const both = sync.dirty || conflict;
      if (!both && (dialogOpen() || ui.focus || /^(input|textarea|select)$/i.test((document.activeElement || {}).tagName || ""))) { syncBusy = false; return; }
      const [row] = await sbFetch(`${rowPath()}&select=data,version,device,updated_at`);
      if (both) {
        keepBackup();
        applyRemote({ ...row, data: mergeStates(row.data, JSON.parse(JSON.stringify(state))) });
        sync.dirty = true; saveSync();
        toast(`Änderungen von diesem Gerät und vom ${row.device || "anderen Gerät"} wurden zusammengeführt.`, { ms: 6000 });
      } else applyRemote(row);
    }
    showSync("");
  } catch (e) { showSync(e.status ? `Sync-Fehler: ${e.message}` : "Sync: offline"); }
  syncBusy = false;
  if (sync.dirty) pushState();
}
/* Beim ersten Anmelden: Server-Stand übernehmen oder diesen Stand hochladen */
async function firstSync() {
  const pending = sync.dirty;
  sync.version = 0; sync.dirty = false; saveSync();
  const [row] = await sbFetch(`${rowPath()}&select=data,version,device,updated_at`);
  if (!row) { sync.dirty = true; saveSync(); await pushState(); return; }
  /* Nach abgelaufener Anmeldung: hier noch nicht hochgeladene Änderungen behalten */
  if (pending) { keepBackup(); applyRemote({ ...row, data: mergeStates(row.data, JSON.parse(JSON.stringify(state))) }); sync.dirty = true; saveSync(); await pushState(); }
  else applyRemote(row);
}
async function signIn(create) {
  let email = $("#syEmail").value.trim().toLowerCase();
  const password = $("#syPass").value;
  if (email && !email.includes("@")) email += "@azubino.app"; /* Benutzername ohne @, z. B. „admin“ */
  if (!email || password.length < 6) { toast("Bitte E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben."); return; }
  try {
    if (create) {
      const b = await sbFetch("/auth/v1/signup", { method: "POST", body: JSON.stringify({ email, password }) }, false);
      if (!b || !b.access_token) { toast("Konto angelegt. Bitte den Link in der Bestätigungs-Mail anklicken und dich dann hier anmelden.", { ms: 9000 }); return; }
      setSession(b);
    } else setSession(await sbFetch("/auth/v1/token?grant_type=password", { method: "POST", body: JSON.stringify({ email, password }) }, false));
    /* Daten eines anderen Kontos nie übernehmen oder hochladen */
    const me = sync.session.user.id;
    if (!sync.owner && hasContent()) sync.dirty = true; /* Stand aus der Zeit vor der Anmeldepflicht: zusammenführen */
    else if (sync.owner !== me) { wipeLocal(); sync.dirty = false; }
    sync.owner = me; saveSync();
    render();
    await firstSync();
    render();
  } catch (e) {
    const m = e.message || "";
    toast(/invalid login/i.test(m) ? "E-Mail oder Passwort falsch."
      : /not confirmed/i.test(m) ? "Bitte zuerst den Link in der Bestätigungs-Mail anklicken."
      : /signups? not allowed|signup.*disabled/i.test(m) ? "Neue Konten sind in Supabase gerade ausgeschaltet. Bitte „Allow new users to sign up“ kurz einschalten."
      : /already registered|already exists/i.test(m) ? "Für diese E-Mail gibt es schon ein Konto. Bitte auf „Anmelden“ klicken."
      : /rate limit|too many/i.test(m) ? "Zu viele Versuche. Bitte ein paar Minuten warten."
      : /password/i.test(m) ? `Passwort nicht erlaubt: ${m}`
      : !e.status ? "Keine Verbindung zum Server. Bitte Internet prüfen und die Seite neu laden."
      : `Anmeldung fehlgeschlagen: ${m}`, { ms: 9000 });
  }
}
async function signOut() {
  try { await sbFetch("/auth/v1/logout", { method: "POST" }); } catch (e) { /* offline */ }
  if (sync.dirty) await pushState();
  sync = {}; saveSync(); wipeLocal(); location.hash = ""; render();
}
function renderSyncSetting() {
  const backup = (() => { try { return JSON.parse(localStorage.getItem(BACKUP_KEY)); } catch (e) { return null; } })();
  return `
      <section class="setting">
        <h3>Synchronisierung PC ↔ Handy</h3>
        ${sync.session ? `
          <p>Angemeldet als <strong>${esc(sync.session.user.email)}</strong> auf diesem ${DEVICE}. Änderungen werden automatisch abgeglichen: beim Öffnen, beim Zurückwechseln in die App und alle 30 Sekunden. Offline wird später nachgeholt.</p>
          <p class="hint-text" style="margin-bottom:12px">${esc(syncLabel())}</p>
          <div class="btn-row"><button type="button" class="btn primary" data-act="sync-now">Jetzt synchronisieren</button><button type="button" class="btn" data-act="sync-logout">Abmelden</button>${backup ? `<button type="button" class="btn" data-act="sync-backup">Sicherung vom ${fmtD(dkey(backup.at))} herunterladen</button>` : ""}</div>`
        : `
          <p>Melde dich auf PC und Handy mit demselben Konto an, dann sind deine Daten auf beiden Geräten gleich. Gespeichert wird bei Supabase (Server in Frankfurt), nur dein Login hat Zugriff.</p>
          <form class="form" id="syncForm" autocomplete="on">
            <div class="field"><label for="syEmail">E-Mail oder Benutzername</label><input class="input" id="syEmail" type="text" autocomplete="username" autocapitalize="none"></div>
            <div class="field"><label for="syPass">Passwort</label><input class="input" id="syPass" type="password" autocomplete="current-password" minlength="6"></div>
            <div class="btn-row" style="grid-column:1/-1"><button type="submit" class="btn primary">Anmelden</button><button type="button" class="btn" data-act="sync-signup">Konto erstellen</button></div>
          </form>`}
      </section>`;
}
function setupSync() {
  const pull = () => { if (sync.session && document.visibilityState === "visible") pullState(); };
  document.addEventListener("visibilitychange", pull);
  window.addEventListener("online", () => { if (sync.session) { pushState(); pullState(); } });
  window.addEventListener("focus", pull);
  setInterval(pull, 30000);
  pull();
}

/* Web-App: Offline-Speicher und dauerhafter Speicher (nicht über file://) */
function setupWebApp() {
  if (!/^https?:$/.test(location.protocol)) return;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
const installed = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function init() {
  setupWebApp();
  const rolled = rollRepeats();
  saveState(!rolled);
  window.addEventListener("hashchange", () => { if (!ui.focus) { closeDialog(); render({ top: true }); } });
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const onScheme = () => { if (state.settings.theme === "system") render(); };
  if (mq.addEventListener) mq.addEventListener("change", onScheme); else if (mq.addListener) mq.addListener(onScheme);
  window.addEventListener("storage", e => { if (e.key === STORAGE_KEY && !ui.focus && !dialogOpen() && !ui.palette) { state = loadState(); render(); } });
  render({ top: true, initial: true });
  setupSync();
  if (sync.session && state.settings.profile.setupDone) refreshFerien().then(ok => { if (ok) render(); });
  setInterval(() => {
    if (stampState() === "none") return;
    const v = `${fmtHM(liveMins(state.days[todayKey()]))} Std.`;
    ["#liveWork", "#liveTile"].forEach(sel => { const el = $(sel); if (el) el.textContent = v; });
  }, 20000);
  if (rolled) toast(`${plural(rolled, "wiederkehrende Checkliste wurde", "wiederkehrende Checklisten wurden")} für heute zurückgesetzt.`, { ms: 5000 });
}
init();

})();
</script>
