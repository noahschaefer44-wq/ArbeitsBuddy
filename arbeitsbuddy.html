<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArbeitsBuddy – Checklisten</title>
<style>
  :root {
    --bg: #f6f7fb;
    --panel: #ffffff;
    --panel-soft: #f9fafc;
    --text: #202733;
    --muted: #697386;
    --border: #e6e9ef;
    --accent: #7897ff;
    --accent-soft: #edf1ff;
    --mint: #78c9b2;
    --mint-soft: #eaf8f4;
    --yellow: #e5bf67;
    --yellow-soft: #fff7df;
    --red: #d98282;
    --red-soft: #fff0f0;
    --lavender: #a995df;
    --lavender-soft: #f3effd;
    --shadow: 0 10px 30px rgba(33, 43, 60, 0.06);
    --radius: 18px;
    --sidebar: 248px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  button, input, textarea, select { font: inherit; }
  button { cursor: pointer; }
  input, textarea, select {
    width: 100%;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 12px;
    padding: 11px 13px;
    outline: none;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea { resize: vertical; min-height: 90px; }

  .app {
    display: flex;
    min-height: 100vh;
  }

  .sidebar {
    width: var(--sidebar);
    padding: 22px 16px;
    background: rgba(255,255,255,.78);
    border-right: 1px solid var(--border);
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 0 8px 24px;
  }
  .brand-mark {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: var(--accent-soft);
    color: #5d7df2;
    font-size: 21px;
  }
  .brand-title { font-weight: 800; letter-spacing: -.02em; }
  .brand-subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .nav {
    display: grid;
    gap: 6px;
  }
  .nav-btn {
    border: 0;
    background: transparent;
    color: var(--muted);
    text-align: left;
    padding: 11px 12px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-btn:hover { background: var(--panel-soft); color: var(--text); }
  .nav-btn.active {
    background: var(--accent-soft);
    color: #4f6fd8;
    font-weight: 700;
  }

  .sidebar-footer {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 18px;
    display: grid;
    gap: 8px;
  }

  .main {
    flex: 1;
    min-width: 0;
  }
  .topbar {
    padding: 22px 30px 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  .search {
    flex: 1 1 340px;
    max-width: 650px;
    position: relative;
  }
  .search input { padding-left: 40px; }
  .search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  .top-actions { display: flex; gap: 9px; align-items: center; }

  .content {
    padding: 16px 30px 40px;
    max-width: 1400px;
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: end;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: clamp(28px, 4vw, 38px); line-height: 1.05; letter-spacing: -.03em; }
  h2 { font-size: 22px; letter-spacing: -.02em; }
  h3 { font-size: 17px; }
  .subtle { color: var(--muted); margin-top: 7px; font-size: 14px; }

  .btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 10px 13px;
    border-radius: 12px;
    transition: .16s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .btn.primary {
    border-color: transparent;
    background: #6f8ef6;
    color: #fff;
  }
  .btn.soft { background: var(--accent-soft); border-color: transparent; color: #5c74cc; }
  .btn.danger { background: var(--red-soft); color: #9d5c5c; border-color: transparent; }
  .btn.icon-btn {
    width: 40px; height: 40px; padding: 0; display: grid; place-items: center;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 13px;
    margin: 14px 0 22px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 18px;
    border-radius: var(--radius);
  }
  .stat-label { color: var(--muted); font-size: 13px; }
  .stat-value { font-size: 28px; font-weight: 800; margin-top: 3px; }
  .stat-note { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .section { margin-top: 24px; }
  .section-head {
    display: flex;
    gap: 10px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 15px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .checklist-card {
    padding: 17px;
    display: flex;
    flex-direction: column;
    gap: 13px;
    min-width: 0;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .checklist-title {
    display: flex;
    gap: 11px;
    align-items: flex-start;
    min-width: 0;
  }
  .emoji-box {
    width: 42px; height: 42px;
    display: grid; place-items: center;
    border-radius: 13px;
    flex: none;
    background: var(--accent-soft);
    font-size: 20px;
  }
  .checklist-title h3 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .checklist-title p {
    color: var(--muted); font-size: 12px; margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .status {
    font-size: 11px;
    font-weight: 800;
    border-radius: 999px;
    padding: 5px 8px;
    white-space: nowrap;
  }
  .status.complete { background: var(--mint-soft); color: #508d79; }
  .status.progress { background: var(--accent-soft); color: #5c74cc; }
  .status.idle { background: #f2f3f6; color: var(--muted); }

  .progress-track {
    height: 9px;
    border-radius: 999px;
    overflow: hidden;
    background: #eef0f4;
  }
  .progress-bar {
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #7c97f6, #8ec5af);
    transition: width .22s ease;
  }
  .progress-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
  }
  .card-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .card-actions .btn { flex: 1; min-width: 0; }

  .empty {
    text-align: center;
    padding: 45px 18px;
    border: 1px dashed #d7dce6;
    border-radius: var(--radius);
    background: rgba(255,255,255,.55);
  }
  .empty-icon { font-size: 35px; margin-bottom: 8px; }
  .empty p { color: var(--muted); margin: 8px auto 16px; max-width: 460px; }

  .checklist-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 305px;
    gap: 17px;
    align-items: start;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .panel-pad { padding: 18px; }

  .check-head {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: flex-start;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .check-head-left {
    display: flex; gap: 12px; align-items: flex-start; min-width: 0;
  }
  .check-head h2 { font-size: 25px; }
  .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag {
    padding: 5px 8px;
    border-radius: 999px;
    background: #f2f4f8;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }

  .quick-add {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    margin: 14px 0 12px;
  }
  .task-list { display: grid; gap: 8px; }
  .task {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    background: #fff;
    transition: .15s ease;
  }
  .task:hover { border-color: #d6dbe7; }
  .task.done { background: #fbfcfd; }
  .task.dragging { opacity: .55; }
  .task-main {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .task-check {
    width: 23px; height: 23px;
    margin-top: 1px;
    border-radius: 8px;
    border: 1.5px solid #b9c1ce;
    background: #fff;
    display: grid; place-items: center;
    padding: 0;
    flex: none;
  }
  .task-check.checked {
    background: #7fbea9;
    border-color: #7fbea9;
    color: #fff;
  }
  .task-body { min-width: 0; flex: 1; }
  .task-title {
    font-weight: 700;
    line-height: 1.35;
    word-break: break-word;
  }
  .task.done .task-title { text-decoration: line-through; color: #8b93a3; }
  .task-meta {
    display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px;
  }
  .pill {
    font-size: 10px;
    font-weight: 800;
    padding: 4px 7px;
    border-radius: 999px;
  }
  .pill.required { background: var(--red-soft); color: #9d5d5d; }
  .pill.optional { background: var(--yellow-soft); color: #927238; }
  .pill.priority-high { background: var(--lavender-soft); color: #7562ad; }
  .pill.note { background: var(--mint-soft); color: #588a7b; }
  .task-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .task-actions .btn { padding: 7px 9px; font-size: 12px; }
  .task-details {
    margin-top: 10px;
    background: #fafbfd;
    border-radius: 11px;
    padding: 10px 11px;
    border: 1px solid #edf0f4;
    color: #596274;
    font-size: 13px;
    line-height: 1.5;
  }
  .task-note { margin-top: 7px; }
  .task-hint {
    margin-top: 7px;
    padding-left: 8px;
    border-left: 3px solid #e5bf67;
  }

  .side-card { padding: 16px; }
  .side-block + .side-block { border-top: 1px solid var(--border); margin-top: 15px; padding-top: 15px; }
  .side-title { font-weight: 800; font-size: 13px; margin-bottom: 9px; }
  .side-list { display: grid; gap: 8px; }
  .side-list button {
    width: 100%; text-align: left;
    border: 0; background: transparent; color: var(--muted);
    padding: 7px 0;
  }
  .side-list button:hover { color: var(--text); }
  .summary-number { font-size: 22px; font-weight: 800; }

  .templates {
    display: grid;
    gap: 10px;
  }
  .template-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 14px;
  }
  .template-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .template-info span:last-child { min-width: 0; }
  .template-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .settings-grid { display: grid; gap: 15px; max-width: 820px; }
  .setting {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .setting h3 { margin-bottom: 5px; }
  .setting p { color: var(--muted); font-size: 13px; margin-bottom: 11px; }
  .setting-row { display: flex; gap: 9px; flex-wrap: wrap; }

  .toggle-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 8px 0;
  }
  .switch {
    width: 46px; height: 26px; position: relative;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0;
    background: #d9dde5; border-radius: 999px;
    transition: .15s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 20px; height: 20px; left: 3px; top: 3px;
    background: white; border-radius: 50%;
    transition: .15s;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .switch input:checked + .slider { background: #7f95ef; }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(26,33,45,.35);
    display: grid;
    place-items: center;
    padding: 16px;
    z-index: 50;
  }
  .modal {
    width: min(680px, 100%);
    max-height: 90vh;
    overflow: auto;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 24px 80px rgba(20, 27, 40, .2);
    border: 1px solid rgba(255,255,255,.5);
  }
  .modal-head {
    padding: 17px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .modal-body { padding: 18px; }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .full { grid-column: 1 / -1; }
  .field { display: grid; gap: 6px; }
  .field label { font-size: 12px; font-weight: 800; color: #505968; }
  .modal-actions {
    padding: 15px 18px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap;
  }

  .toast {
    position: fixed; right: 18px; bottom: 18px; z-index: 100;
    padding: 11px 13px;
    background: #202733; color: white;
    border-radius: 12px;
    box-shadow: var(--shadow);
    font-size: 13px;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: .18s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  .dark {
    --bg: #14171d;
    --panel: #1b2028;
    --panel-soft: #222832;
    --text: #eef1f5;
    --muted: #9ca6b6;
    --border: #2d3542;
    --accent-soft: #252d45;
    --mint-soft: #20372f;
    --yellow-soft: #38311e;
    --red-soft: #3b2426;
    --lavender-soft: #30294a;
  }
  .dark .sidebar, .dark input, .dark textarea, .dark select, .dark .modal { background: var(--panel); }
  .dark .task, .dark .stat, .dark .setting { background: var(--panel); }
  .dark .task-details { background: #171b22; border-color: #252d38; }
  .dark .search input { background: var(--panel); }
  .dark .btn { background: var(--panel); color: var(--text); }
  .dark .btn.primary { background: #6f8ef6; color: #fff; }
  .dark .empty { background: rgba(27,32,40,.4); }

  @media (max-width: 1100px) {
    .cards { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .checklist-layout { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
  }
  @media (max-width: 760px) {
    .app { display: block; }
    .sidebar {
      width: 100%;
      height: auto;
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 10px 12px;
      border-right: 0;
      border-bottom: 1px solid var(--border);
    }
    .brand { padding: 3px 4px 10px; }
    .sidebar-footer { position: static; margin-top: 9px; }
    .nav {
      display: flex;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .nav-btn { white-space: nowrap; flex: none; }
    .topbar, .content { padding-left: 14px; padding-right: 14px; }
    .topbar { padding-top: 14px; }
    .cards { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .full { grid-column: auto; }
  }
  @media (max-width: 450px) {
    .stats { grid-template-columns: 1fr; }
    h1 { font-size: 29px; }
    .top-actions { width: 100%; }
    .top-actions .btn { flex: 1; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "arbeitsbuddy_v1";

  const defaultData = {
    settings: {
      theme: "system",
      animations: true,
      confirmDelete: true,
      sort: "updated"
    },
    activeView: "overview",
    selectedChecklistId: null,
    checklists: [
      {
        id: crypto.randomUUID(),
        title: "Arbeitsbeginn",
        description: "Wichtige Schritte vor dem Start.",
        icon: "🔧",
        color: "blue",
        category: "Arbeitsablauf",
        favorite: true,
        archived: false,
        template: true,
        updatedAt: Date.now(),
        repeat: "werktags",
        tasks: [
          { id: crypto.randomUUID(), title: "Arbeitsplatz vorbereiten", type: "required", completed: false, skipped: false, priority: "normal", note: "", hint: "", category: "Arbeitsplatz" },
          { id: crypto.randomUUID(), title: "Arbeitsauftrag prüfen", type: "required", completed: false, skipped: false, priority: "high", note: "", hint: "", category: "Auftrag" },
          { id: crypto.randomUUID(), title: "Sicherheitsausrüstung kontrollieren", type: "required", completed: false, skipped: false, priority: "high", note: "Auf vollständige Schutzausrüstung achten.", hint: "", category: "Sicherheit" },
          { id: crypto.randomUUID(), title: "Maschine überprüfen", type: "required", completed: false, skipped: false, priority: "normal", note: "", hint: "Vor dem Einschalten Schutzabdeckung kontrollieren.", category: "Maschinen" },
          { id: crypto.randomUUID(), title: "Materialbestand kontrollieren", type: "optional", completed: false, skipped: false, priority: "normal", note: "", hint: "Nur nachfüllen, wenn der Bestand niedrig ist.", category: "Material" },
          { id: crypto.randomUUID(), title: "Arbeitsplatz reinigen", type: "optional", completed: false, skipped: false, priority: "normal", note: "", hint: "", category: "Arbeitsplatz" }
        ]
      },
      {
        id: crypto.randomUUID(),
        title: "Maschinenkontrolle",
        description: "Kurze Routineprüfung.",
        icon: "⚙️",
        color: "mint",
        category: "Maschinen",
        favorite: false,
        archived: false,
        template: true,
        updatedAt: Date.now() - 10000,
        repeat: "täglich",
        tasks: [
          { id: crypto.randomUUID(), title: "Ölstand kontrollieren", type: "required", completed: false, skipped: false, priority: "high", note: "Wert im erlaubten Bereich halten.", hint: "Zwischen MIN und MAX prüfen.", category: "Maschinen" },
          { id: crypto.randomUUID(), title: "Sichtprüfung durchführen", type: "required", completed: false, skipped: false, priority: "normal", note: "", hint: "", category: "Sicherheit" },
          { id: crypto.randomUUID(), title: "Material nachfüllen", type: "optional", completed: false, skipped: false, priority: "normal", note: "", hint: "Nur bei Bedarf.", category: "Material" }
        ]
      },
      {
        id: crypto.randomUUID(),
        title: "Arbeitsende",
        description: "Ordnung und Abschluss.",
        icon: "🌙",
        color: "lavender",
        category: "Arbeitsablauf",
        favorite: false,
        archived: false,
        template: false,
        updatedAt: Date.now() - 20000,
        repeat: "werktags",
        tasks: [
          { id: crypto.randomUUID(), title: "Auftrag abschließen", type: "required", completed: false, skipped: false, priority: "high", note: "", hint: "", category: "Auftrag" },
          { id: crypto.randomUUID(), title: "Arbeitsplatz ordentlich hinterlassen", type: "required", completed: false, skipped: false, priority: "normal", note: "", hint: "", category: "Arbeitsplatz" },
          { id: crypto.randomUUID(), title: "Werkzeuge zurücklegen", type: "required", completed: false, skipped: false, priority: "normal", note: "", hint: "", category: "Werkzeuge" }
        ]
      }
    ],
    history: []
  };

  let state = loadState();
  let toastTimer = null;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return structuredClone(defaultData);
      const parsed = JSON.parse(raw);
      return {
        ...structuredClone(defaultData),
        ...parsed,
        settings: { ...defaultData.settings, ...(parsed.settings || {}) },
        checklists: Array.isArray(parsed.checklists) ? parsed.checklists : structuredClone(defaultData.checklists),
        history: Array.isArray(parsed.history) ? parsed.history : []
      };
    } catch {
      return structuredClone(defaultData);
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function esc(v="") {
    return String(v).replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[ch]));
  }

  function getChecklist(id) {
    return state.checklists.find(c => c.id === id);
  }

  function requiredStats(list) {
    const req = list.tasks.filter(t => t.type === "required");
    const done = req.filter(t => t.completed);
    const optional = list.tasks.filter(t => t.type === "optional");
    const optionalDone = optional.filter(t => t.completed);
    const optionalSkipped = optional.filter(t => t.skipped);
    return {
      reqTotal: req.length,
      reqDone: done.length,
      optionalTotal: optional.length,
      optionalDone: optionalDone.length,
      optionalSkipped: optionalSkipped.length,
      percent: req.length ? Math.round(done.length / req.length * 100) : 0
    };
  }

  function allRequiredDone(list) {
    const s = requiredStats(list);
    return s.reqTotal > 0 && s.reqDone === s.reqTotal;
  }

  function formatDate(ts) {
    return new Intl.DateTimeFormat("de-DE", { day:"2-digit", month:"2-digit", year:"numeric" }).format(new Date(ts));
  }

  function getThemeClass() {
    if (state.settings.theme === "dark") return "dark";
    if (state.settings.theme === "light") return "";
    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "";
  }

  function iconColor(color) {
    return ({
      blue: "var(--accent-soft)",
      mint: "var(--mint-soft)",
      yellow: "var(--yellow-soft)",
      lavender: "var(--lavender-soft)",
      red: "var(--red-soft)"
    })[color] || "var(--accent-soft)";
  }

  function navigate(view) {
    state.activeView = view;
    state.selectedChecklistId = null;
    saveState();
    render();
  }

  function selectChecklist(id) {
    state.selectedChecklistId = id;
    state.activeView = "checklist";
    saveState();
    render();
  }

  function toast(message) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  function render() {
    document.body.className = getThemeClass();
    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="app">
        ${renderSidebar()}
        <main class="main">
          ${renderTopbar()}
          <div class="content">${renderView()}</div>
        </main>
      </div>
    `;
    bindGlobalEvents();
  }

  function renderSidebar() {
    const items = [
      ["overview","🏠","Übersicht"],
      ["checklists","📋","Meine Checklisten"],
      ["today","📅","Heute"],
      ["favorites","⭐","Favoriten"],
      ["templates","📚","Vorlagen"],
      ["archive","📦","Archiv"],
      ["settings","⚙️","Einstellungen"]
    ];
    return `
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">✓</div>
          <div>
            <div class="brand-title">ArbeitsBuddy</div>
            <div class="brand-subtitle">Dein digitales Arbeitsgedächtnis</div>
          </div>
        </div>
        <nav class="nav">
          ${items.map(([id, icon, label]) => `
            <button class="nav-btn ${state.activeView===id ? "active":""}" data-nav="${id}" type="button">
              <span>${icon}</span><span>${label}</span>
            </button>`).join("")}
        </nav>
        <div class="sidebar-footer">
          <button class="btn soft" id="newChecklistBtn" type="button">＋ Neue Checkliste</button>
        </div>
      </aside>
    `;
  }

  function renderTopbar() {
    return `
      <header class="topbar">
        <div class="search">
          <span class="search-icon">⌕</span>
          <input id="globalSearch" type="search" placeholder="Checklisten, Aufgaben oder Notizen suchen..." aria-label="Globale Suche">
        </div>
        <div class="top-actions">
          <button class="btn icon-btn" id="themeBtn" type="button" title="Darstellung">${state.settings.theme === "dark" ? "☀️" : "🌙"}</button>
          <button class="btn primary" id="quickAddBtn" type="button">＋ Aufgabe</button>
        </div>
      </header>
    `;
  }

  function renderView() {
    switch (state.activeView) {
      case "checklists": return renderChecklistOverview("Meine Checklisten", state.checklists.filter(c => !c.archived && !c.template));
      case "today": return renderToday();
      case "favorites": return renderChecklistOverview("Favoriten", state.checklists.filter(c => !c.archived && c.favorite));
      case "templates": return renderTemplates();
      case "archive": return renderChecklistOverview("Archiv", state.checklists.filter(c => c.archived));
      case "settings": return renderSettings();
      case "checklist": return renderChecklistDetail();
      default: return renderDashboard();
    }
  }

  function renderDashboard() {
    const active = state.checklists.filter(c => !c.archived);
    const activeTasks = active.flatMap(c => c.tasks);
    const requiredOpen = activeTasks.filter(t => t.type==="required" && !t.completed).length;
    const requiredDone = activeTasks.filter(t => t.type==="required" && t.completed).length;
    const favorite = active.filter(c=>c.favorite).slice(0,4);
    return `
      <div class="page-header">
        <div>
          <h1>Guten Morgen 👋</h1>
          <p class="subtle">Was steht heute an?</p>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="stat-label">Aktive Checklisten</div><div class="stat-value">${active.length}</div><div class="stat-note">ohne Archiv</div></div>
        <div class="stat"><div class="stat-label">Pflichtaufgaben offen</div><div class="stat-value">${requiredOpen}</div><div class="stat-note">heute im Blick behalten</div></div>
        <div class="stat"><div class="stat-label">Pflichtaufgaben erledigt</div><div class="stat-value">${requiredDone}</div><div class="stat-note">über alle aktiven Listen</div></div>
        <div class="stat"><div class="stat-label">Vorlagen</div><div class="stat-value">${state.checklists.filter(c=>c.template).length}</div><div class="stat-note">wiederverwendbar</div></div>
      </div>

      <div class="section">
        <div class="section-head"><h2>Meine aktuellen Checklisten</h2><button class="btn" data-nav="checklists" type="button">Alle anzeigen</button></div>
        ${active.length ? `<div class="cards">${sortChecklists(active).slice(0,6).map(renderChecklistCard).join("")}</div>` : renderEmpty("📋","Noch keine Checklisten","Erstelle deine erste Arbeits-Checkliste.","newChecklist")}
      </div>

      <div class="section">
        <div class="section-head"><h2>Schnellzugriff</h2></div>
        ${favorite.length ? `<div class="cards">${favorite.map(renderChecklistCard).join("")}</div>` : `
          <div class="empty">
            <div class="empty-icon">⭐</div>
            <h3>Noch keine Favoriten</h3>
            <p>Markiere wichtige Arbeitsabläufe als Favorit, damit du sie schneller findest.</p>
          </div>`}
      </div>
    `;
  }

  function renderChecklistOverview(title, lists) {
    const filtered = sortChecklists(lists);
    return `
      <div class="page-header">
        <div>
          <h1>${esc(title)}</h1>
          <p class="subtle">${filtered.length} Eintrag${filtered.length===1?"":"träge"}</p>
        </div>
        <button class="btn primary" id="newChecklistBtn2" type="button">＋ Neue Checkliste</button>
      </div>
      ${filtered.length ? `<div class="cards">${filtered.map(renderChecklistCard).join("")}</div>` :
        renderEmpty(title==="Archiv"?"📦":"📋", title==="Archiv"?"Archiv ist leer":"Noch keine Checklisten", title==="Archiv"?"Abgeschlossene Listen erscheinen hier, wenn du sie archivierst.":"Erstelle deinen ersten Arbeitsablauf.","newChecklist")}
    `;
  }

  function renderChecklistCard(list) {
    const s = requiredStats(list);
    const complete = allRequiredDone(list);
    return `
      <article class="card checklist-card">
        <div class="card-top">
          <div class="checklist-title">
            <div class="emoji-box" style="background:${iconColor(list.color)}">${esc(list.icon || "📋")}</div>
            <div style="min-width:0">
              <h3>${esc(list.title)}</h3>
              <p>${esc(list.description || "Keine Beschreibung")}</p>
            </div>
          </div>
          <span class="status ${complete ? "complete" : s.reqDone ? "progress":"idle"}">${complete ? "✓ Fertig" : s.reqDone ? "In Arbeit":"Offen"}</span>
        </div>
        <div class="progress-track"><div class="progress-bar" style="width:${s.percent}%"></div></div>
        <div class="progress-row">
          <span>${s.reqDone}/${s.reqTotal || 0} Pflichtaufgaben</span>
          <span>${s.percent}%</span>
        </div>
        <div class="progress-row">
          <span>${s.optionalTotal} optional</span>
          <span>${s.optionalSkipped} übersprungen</span>
        </div>
        <div class="card-actions">
          <button class="btn soft" data-open="${list.id}" type="button">Öffnen</button>
          <button class="btn" data-template-start="${list.id}" type="button">${list.template ? "▶ Starten":"▶ Kopie starten"}</button>
          <button class="btn icon-btn" data-favorite="${list.id}" type="button" title="Favorit">${list.favorite ? "★":"☆"}</button>
        </div>
      </article>
    `;
  }

  function renderTemplates() {
    const lists = state.checklists.filter(c=>!c.archived && c.template);
    return `
      <div class="page-header">
        <div>
          <h1>Vorlagen</h1>
          <p class="subtle">Wiederkehrende Arbeitsabläufe mit einem Klick starten.</p>
        </div>
        <button class="btn primary" id="newChecklistBtn2" type="button">＋ Neue Checkliste</button>
      </div>
      <div class="templates">
        ${lists.length ? lists.map(list => `
          <div class="template-row">
            <div class="template-info">
              <div class="emoji-box" style="background:${iconColor(list.color)}">${esc(list.icon||"📋")}</div>
              <div style="min-width:0">
                <strong>${esc(list.title)}</strong>
                <div class="subtle">${esc(list.description || "Keine Beschreibung")} · ${list.tasks.length} Aufgaben</div>
              </div>
            </div>
            <div class="template-actions">
              <button class="btn soft" data-template-start="${list.id}" type="button">▶ Starten</button>
              <button class="btn" data-edit-checklist="${list.id}" type="button">Bearbeiten</button>
            </div>
          </div>
        `).join("") : renderEmpty("📚","Noch keine Vorlagen","Speichere wiederkehrende Abläufe als Vorlage.","newChecklist")}
      </div>
    `;
  }

  function renderToday() {
    const lists = state.checklists.filter(c=>!c.archived && !c.template);
    const tasks = lists.flatMap(c => c.tasks.map(t => ({...t, checklistId:c.id, checklistTitle:c.title, icon:c.icon})));
    const required = tasks.filter(t=>t.type==="required" && !t.completed);
    const optional = tasks.filter(t=>t.type==="optional" && !t.completed && !t.skipped);
    return `
      <div class="page-header">
        <div><h1>Heute</h1><p class="subtle">Nur das, was gerade noch relevant ist.</p></div>
      </div>
      <div class="checklist-layout">
        <section class="panel panel-pad">
          <div class="section-head"><h2>🔴 Pflicht</h2><span class="tag">${required.length}</span></div>
          ${required.length ? `<div class="task-list">${required.map(renderTodayTask).join("")}</div>` : `<div class="empty"><div class="empty-icon">✅</div><h3>Keine offenen Pflichtaufgaben</h3><p>Du bist bei deinen aktuellen Arbeitsabläufen auf dem Stand.</p></div>`}
          <div class="section">
            <div class="section-head"><h2>🟡 Optional</h2><span class="tag">${optional.length}</span></div>
            ${optional.length ? `<div class="task-list">${optional.map(renderTodayTask).join("")}</div>` : `<p class="subtle">Keine optionalen Aufgaben offen.</p>`}
          </div>
        </section>
        <aside class="panel side-card">
          <div class="side-block"><div class="side-title">Tagesübersicht</div><div class="summary-number">${required.length}</div><div class="subtle">offene Pflichtaufgaben</div></div>
          <div class="side-block"><div class="side-title">Tipp</div><div class="subtle">Optionale Aufgaben bleiben sichtbar, zählen aber nicht gegen deinen Pflichtfortschritt.</div></div>
        </aside>
      </div>
    `;
  }

  function renderTodayTask(t) {
    return `
      <div class="task">
        <div class="task-main">
          <button class="task-check" data-toggle-task="${t.checklistId}|${t.id}" type="button" aria-label="Aufgabe abhaken">○</button>
          <div class="task-body">
            <div class="task-title">${esc(t.title)}</div>
            <div class="task-meta">
              <span class="pill ${t.type}">${t.type==="required"?"Pflicht":"Optional"}</span>
              ${t.priority==="high"?'<span class="pill priority-high">Sehr wichtig</span>':""}
              <span class="pill">${esc(t.checklistTitle)}</span>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function renderChecklistDetail() {
    const list = getChecklist(state.selectedChecklistId);
    if (!list) { state.activeView = "overview"; state.selectedChecklistId = null; return renderDashboard(); }
    const s = requiredStats(list);
    const tasks = [...list.tasks];
    const query = (document.getElementById("globalSearch")?.value || "").trim().toLowerCase();

    const visible = tasks.filter(t => {
      if (query) {
        const hay = `${t.title} ${t.note} ${t.hint} ${t.category}`.toLowerCase();
        if (!hay.includes(query)) return false;
      }
      return true;
    });

    return `
      <div class="page-header">
        <div>
          <h1>${esc(list.title)}</h1>
          <p class="subtle">${esc(list.description || "Arbeitsablauf")}</p>
        </div>
        <div class="top-actions">
          <button class="btn" data-edit-checklist="${list.id}" type="button">Bearbeiten</button>
          <button class="btn" data-archive="${list.id}" type="button">${list.archived?"Wiederherstellen":"Archivieren"}</button>
        </div>
      </div>

      <div class="checklist-layout">
        <section class="panel panel-pad">
          <div class="check-head">
            <div class="check-head-left">
              <div class="emoji-box" style="background:${iconColor(list.color)}">${esc(list.icon||"📋")}</div>
              <div>
                <h2>${esc(list.title)}</h2>
                <div class="tag-row">
                  <span class="tag">${esc(list.category || "Arbeitsablauf")}</span>
                  ${list.repeat ? `<span class="tag">↻ ${esc(list.repeat)}</span>` : ""}
                  ${list.favorite ? `<span class="tag">★ Favorit</span>`:""}
                </div>
              </div>
            </div>
            <div style="min-width:200px; flex:1; max-width:300px;">
              <div class="progress-row"><span><strong>${s.reqDone}/${s.reqTotal}</strong> Pflichtaufgaben</span><strong>${s.percent}%</strong></div>
              <div class="progress-track" style="margin-top:6px;"><div class="progress-bar" style="width:${s.percent}%"></div></div>
            </div>
          </div>

          ${allRequiredDone(list) ? `
            <div class="task-details" style="background:var(--mint-soft);border-color:transparent;margin-bottom:13px;">
              🎉 <strong>Alle Pflichtaufgaben erledigt.</strong>
              ${s.optionalTotal ? `<br>${s.optionalSkipped} optionale Aufgaben übersprungen.`:""}
            </div>`:""}

          <div class="quick-add">
            <input id="quickTaskInput" placeholder="Neuen Arbeitsschritt hinzufügen …" aria-label="Neue Aufgabe">
            <button class="btn primary" id="quickAddTask" type="button">＋ Hinzufügen</button>
          </div>

          <div class="section-head" style="margin-top:5px;">
            <div class="tag-row">
              <button class="btn" data-filter="all" type="button">Alle</button>
              <button class="btn" data-filter="required" type="button">Pflicht</button>
              <button class="btn" data-filter="optional" type="button">Optional</button>
              <button class="btn" data-filter="open" type="button">Offen</button>
              <button class="btn" data-filter="done" type="button">Erledigt</button>
            </div>
            <select id="taskSort" style="width:auto">
              <option value="manual">Reihenfolge</option>
              <option value="priority">Priorität</option>
              <option value="required">Pflicht zuerst</option>
              <option value="open">Offen zuerst</option>
              <option value="alpha">A–Z</option>
            </select>
          </div>

          <div id="taskList" class="task-list" data-filter-state="all">
            ${sortTasks(visible, document.getElementById("taskSort")?.value || "manual").map(t => renderTask(t, list.id)).join("")}
          </div>
        </section>

        <aside class="panel side-card">
          <div class="side-block">
            <div class="side-title">Übersicht</div>
            <div class="summary-number">${s.reqDone}/${s.reqTotal}</div>
            <div class="subtle">Pflichtaufgaben erledigt</div>
          </div>
          <div class="side-block">
            <div class="side-title">Optional</div>
            <div class="summary-number">${s.optionalDone}/${s.optionalTotal}</div>
            <div class="subtle">${s.optionalSkipped} übersprungen</div>
          </div>
          <div class="side-block">
            <div class="side-title">Aktionen</div>
            <div class="side-list">
              <button data-start-work="${list.id}" type="button">▶ Arbeitsmodus starten</button>
              <button data-duplicate="${list.id}" type="button">⧉ Checkliste duplizieren</button>
              <button data-reset="${list.id}" type="button">↺ Aufgaben zurücksetzen</button>
              <button data-save-template="${list.id}" type="button">📚 Als Vorlage speichern</button>
              <button data-delete-checklist="${list.id}" type="button" style="color:#a35a5a">🗑 Checkliste löschen</button>
            </div>
          </div>
        </aside>
      </div>
    `;
  }

  function renderTask(task, checklistId) {
    const detail = (task.note || task.hint) ? `
      <div class="task-details">
        ${task.hint ? `<div class="task-hint">💡 ${esc(task.hint)}</div>`:""}
        ${task.note ? `<div class="task-note">📝 ${esc(task.note)}</div>`:""}
      </div>` : "";

    return `
      <div class="task ${task.completed ? "done":""}" draggable="true" data-task-id="${task.id}">
        <div class="task-main">
          <button class="task-check ${task.completed?"checked":""}" data-toggle-task="${checklistId}|${task.id}" type="button" aria-label="${task.completed?"Aufgabe wieder öffnen":"Aufgabe abhaken"}">${task.completed?"✓":"○"}</button>
          <div class="task-body">
            <div class="task-title">${esc(task.title)}</div>
            <div class="task-meta">
              <span class="pill ${task.type}">${task.type==="required"?"🔴 Pflicht":"🟡 Optional"}</span>
              ${task.priority==="high"?'<span class="pill priority-high">Sehr wichtig</span>': task.priority==="medium"?'<span class="pill priority-high">Wichtig</span>':""}
              ${task.category?`<span class="pill">${esc(task.category)}</span>`:""}
              ${task.skipped?'<span class="pill optional">↷ Übersprungen</span>':""}
              ${(task.note||task.hint)?'<span class="pill note">📝 Details</span>':""}
            </div>
            ${detail}
            <div class="task-actions">
              <button class="btn" data-edit-task="${checklistId}|${task.id}" type="button">Bearbeiten</button>
              ${task.type==="optional" && !task.completed ? `<button class="btn" data-skip-task="${checklistId}|${task.id}" type="button">${task.skipped?"↶ Wieder öffnen":"↷ Überspringen"}</button>`:""}
              <button class="btn" data-move-up="${checklistId}|${task.id}" type="button">↑</button>
              <button class="btn" data-move-down="${checklistId}|${task.id}" type="button">↓</button>
              <button class="btn danger" data-delete-task="${checklistId}|${task.id}" type="button">Löschen</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function renderSettings() {
    return `
      <div class="page-header">
        <div><h1>Einstellungen</h1><p class="subtle">Darstellung, Bedienung und Daten verwalten.</p></div>
      </div>
      <div class="settings-grid">
        <section class="setting">
          <h3>Darstellung</h3>
          <p>Wähle, wie ArbeitsBuddy aussehen soll.</p>
          <div class="setting-row">
            ${["system","light","dark"].map(v=>`<button class="btn ${state.settings.theme===v?"soft":""}" data-theme="${v}" type="button">${v==="system"?"System":v==="light"?"Hell":"Dunkel"}</button>`).join("")}
          </div>
        </section>
        <section class="setting">
          <h3>Bedienung</h3>
          <p>Einige kleine Komfortfunktionen anpassen.</p>
          <div class="toggle-row"><span>Dezente Animationen</span><label class="switch"><input type="checkbox" id="animToggle" ${state.settings.animations?"checked":""}><span class="slider"></span></label></div>
          <div class="toggle-row"><span>Vor dem Löschen fragen</span><label class="switch"><input type="checkbox" id="confirmToggle" ${state.settings.confirmDelete?"checked":""}><span class="slider"></span></label></div>
        </section>
        <section class="setting">
          <h3>Sortierung</h3>
          <p>Standardreihenfolge für Checklisten.</p>
          <select id="sortSetting">
            <option value="updated" ${state.settings.sort==="updated"?"selected":""}>Zuletzt geändert</option>
            <option value="alpha" ${state.settings.sort==="alpha"?"selected":""}>Alphabetisch</option>
            <option value="favorite" ${state.settings.sort==="favorite"?"selected":""}>Favoriten zuerst</option>
            <option value="progress" ${state.settings.sort==="progress"?"selected":""}>Fortschritt</option>
          </select>
        </section>
        <section class="setting">
          <h3>Daten</h3>
          <p>Deine Daten bleiben lokal in diesem Browser.</p>
          <div class="setting-row">
            <button class="btn" id="exportBtn" type="button">⬇ Exportieren</button>
            <label class="btn" for="importFile">⬆ Importieren</label>
            <input id="importFile" type="file" accept="application/json,.json" hidden>
            <button class="btn danger" id="resetAllBtn" type="button">Alle Daten löschen</button>
          </div>
        </section>
      </div>
    `;
  }

  function renderEmpty(icon, title, text, action) {
    return `<div class="empty"><div class="empty-icon">${icon}</div><h3>${esc(title)}</h3><p>${esc(text)}</p>${action ? `<button class="btn primary" data-action="${action}" type="button">＋ Checkliste erstellen</button>`:""}</div>`;
  }

  function sortChecklists(lists) {
    return [...lists].sort((a,b) => {
      if (state.settings.sort === "alpha") return a.title.localeCompare(b.title, "de");
      if (state.settings.sort === "favorite") return Number(b.favorite)-Number(a.favorite) || b.updatedAt-a.updatedAt;
      if (state.settings.sort === "progress") return requiredStats(b).percent-requiredStats(a).percent;
      return b.updatedAt-a.updatedAt;
    });
  }

  function sortTasks(tasks, mode) {
    const copy = [...tasks];
    if (mode==="alpha") return copy.sort((a,b)=>a.title.localeCompare(b.title,"de"));
    if (mode==="priority") {
      const weight = { high:0, medium:1, normal:2 };
      return copy.sort((a,b)=>(weight[a.priority]??2)-(weight[b.priority]??2));
    }
    if (mode==="required") return copy.sort((a,b)=>Number(b.type==="required")-Number(a.type==="required"));
    if (mode==="open") return copy.sort((a,b)=>Number(a.completed)-Number(b.completed));
    return copy;
  }

  function updateChecklistTimestamp(list) {
    list.updatedAt = Date.now();
  }

  function addTask(list, raw) {
    const title = raw.trim();
    if (!title) return false;
    list.tasks.push({
      id: crypto.randomUUID(),
      title,
      type: "required",
      completed: false,
      skipped: false,
      priority: "normal",
      note: "",
      hint: "",
      category: ""
    });
    updateChecklistTimestamp(list);
    saveState();
    return true;
  }

  function openModal(title, body, actions = "") {
    const root = document.getElementById("modal-root");
    root.innerHTML = `
      <div class="modal-backdrop" id="modalBackdrop">
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <div class="modal-head"><h2 id="modalTitle">${esc(title)}</h2><button class="btn icon-btn" id="closeModal" type="button" aria-label="Schließen">✕</button></div>
          <div class="modal-body">${body}</div>
          ${actions ? `<div class="modal-actions">${actions}</div>`:""}
        </section>
      </div>
    `;
    document.getElementById("closeModal").addEventListener("click", closeModal);
    document.getElementById("modalBackdrop").addEventListener("click", e => {
      if (e.target.id === "modalBackdrop") closeModal();
    });
  }

  function closeModal() {
    document.getElementById("modal-root").innerHTML = "";
  }

  function openChecklistModal(editId = null) {
    const list = editId ? getChecklist(editId) : null;
    const data = list || {title:"",description:"",icon:"📋",color:"blue",category:"Arbeitsablauf",repeat:"keine",template:false};
    const title = editId ? "Checkliste bearbeiten" : "Neue Checkliste erstellen";
    openModal(title, `
      <form id="checklistForm">
        <div class="form-grid">
          <div class="field full"><label for="cTitle">Name</label><input id="cTitle" required value="${esc(data.title)}" placeholder="z. B. Arbeitsbeginn"></div>
          <div class="field full"><label for="cDesc">Beschreibung</label><textarea id="cDesc" placeholder="Wofür ist die Checkliste gedacht?">${esc(data.description||"")}</textarea></div>
          <div class="field"><label for="cIcon">Emoji / Icon</label><input id="cIcon" value="${esc(data.icon||"📋")}" maxlength="3"></div>
          <div class="field"><label for="cColor">Farbe</label>
            <select id="cColor">
              <option value="blue" ${data.color==="blue"?"selected":""}>Pastellblau</option>
              <option value="mint" ${data.color==="mint"?"selected":""}>Mint</option>
              <option value="yellow" ${data.color==="yellow"?"selected":""}>Hellgelb</option>
              <option value="lavender" ${data.color==="lavender"?"selected":""}>Lavendel</option>
              <option value="red" ${data.color==="red"?"selected":""}>Pastellrot</option>
            </select>
          </div>
          <div class="field"><label for="cCategory">Kategorie</label><input id="cCategory" value="${esc(data.category||"Arbeitsablauf")}" placeholder="z. B. Maschinen"></div>
          <div class="field"><label for="cRepeat">Wiederholung</label>
            <select id="cRepeat">
              <option value="keine" ${data.repeat==="keine"?"selected":""}>Keine</option>
              <option value="täglich" ${data.repeat==="täglich"?"selected":""}>Täglich</option>
              <option value="werktags" ${data.repeat==="werktags"?"selected":""}>Werktags</option>
              <option value="wöchentlich" ${data.repeat==="wöchentlich"?"selected":""}>Wöchentlich</option>
              <option value="monatlich" ${data.repeat==="monatlich"?"selected":""}>Monatlich</option>
            </select>
          </div>
          <div class="field full">
            <label class="toggle-row" style="padding:0"><span>Als Vorlage speichern</span><label class="switch"><input id="cTemplate" type="checkbox" ${data.template?"checked":""}><span class="slider"></span></label></label>
          </div>
        </div>
      </form>
    `, `
      <button class="btn" id="cancelModal" type="button">Abbrechen</button>
      <button class="btn primary" id="saveChecklistBtn" type="button">Speichern</button>
    `);
    document.getElementById("cancelModal").addEventListener("click", closeModal);
    document.getElementById("saveChecklistBtn").addEventListener("click", () => {
      const titleValue = document.getElementById("cTitle").value.trim();
      if (!titleValue) { toast("Bitte einen Namen eingeben."); return; }
      if (editId) {
        Object.assign(list, {
          title:titleValue,
          description:document.getElementById("cDesc").value.trim(),
          icon:document.getElementById("cIcon").value.trim() || "📋",
          color:document.getElementById("cColor").value,
          category:document.getElementById("cCategory").value.trim() || "Arbeitsablauf",
          repeat:document.getElementById("cRepeat").value,
          template:document.getElementById("cTemplate").checked
        });
        updateChecklistTimestamp(list);
        saveState(); closeModal(); render(); toast("Checkliste gespeichert.");
      } else {
        const newList = {
          id: crypto.randomUUID(),
          title:titleValue,
          description:document.getElementById("cDesc").value.trim(),
          icon:document.getElementById("cIcon").value.trim() || "📋",
          color:document.getElementById("cColor").value,
          category:document.getElementById("cCategory").value.trim() || "Arbeitsablauf",
          favorite:false,
          archived:false,
          template:document.getElementById("cTemplate").checked,
          updatedAt:Date.now(),
          repeat:document.getElementById("cRepeat").value,
          tasks:[]
        };
        state.checklists.push(newList);
        state.selectedChecklistId = newList.id;
        state.activeView = "checklist";
        saveState(); closeModal(); render(); toast("Neue Checkliste erstellt.");
      }
    });
  }

  function openTaskModal(checklistId, taskId = null) {
    const list = getChecklist(checklistId);
    const task = taskId ? list.tasks.find(t=>t.id===taskId) : null;
    const d = task || {title:"",type:"required",priority:"normal",category:"",note:"",hint:""};
    openModal(taskId ? "Aufgabe bearbeiten" : "Neue Aufgabe", `
      <form id="taskForm">
        <div class="form-grid">
          <div class="field full"><label for="tTitle">Aufgabe</label><input id="tTitle" required value="${esc(d.title)}" placeholder="z. B. Maschine kontrollieren"></div>
          <div class="field"><label for="tType">Typ</label>
            <select id="tType">
              <option value="required" ${d.type==="required"?"selected":""}>🔴 Pflicht</option>
              <option value="optional" ${d.type==="optional"?"selected":""}>🟡 Optional</option>
            </select>
          </div>
          <div class="field"><label for="tPriority">Priorität</label>
            <select id="tPriority">
              <option value="normal" ${d.priority==="normal"?"selected":""}>Normal</option>
              <option value="medium" ${d.priority==="medium"?"selected":""}>Wichtig</option>
              <option value="high" ${d.priority==="high"?"selected":""}>Sehr wichtig</option>
            </select>
          </div>
          <div class="field"><label for="tCategory">Kategorie</label><input id="tCategory" value="${esc(d.category||"")}" placeholder="z. B. Sicherheit"></div>
          <div class="field full"><label for="tHint">💡 Hinweis</label><input id="tHint" value="${esc(d.hint||"")}" placeholder="Kurzer Hinweis, der beim Abarbeiten helfen soll"></div>
          <div class="field full"><label for="tNote">📝 Notiz</label><textarea id="tNote" placeholder="Zusätzliche Informationen">${esc(d.note||"")}</textarea></div>
        </div>
      </form>
    `, `
      <button class="btn" id="cancelModal" type="button">Abbrechen</button>
      <button class="btn primary" id="saveTaskBtn" type="button">Speichern</button>
    `);
    document.getElementById("cancelModal").addEventListener("click", closeModal);
    document.getElementById("saveTaskBtn").addEventListener("click", () => {
      const titleValue = document.getElementById("tTitle").value.trim();
      if (!titleValue) { toast("Bitte einen Aufgabennamen eingeben."); return; }
      if (task) {
        Object.assign(task, {
          title:titleValue,
          type:document.getElementById("tType").value,
          priority:document.getElementById("tPriority").value,
          category:document.getElementById("tCategory").value.trim(),
          hint:document.getElementById("tHint").value.trim(),
          note:document.getElementById("tNote").value.trim()
        });
        if (task.type==="required") task.skipped=false;
      } else {
        list.tasks.push({
          id:crypto.randomUUID(),
          title:titleValue,
          type:document.getElementById("tType").value,
          completed:false,
          skipped:false,
          priority:document.getElementById("tPriority").value,
          category:document.getElementById("tCategory").value.trim(),
          hint:document.getElementById("tHint").value.trim(),
          note:document.getElementById("tNote").value.trim()
        });
      }
      updateChecklistTimestamp(list);
      saveState(); closeModal(); render(); toast(task ? "Aufgabe aktualisiert." : "Aufgabe hinzugefügt.");
    });
  }

  function duplicateChecklist(id, asTemplate = false) {
    const src = getChecklist(id);
    const copy = structuredClone(src);
    copy.id = crypto.randomUUID();
    copy.title = asTemplate ? src.title : `${src.title} – Kopie`;
    copy.favorite = false;
    copy.archived = false;
    copy.template = asTemplate ? true : false;
    copy.updatedAt = Date.now();
    copy.tasks = copy.tasks.map(t => ({...t, id: crypto.randomUUID(), completed:false, skipped:false}));
    state.checklists.push(copy);
    saveState();
    return copy;
  }

  function startTemplate(id) {
    const src = getChecklist(id);
    const copy = duplicateChecklist(id, false);
    copy.title = src.title;
    copy.description = src.description;
    copy.template = false;
    state.selectedChecklistId = copy.id;
    state.activeView = "checklist";
    saveState(); render(); toast("Neue Ausführung gestartet.");
  }

  function resetChecklist(id) {
    const list = getChecklist(id);
    if (!list) return;
    list.tasks.forEach(t => { t.completed=false; t.skipped=false; });
    updateChecklistTimestamp(list);
    saveState(); render(); toast("Aufgaben zurückgesetzt.");
  }

  function maybeConfirm(message) {
    if (!state.settings.confirmDelete) return true;
    return window.confirm(message);
  }

  function bindGlobalEvents() {
    document.querySelectorAll("[data-nav]").forEach(btn => btn.addEventListener("click", () => navigate(btn.dataset.nav)));
    document.querySelectorAll("[data-open]").forEach(btn => btn.addEventListener("click", () => selectChecklist(btn.dataset.open)));
    document.querySelectorAll("[data-favorite]").forEach(btn => btn.addEventListener("click", () => {
      const list = getChecklist(btn.dataset.favorite);
      list.favorite = !list.favorite; updateChecklistTimestamp(list); saveState(); render();
    }));
    document.querySelectorAll("[data-edit-checklist]").forEach(btn => btn.addEventListener("click", () => openChecklistModal(btn.dataset.editChecklist)));
    document.querySelectorAll("[data-template-start]").forEach(btn => btn.addEventListener("click", () => startTemplate(btn.dataset.templateStart)));
    document.querySelectorAll("[data-archive]").forEach(btn => btn.addEventListener("click", () => {
      const list = getChecklist(btn.dataset.archive); list.archived = !list.archived; updateChecklistTimestamp(list); saveState(); render(); toast(list.archived?"Archiviert.":"Wiederhergestellt.");
    }));
    document.querySelectorAll("[data-toggle-task]").forEach(btn => btn.addEventListener("click", () => {
      const [cid,tid] = btn.dataset.toggleTask.split("|");
      const list = getChecklist(cid); const task = list?.tasks.find(t=>t.id===tid); if (!task) return;
      task.completed = !task.completed;
      if (task.completed) task.skipped = false;
      updateChecklistTimestamp(list); saveState(); render();
    }));
    document.querySelectorAll("[data-edit-task]").forEach(btn => {
      const [cid,tid] = btn.dataset.editTask.split("|"); btn.addEventListener("click", () => openTaskModal(cid,tid));
    });
    document.querySelectorAll("[data-delete-task]").forEach(btn => btn.addEventListener("click", () => {
      const [cid,tid] = btn.dataset.deleteTask.split("|"); const list = getChecklist(cid); if (!list) return;
      if (!maybeConfirm("Diese Aufgabe wirklich löschen?")) return;
      list.tasks = list.tasks.filter(t=>t.id!==tid); updateChecklistTimestamp(list); saveState(); render(); toast("Aufgabe gelöscht.");
    }));
    document.querySelectorAll("[data-skip-task]").forEach(btn => btn.addEventListener("click", () => {
      const [cid,tid] = btn.dataset.skipTask.split("|"); const list = getChecklist(cid); const task = list?.tasks.find(t=>t.id===tid); if (!task) return;
      task.skipped = !task.skipped; task.completed = false; updateChecklistTimestamp(list); saveState(); render(); toast(task.skipped?"Optionale Aufgabe übersprungen.":"Aufgabe wieder geöffnet.");
    }));
    document.querySelectorAll("[data-move-up]").forEach(btn => btn.addEventListener("click", () => moveTask(btn.dataset.moveUp, -1)));
    document.querySelectorAll("[data-move-down]").forEach(btn => btn.addEventListener("click", () => moveTask(btn.dataset.moveDown, 1)));
    document.querySelectorAll("[data-duplicate]").forEach(btn => btn.addEventListener("click", () => {
      const copy = duplicateChecklist(btn.dataset.duplicate, false); state.selectedChecklistId=copy.id; state.activeView="checklist"; saveState(); render(); toast("Checkliste dupliziert.");
    }));
    document.querySelectorAll("[data-reset]").forEach(btn => btn.addEventListener("click", () => {
      if (maybeConfirm("Alle Aufgaben dieser Checkliste zurücksetzen?")) resetChecklist(btn.dataset.reset);
    }));
    document.querySelectorAll("[data-save-template]").forEach(btn => btn.addEventListener("click", () => {
      const list = getChecklist(btn.dataset.saveTemplate); if (!list) return;
      if (list.template) { toast("Diese Checkliste ist bereits eine Vorlage."); return; }
      const copy = duplicateChecklist(list.id, true);
      copy.title = `${list.title} (Vorlage)`;
      saveState(); render(); toast("Vorlage gespeichert.");
    }));
    document.querySelectorAll("[data-delete-checklist]").forEach(btn => btn.addEventListener("click", () => {
      const id = btn.dataset.deleteChecklist;
      if (!maybeConfirm("Diese Checkliste wirklich löschen?")) return;
      state.checklists = state.checklists.filter(c=>c.id!==id);
      state.selectedChecklistId=null; state.activeView="checklists";
      saveState(); render(); toast("Checkliste gelöscht.");
    }));
    document.querySelectorAll("[data-theme]").forEach(btn => btn.addEventListener("click", () => {
      state.settings.theme=btn.dataset.theme; saveState(); render();
    }));
    document.querySelectorAll("[data-action]").forEach(btn => btn.addEventListener("click", () => {
      if (btn.dataset.action==="newChecklist") openChecklistModal();
    }));

    const newButtons = ["newChecklistBtn","newChecklistBtn2"];
    newButtons.forEach(id => document.getElementById(id)?.addEventListener("click", () => openChecklistModal()));

    document.getElementById("quickAddBtn")?.addEventListener("click", () => {
      if (state.activeView==="checklist" && state.selectedChecklistId) {
        document.getElementById("quickTaskInput")?.focus();
      } else {
        openChecklistModal();
      }
    });

    document.getElementById("themeBtn")?.addEventListener("click", () => {
      state.settings.theme = state.settings.theme==="dark" ? "light" : "dark"; saveState(); render();
    });

    const globalSearch = document.getElementById("globalSearch");
    globalSearch?.addEventListener("input", e => {
      if (state.activeView==="checklist") {
        // Keep the typed value while re-rendering by focusing later.
        render();
        const s = document.getElementById("globalSearch");
        s.value = e.target.value;
        s.focus();
        return;
      }
      const q = e.target.value.trim().toLowerCase();
      if (!q) return;
      const matches = state.checklists.filter(c => `${c.title} ${c.description} ${c.category}`.toLowerCase().includes(q) ||
        c.tasks.some(t => `${t.title} ${t.note} ${t.hint} ${t.category}`.toLowerCase().includes(q)));
      if (matches.length===1) selectChecklist(matches[0].id);
    });

    document.getElementById("quickAddTask")?.addEventListener("click", () => {
      const input = document.getElementById("quickTaskInput");
      const list = getChecklist(state.selectedChecklistId);
      if (input && list && addTask(list,input.value)) { render(); toast("Pflichtaufgabe hinzugefügt."); setTimeout(()=>document.getElementById("quickTaskInput")?.focus(),0); }
      else toast("Bitte einen Aufgabennamen eingeben.");
    });
    document.getElementById("quickTaskInput")?.addEventListener("keydown", e => {
      if (e.key==="Enter") document.getElementById("quickAddTask")?.click();
    });

    document.querySelectorAll("[data-filter]").forEach(btn => btn.addEventListener("click", () => {
      const list = getChecklist(state.selectedChecklistId);
      if (!list) return;
      const container = document.getElementById("taskList");
      if (!container) return;
      container.dataset.filterState = btn.dataset.filter;
      const filter = btn.dataset.filter;
      let tasks = [...list.tasks];
      if (filter==="required") tasks=tasks.filter(t=>t.type==="required");
      if (filter==="optional") tasks=tasks.filter(t=>t.type==="optional");
      if (filter==="open") tasks=tasks.filter(t=>!t.completed && !t.skipped);
      if (filter==="done") tasks=tasks.filter(t=>t.completed);
      const sort = document.getElementById("taskSort")?.value || "manual";
      container.innerHTML = sortTasks(tasks,sort).map(t=>renderTask(t,list.id)).join("") || `<div class="empty"><div class="empty-icon">🔎</div><h3>Nichts gefunden</h3><p>Für diesen Filter gibt es keine Aufgaben.</p></div>`;
      bindDynamicTaskEvents();
    }));

    document.getElementById("taskSort")?.addEventListener("change", e => {
      const list = getChecklist(state.selectedChecklistId); const container=document.getElementById("taskList"); if (!list||!container) return;
      const filter=container.dataset.filterState || "all";
      let tasks=[...list.tasks];
      if (filter==="required") tasks=tasks.filter(t=>t.type==="required");
      if (filter==="optional") tasks=tasks.filter(t=>t.type==="optional");
      if (filter==="open") tasks=tasks.filter(t=>!t.completed && !t.skipped);
      if (filter==="done") tasks=tasks.filter(t=>t.completed);
      container.innerHTML=sortTasks(tasks,e.target.value).map(t=>renderTask(t,list.id)).join("");
      bindDynamicTaskEvents();
    });

    document.getElementById("animToggle")?.addEventListener("change", e => {
      state.settings.animations=e.target.checked; saveState();
    });
    document.getElementById("confirmToggle")?.addEventListener("change", e => {
      state.settings.confirmDelete=e.target.checked; saveState();
    });
    document.getElementById("sortSetting")?.addEventListener("change", e => {
      state.settings.sort=e.target.value; saveState(); render();
    });
    document.getElementById("exportBtn")?.addEventListener("click", exportData);
    document.getElementById("importFile")?.addEventListener("change", importData);
    document.getElementById("resetAllBtn")?.addEventListener("click", () => {
      if (!window.confirm("Wirklich alle lokalen Daten löschen? Diese Aktion kann nicht rückgängig gemacht werden.")) return;
      localStorage.removeItem(STORAGE_KEY);
      state = structuredClone(defaultData);
      saveState(); render(); toast("Daten wurden zurückgesetzt.");
    });
    document.querySelector("[data-start-work]")?.addEventListener("click", () => toast("Arbeitsmodus ist für den nächsten Ausbau vorbereitet."));
  }

  function bindDynamicTaskEvents() {
    document.querySelectorAll("[data-toggle-task]").forEach(btn => btn.addEventListener("click", () => {
      const [cid,tid]=btn.dataset.toggleTask.split("|"); const list=getChecklist(cid); const task=list?.tasks.find(t=>t.id===tid); if(!task)return;
      task.completed=!task.completed; if(task.completed)task.skipped=false; updateChecklistTimestamp(list); saveState(); render();
    }));
    document.querySelectorAll("[data-edit-task]").forEach(btn => {
      const [cid,tid]=btn.dataset.editTask.split("|"); btn.addEventListener("click",()=>openTaskModal(cid,tid));
    });
    document.querySelectorAll("[data-delete-task]").forEach(btn => btn.addEventListener("click",()=> {
      const [cid,tid]=btn.dataset.deleteTask.split("|"); const list=getChecklist(cid); if(!list)return;
      if(!maybeConfirm("Diese Aufgabe wirklich löschen?"))return;
      list.tasks=list.tasks.filter(t=>t.id!==tid); updateChecklistTimestamp(list); saveState(); render(); toast("Aufgabe gelöscht.");
    }));
    document.querySelectorAll("[data-skip-task]").forEach(btn=>btn.addEventListener("click",()=> {
      const [cid,tid]=btn.dataset.skipTask.split("|"); const list=getChecklist(cid); const task=list?.tasks.find(t=>t.id===tid); if(!task)return;
      task.skipped=!task.skipped; task.completed=false; updateChecklistTimestamp(list); saveState(); render();
    }));
    document.querySelectorAll("[data-move-up]").forEach(btn=>btn.addEventListener("click",()=>moveTask(btn.dataset.moveUp,-1)));
    document.querySelectorAll("[data-move-down]").forEach(btn=>btn.addEventListener("click",()=>moveTask(btn.dataset.moveDown,1)));
  }

  function moveTask(key, direction) {
    const [cid, tid] = key.split("|");
    const list = getChecklist(cid);
    if (!list) return;
    const index=list.tasks.findIndex(t=>t.id===tid);
    const target=index+direction;
    if (target<0 || target>=list.tasks.length) return;
    [list.tasks[index],list.tasks[target]]=[list.tasks[target],list.tasks[index]];
    updateChecklistTimestamp(list); saveState(); render();
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download=`arbeitsbuddy-export-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
    toast("Export erstellt.");
  }

  function importData(e) {
    const file=e.target.files?.[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try {
        const parsed=JSON.parse(reader.result);
        if(!parsed || !Array.isArray(parsed.checklists)) throw new Error();
        state={...state,...parsed,settings:{...state.settings,...(parsed.settings||{})}};
        saveState(); render(); toast("Daten importiert.");
      } catch {
        toast("Import fehlgeschlagen: Ungültige JSON-Datei.");
      }
    };
    reader.readAsText(file);
    e.target.value="";
  }

  document.addEventListener("keydown", e => {
    const tag = document.activeElement?.tagName?.toLowerCase();
    if (e.key==="Escape") closeModal();
    if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k" && !["input","textarea"].includes(tag)) {
      e.preventDefault(); document.getElementById("globalSearch")?.focus();
    }
  });

  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => {
    if (state.settings.theme==="system") render();
  });

  render();
})();
</script>
</body>
</html>
