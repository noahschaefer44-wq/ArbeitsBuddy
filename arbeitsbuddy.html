<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f4f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ArbeitsBuddy">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>ArbeitsBuddy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232f5d8a'/%3E%3Cpath d='M9 22c4 1 6 4 8 7 4-9 9-15 15-19' fill='none' stroke='%23fff' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ==========================================================
   ArbeitsBuddy – schlichtes Büro-Design
   Hellgrau, Weiß, feine Linien, eine Akzentfarbe (gedecktes Blau)
   ========================================================== */
:root {
  color-scheme: light;
  --font: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --script: "Segoe Script", "Brush Script MT", "Snell Roundhand", "Apple Chancery", "URW Chancery L", cursive;
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --ink: #1f2933;
  --ink-2: #3e4c59;
  --muted: #6b7785;
  --line: #e1e5ea;
  --line-strong: #c5ccd4;
  --accent: #2f5d8a;
  --accent-ink: #ffffff;
  --accent-soft: #e8eff6;
  --green: #2e7d4f;
  --green-soft: #e6f3eb;
  --red: #b3413a;
  --red-soft: #fbeceb;
  --warn-soft: #f6f1e4;
  --focus: #2f5d8a;
  --track: #e6e9ed;
  --r: 10px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #15191e;
  --surface: #1c2229;
  --surface-2: #232a32;
  --ink: #e7eaee;
  --ink-2: #c3cad2;
  --muted: #929ca8;
  --line: #2d353f;
  --line-strong: #46515d;
  --accent: #7fa7d1;
  --accent-ink: #0f1924;
  --accent-soft: #22354a;
  --green: #6cc08f;
  --green-soft: #1d3326;
  --red: #ec8a82;
  --red-soft: #3a2323;
  --warn-soft: #332d20;
  --focus: #7fa7d1;
  --track: #2d353f;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
body.no-scroll { overflow: hidden; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1[tabindex="-1"]:focus, main:focus { outline: none; }
.i { display: block; flex: none; }
.i.filled path, .i.filled polygon { fill: currentColor; }
.muted, .hint-text { color: var(--muted); }
.hint-text { font-size: 13.5px; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 300; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 6px; }
.skip:focus { top: 12px; }

h1 { font-size: 26px; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; }
h2 { font-size: 18px; font-weight: 600; line-height: 1.3; }
h3 { font-size: 16px; font-weight: 600; line-height: 1.3; }
.lede { color: var(--muted); margin-top: 4px; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font-weight: 500; white-space: nowrap; text-decoration: none; transition: background-color .12s, border-color .12s; }
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--red); }
.btn.danger:hover { background: var(--red-soft); border-color: var(--red); }
.btn.danger.solid { background: var(--red); border-color: var(--red); color: #fff; }
.btn.quiet { border-color: transparent; background: transparent; }
.btn.quiet:hover { background: var(--surface-2); }
.btn.small { min-height: 30px; padding: 0 10px; font-size: 14px; }
.btn.icon { width: 36px; padding: 0; }
.btn.small.icon { width: 30px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link-btn { color: var(--accent); font-weight: 500; text-decoration: none; }
.link-btn:hover { text-decoration: underline; }

/* ---------- Layout ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.rail { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: 18px 12px; background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; }
.brand { display: block; padding: 0 10px 18px; text-decoration: none; color: var(--accent); }
.logo { display: block; height: 46px; width: auto; }
.nav { display: grid; gap: 2px; }
.nav a, .nav button { display: flex; align-items: center; gap: 11px; min-height: 38px; padding: 0 10px; border-radius: 7px; color: var(--ink-2); text-decoration: none; font-weight: 500; width: 100%; text-align: left; }
.nav a:hover, .nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .count { margin-left: auto; min-width: 22px; padding: 0 6px; text-align: center; font-size: 12.5px; line-height: 20px; border-radius: 10px; background: var(--surface-2); color: var(--muted); }
.nav .more-btn, .nav .mob { display: none; }
.nav-group { margin: 14px 10px 4px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.tt { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.lesson { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.lesson:last-child { border-bottom: 0; }
.lesson .sub { font-size: 13px; color: var(--muted); }
.lesson.pause { color: var(--muted); font-size: 13.5px; padding: 5px 0; }
.hw { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); }
.hw:last-child { border-bottom: 0; }
.hw .grow { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.hw.done .grow { color: var(--muted); text-decoration: line-through; }
.hw .sub { font-size: 13px; color: var(--muted); text-decoration: none; }
.rail-foot { margin-top: auto; padding: 14px 10px 0; font-size: 13px; color: var(--muted); }

.main { min-width: 0; padding: 0 clamp(16px, 3vw, 36px) 56px; }
.topbar { display: flex; align-items: center; gap: 10px; padding: calc(16px + env(safe-area-inset-top)) 0 4px; }
.m-brand { display: none; color: var(--accent); }
.m-brand .logo { height: 32px; }
.search-btn { flex: 1; max-width: 460px; display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); text-align: left; }
.search-btn:hover { border-color: var(--line-strong); }
.search-btn .grow { flex: 1; }
kbd { font: 500 12px/1 var(--font); padding: 3px 5px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface-2); color: var(--ink-2); }
.top-actions { margin-left: auto; display: flex; gap: 8px; }
.page { max-width: 1180px; padding-top: 18px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); gap: 24px; align-items: start; }
.stack { display: grid; gap: 8px; }
.panel { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.panel-pad { padding: 16px; }
.notice { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 16px; margin-bottom: 18px; border-radius: var(--r); background: var(--accent-soft); }
.notice.warn { background: var(--warn-soft); }

/* ---------- Fortschritt, Chips ---------- */
.bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s ease; }
.bar.complete > span { background: var(--green); }
.tile { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
.tile.sm { width: 28px; height: 28px; border-radius: 6px; }
.tile .emo { font-size: 18px; line-height: 1; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
.chip.optional { border-style: dashed; }
.chip.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip.ok { background: var(--green-soft); border-color: transparent; color: var(--green); }
.chip.imp { background: var(--red-soft); border-color: transparent; color: var(--red); }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.state { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; color: var(--muted); }
.state.done { color: var(--green); }
.state.run { color: var(--accent); }

/* ---------- Tabellen und Zeilen ---------- */
.table { width: 100%; border-collapse: collapse; background: var(--surface); }
.table th, .table td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table th { font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--surface-2); }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr:hover td { background: var(--surface-2); }
.table a { text-decoration: none; font-weight: 500; }
.table a:hover { color: var(--accent); }
.table .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.table-wrap { border: 1px solid var(--line); border-radius: var(--r); overflow: auto; }
.group-title { margin: 22px 0 8px; display: flex; gap: 10px; align-items: baseline; }
.group-title:first-child { margin-top: 0; }

.row { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.row .grow { flex: 1; min-width: 0; }
.row .sub { font-size: 13.5px; color: var(--muted); }
.row a.cover { text-decoration: none; font-weight: 500; }
.row a.cover::after { content: ""; position: absolute; inset: 0; }
.row .pct { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.row .bar { width: 120px; }
.item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .grow { flex: 1; min-width: 0; }
.item .sub { font-size: 13px; color: var(--muted); }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13.5px; min-width: 88px; }

.tabs { display: inline-flex; padding: 3px; gap: 2px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.tabs a, .tabs button { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 6px; font-weight: 500; color: var(--muted); text-decoration: none; }
.tabs a[aria-current="page"], .tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.tabs .n { font-size: 12.5px; color: var(--muted); }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .grow { flex: 1; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.lcard { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.lcard:hover { border-color: var(--line-strong); }
.lcard .head { display: flex; gap: 11px; align-items: flex-start; }
.lcard .head > div { min-width: 0; }
.lcard h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lcard h3 a { text-decoration: none; }
.lcard h3 a::after { content: ""; position: absolute; inset: 0; }
.lcard p { color: var(--muted); font-size: 13.5px; }
.lcard .meta { display: flex; justify-content: space-between; gap: 10px; }
.lcard .foot { display: flex; align-items: center; gap: 8px; margin-top: auto; position: relative; z-index: 1; }
.lcard .foot .grow { flex: 1; }
.fav-on { color: var(--accent); }

.empty { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 40px 20px; border: 1px dashed var(--line-strong); border-radius: var(--r); }
.empty .tile { background: var(--surface-2); color: var(--muted); }
.empty p { color: var(--muted); max-width: 46ch; }
.empty.tight { padding: 24px 16px; }

/* ---------- Checkliste ---------- */
.crumb { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-weight: 500; margin-bottom: 12px; }
.crumb:hover { color: var(--ink); }
.list-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.list-head .who { display: flex; gap: 14px; align-items: center; min-width: 0; }
.list-head .chips { margin-top: 6px; }
.progress-band { display: flex; gap: 14px; align-items: center; margin: 18px 0 4px; }
.progress-band .bar { flex: 1; max-width: 420px; }
.progress-band strong { font-variant-numeric: tabular-nums; }
.tpl-note { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; padding: 12px 14px; margin-top: 16px; border-radius: var(--r); background: var(--accent-soft); }
.detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 22px; align-items: start; margin-top: 18px; }
.side { position: sticky; top: 16px; }
.side .block + .block { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
.side .num { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.side .num small { font-size: .6em; color: var(--muted); font-weight: 400; }
.side .cap { color: var(--muted); font-size: 13.5px; }
.side-list { display: grid; gap: 1px; margin: 0 -8px; }
.side-list button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 0 8px; border-radius: 6px; text-align: left; color: var(--ink-2); }
.side-list button:hover { background: var(--surface-2); color: var(--ink); }
.side-list button.danger { color: var(--red); }
.quick-add { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; }
.filters { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0 2px; }
.fchips { display: flex; gap: 5px; flex-wrap: wrap; }
.fchip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 15px; font-size: 14px; color: var(--ink-2); }
.fchip .n { color: var(--muted); font-size: 12.5px; }
.fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.fchip[aria-pressed="true"] .n { color: inherit; opacity: .8; }
.filter-tools { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-tools .input { min-height: 32px; padding: 4px 10px; width: 170px; }
.filter-tools .select { min-height: 32px; padding: 4px 8px; width: auto; }

.tasks { display: grid; gap: 6px; margin-top: 12px; }
.task { position: relative; padding: 10px 10px 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.task:hover { border-color: var(--line-strong); }
.task.done { background: var(--surface-2); }
.task.dragging { opacity: .4; }
.task.drop-before { box-shadow: 0 -2px 0 0 var(--accent); }
.task.drop-after { box-shadow: 0 2px 0 0 var(--accent); }
.task-row { display: flex; gap: 10px; align-items: flex-start; }
.grip { display: grid; place-items: center; width: 18px; height: 24px; margin-left: -4px; color: var(--line-strong); cursor: grab; touch-action: none; }
.task-body { flex: 1; min-width: 0; padding-top: 1px; }
.task-line { display: flex; gap: 6px; align-items: flex-start; }
.title { font-weight: 500; overflow-wrap: anywhere; }
.task.done .title { color: var(--muted); text-decoration: line-through; }
.task.skipped .title { color: var(--muted); font-style: italic; }
.task-title-btn { display: inline-flex; gap: 4px; align-items: flex-start; text-align: left; }
.task-title-btn .chev { margin-top: 3px; color: var(--muted); }
.task-title-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.task .chips { margin-top: 5px; }
.details { display: grid; gap: 6px; margin: 8px 0 2px; }
.detail { display: flex; gap: 8px; padding: 8px 11px; border-radius: 6px; font-size: 14px; color: var(--ink-2); background: var(--surface-2); max-width: 66ch; }
.detail .i { margin-top: 2px; }
.detail span { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.check { flex: none; width: 22px; height: 22px; margin-top: 1px; display: grid; place-items: center; border: 1.5px solid var(--line-strong); border-radius: 5px; background: var(--surface); color: #fff; }
.check:hover { border-color: var(--accent); }
.check svg { width: 14px; height: 14px; opacity: 0; }
.check path { fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.check[aria-checked="true"] { background: var(--green); border-color: var(--green); }
.check[aria-checked="true"] svg { opacity: 1; }
.stepno { flex: none; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; background: var(--surface-2); font-size: 13px; color: var(--muted); }
.prio { flex: none; margin-top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.prio.high { background: var(--red); }
.tact { display: flex; gap: 1px; opacity: 0; margin: -3px 0 0 auto; flex: none; }
.task:hover .tact, .task:focus-within .tact { opacity: 1; }
@media (hover: none) { .tact { opacity: 1; } }

/* ---------- Kalender ---------- */
.cal-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.cal-head h2 { min-width: 200px; }
.month { display: grid; grid-template-columns: 42px repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--line); gap: 1px; }
.month .wd { background: var(--surface-2); padding: 6px 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.month .kw { background: var(--surface-2); padding: 8px 4px; font-size: 11.5px; color: var(--muted); text-align: center; }
.day { background: var(--surface); min-height: 104px; padding: 4px 5px 6px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.day:hover { background: var(--surface-2); }
.day.other { background: var(--surface-2); color: var(--muted); }
.day.ferien { background-image: linear-gradient(var(--warn-soft), var(--warn-soft)); background-size: 100% 4px; background-repeat: no-repeat; }
.day .dn { font-size: 13px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
.day.today .dn { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.day.hol .dn { color: var(--red); font-weight: 600; }
.ev { display: block; width: 100%; font-size: 12px; line-height: 1.3; padding: 2px 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.ev.schule { background: var(--surface-2); color: var(--ink-2); border-left: 3px solid var(--accent); }
.ev.feiertag { background: var(--red-soft); color: var(--red); }
.ev.ferien { background: var(--warn-soft); color: var(--muted); }
.ev.task { background: transparent; color: var(--ink-2); border: 1px dashed var(--line-strong); }
.ev.order { background: transparent; color: var(--ink-2); border: 1px dashed var(--accent); }
.ev.work { background: var(--green-soft); color: var(--green); }
.ev.done { text-decoration: line-through; opacity: .7; }
.more { font-size: 11.5px; color: var(--muted); padding-left: 5px; }
.weekgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.wcol { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-height: 220px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.wcol.today { border-color: var(--accent); }
.wcol h3 { font-size: 13.5px; display: flex; justify-content: space-between; }
.wcol .ev { white-space: normal; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* ---------- Assistent ---------- */
.chat { display: flex; flex-direction: column; height: calc(100dvh - 190px); min-height: 420px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: min(560px, 88%); padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot { background: var(--surface-2); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
.msg-btns { display: flex; gap: 6px; flex-wrap: wrap; align-self: flex-start; max-width: 100%; }
.msg-btns .btn { white-space: normal; text-align: left; min-height: 32px; padding: 5px 11px; }
.chat-in { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }

/* ---------- Berichtsheft ---------- */
.week-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.edit-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.sheet-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: #e9ebee; padding: 16px; }
:root[data-theme="dark"] .sheet-wrap { background: #0f1216; }
.sheet-wrap .ihk { margin: 0 auto; box-shadow: 0 2px 10px rgba(0,0,0,.15); zoom: .62; }
@media (max-width: 620px) { .sheet-wrap { padding: 8px; } .sheet-wrap .ihk { zoom: .42; } }
.days { display: grid; gap: 6px; }
.dayrow { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.dayrow:last-child { border-bottom: 0; }
.dayrow .d { font-weight: 500; }
.dayrow .sub { font-size: 13px; color: var(--muted); }
.log { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.log .grow { flex: 1; min-width: 0; }

/* IHK-Ausbildungsnachweis (A4, nach Vorlage) */
.ihk { width: 210mm; min-height: 297mm; padding: 17mm 22.5mm 10mm 24mm; background: #fff; color: #000; font: 10pt/1.25 Arial, Helvetica, sans-serif; }
.ihk table { width: 175mm; border-collapse: collapse; table-layout: fixed; border: 1.5pt solid #000; }
.ihk td { vertical-align: top; padding: 1mm 1.9mm; border: 0; }
.ihk .b { font-weight: 700; }
.ihk .s8 { font-size: 8pt; } .ihk .s9 { font-size: 9pt; }
.ihk .rl { border-right: .75pt solid #000; }
.ihk .bl { border-bottom: .75pt solid #000; }
.ihk .tl { border-top: .75pt solid #000; }
.ihk .hrs { text-align: center; }
.ihk .lines { white-space: pre-wrap; }
.ihk .fill { display: block; min-height: 6mm; }
.ihk .sig { padding-top: 6mm; }

/* ---------- Einstellungen und Formulare ---------- */
.settings { display: grid; gap: 14px; max-width: 820px; }
.setting { padding: 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.setting h3 { margin-bottom: 3px; }
.setting > p { color: var(--muted); font-size: 14px; margin-bottom: 12px; max-width: 64ch; }
.toggle-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 9px 0; }
.toggle-row + .toggle-row { border-top: 1px solid var(--line); }
.toggle-row .sub { color: var(--muted); font-size: 13.5px; }
.switch { position: relative; flex: none; width: 40px; height: 22px; }
.switch input { appearance: none; -webkit-appearance: none; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; border-radius: 11px; background: var(--line-strong); cursor: pointer; transition: background-color .15s; }
.switch input::before { content: ""; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked { background: var(--accent); }
.switch input:checked::before { transform: translateX(18px); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.data-facts { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 14px; }
.data-facts div { display: grid; }
.data-facts strong { font-size: 22px; font-weight: 600; }
.data-facts span { color: var(--muted); font-size: 13px; }
.shortcut-list div { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.shortcut-list div:last-child { border-bottom: 0; }
.shortcut-list dd { display: flex; gap: 5px; }

.input, .select, .textarea { width: 100%; min-height: 38px; padding: 7px 11px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: var(--ink); }
.textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form.three { grid-template-columns: 1fr 1fr 1fr; }
.field { display: grid; gap: 5px; align-content: start; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field > label, .field > .lab, legend.lab { font-weight: 500; font-size: 14px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend.lab { padding: 0; margin-bottom: 5px; }
.opts { display: inline-flex; padding: 3px; gap: 2px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); flex-wrap: wrap; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span { display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; border-radius: 6px; font-weight: 500; color: var(--muted); }
.opt input:checked + span { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.opt input:focus-visible + span { outline: 2px solid var(--focus); }
.picker { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.pick { position: relative; }
.pick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.pick span { display: grid; place-items: center; height: 42px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink-2); }
.pick input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.pick input:focus-visible + span { outline: 2px solid var(--focus); }
.err { color: var(--red); }
.input[aria-invalid="true"] { border-color: var(--red); }

.scrim { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(15, 20, 26, .45); }
.scrim.top { place-items: start center; padding-top: min(12vh, 100px); }
.dialog { width: min(620px, 100%); max-height: min(92vh, 900px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 60px -15px rgba(0,0,0,.4); }
.dialog.narrow { width: min(440px, 100%); }
.dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 12px 12px 20px; border-bottom: 1px solid var(--line); }
.dialog-body { padding: 18px 20px; overflow: auto; }
.dialog-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding: 12px 20px; border-top: 1px solid var(--line); }
.sheet-menu { display: grid; gap: 2px; }
.sheet-menu a { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-weight: 500; }
.sheet-menu a:hover { background: var(--surface-2); }

.palette { width: min(640px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 60px -15px rgba(0,0,0,.4); overflow: hidden; }
.pal-search { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); color: var(--muted); }
.pal-search input { flex: 1; min-height: 50px; border: 0; background: transparent; font-size: 16px; color: var(--ink); outline: none; }
.pal-list { max-height: min(58vh, 440px); overflow: auto; padding: 6px; }
.pal-group { padding: 8px 10px 3px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.pal-item { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 5px 10px; border-radius: 7px; cursor: pointer; }
.pal-item .grow { flex: 1; min-width: 0; }
.pal-item .grow > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-item .sub { font-size: 13px; color: var(--muted); }
.pal-item[aria-selected="true"] { background: var(--accent-soft); }
.pal-item .ic { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); flex: none; }
.pal-empty { padding: 22px 16px; text-align: center; color: var(--muted); }
.pal-foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }

.toast { position: fixed; left: 50%; bottom: 24px; z-index: 120; transform: translate(-50%, 10px); display: flex; align-items: center; gap: 14px; max-width: min(540px, calc(100vw - 32px)); padding: 10px 14px; border-radius: 8px; background: var(--ink); color: var(--surface); opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .15s, transform .15s, visibility 0s .15s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; visibility: visible; transition: opacity .15s, transform .15s; }
.toast button { color: inherit; font-weight: 600; text-decoration: underline; white-space: nowrap; }

/* ---------- Arbeitsmodus ---------- */
.focus-mode { position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column; background: var(--bg); overflow: auto; }
.focus-top { display: flex; align-items: center; gap: 14px; padding: 18px clamp(16px, 4vw, 48px) 0; }
.focus-top .bar { flex: 1; }
.focus-clock { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 50px; text-align: right; }
.focus-body { flex: 1; width: 100%; max-width: 900px; margin: 0 auto; padding: 24px clamp(16px, 5vw, 60px); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
.focus-step { display: flex; gap: 10px; align-items: center; color: var(--muted); flex-wrap: wrap; }
.focus-title { font-size: clamp(28px, 5vw, 44px); font-weight: 600; line-height: 1.15; margin: 12px 0 20px; overflow-wrap: break-word; }
.focus-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.focus-actions .btn { min-height: 46px; padding: 0 22px; font-size: 16px; }
.focus-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 0 clamp(16px, 4vw, 48px) 22px; color: var(--muted); font-size: 13.5px; }
.summary { display: flex; gap: 28px; flex-wrap: wrap; margin: 4px 0 18px; }
.summary div { display: grid; }
.summary strong { font-size: 32px; font-weight: 600; }
.summary span { color: var(--muted); }

/* ---------- Druck ---------- */
#print-root { display: none; }
.pr { color: #000; font: 11pt/1.4 Arial, sans-serif; }
.pr h1 { font-size: 18pt; margin-bottom: 4pt; }
.pr .pr-meta { display: flex; gap: 24pt; margin: 12pt 0 14pt; padding-bottom: 6pt; border-bottom: 1px solid #000; }
.pr .pr-meta span { flex: 1; border-bottom: 1px solid #777; color: #444; }
.pr li { display: flex; gap: 10pt; padding: 6pt 0; border-bottom: 1px solid #bbb; break-inside: avoid; }
.pr .box { width: 12pt; height: 12pt; border: 1.5px solid #000; flex: none; margin-top: 2pt; }
.pr .pr-d { font-size: 9.5pt; color: #333; }

:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after { transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }

/* ---------- Responsiv ---------- */
@media (max-width: 1080px) {
  .detail-grid, .cols, .edit-grid { grid-template-columns: 1fr; }
  .side { position: static; }
  .weekgrid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
@media (max-width: 820px) {
  .app { display: block; }
  .rail { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; top: auto; height: auto; flex-direction: row; padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--line); overflow: visible; }
  .rail .brand, .rail-foot, .nav .desk, .nav-group { display: none; }
  .nav { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; }
  .nav .more-btn, .nav .mob { display: flex; }
  .tt { grid-template-columns: 1fr; }
  .nav a, .nav button { flex-direction: column; justify-content: center; gap: 2px; min-height: 52px; padding: 2px; font-size: 11.5px; text-align: center; }
  .nav .count { display: none; }
  .main { padding-bottom: 96px; }
  .m-brand { display: block; }
  .search-btn kbd { display: none; }
  .toast { bottom: 80px; }
  .top-actions .btn.primary .lbl { display: none; }
  .top-actions .btn.primary { width: 38px; padding: 0; }
  .row .bar { display: none; }
  .month { grid-template-columns: 26px repeat(7, minmax(0, 1fr)); }
  .day { min-height: 64px; padding: 2px; }
  .day .ev { font-size: 10px; padding: 1px 3px; }
  .month .wd { padding: 4px 2px; text-align: center; }
  .chat { height: calc(100dvh - 230px); }
}
@media (max-width: 620px) {
  .form, .form.three { grid-template-columns: 1fr; }
  .picker { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grip { display: none; }
  .task-row { flex-wrap: wrap; }
  .task-row .task-body { flex-basis: calc(100% - 40px); }
  .tact { flex-basis: 100%; margin: 4px 0 0; justify-content: flex-end; }
  .quick-add { grid-template-columns: 1fr auto; }
  .quick-add .opts { grid-column: 1 / -1; justify-self: start; }
  .filter-tools, .head-actions { width: 100%; }
  .filter-tools .input { flex: 1; width: auto; min-width: 0; }
  .dayrow { grid-template-columns: 1fr; gap: 4px; }
  .table .hide-s { display: none; }
  .time { min-width: 70px; }
}
@media print {
  @page { size: A4; margin: 0; }
  body { background: #fff; }
  #app, #modal-root, #focus-root, #palette-root, #toast { display: none !important; }
  #print-root { display: block; }
  #print-root .pr { padding: 16mm; }
  #print-root .ihk { box-shadow: none; margin: 0; }
}
</style>

}

function sortTasks(tasks, mode) {

/* Abschluss einer Durchführung: Verlauf und Berichtsheft pflegen */
function syncCompletion(list) {

    state.history.unshift({ id: uid(), runId: list.runId, listId: list.id, title: list.title, icon: list.icon, color: list.color, at: list.completedAt, duration: list.startedAt ? list.completedAt - list.startedAt : null, tasks: list.tasks.filter(t => t.completed).length });
    state.history = state.history.slice(0, 300);
    if (list.category !== "Aufgaben") addLog(`Abarbeiten der Checkliste „${list.title}“`, "list", list.runId);
    return "finished";
  }
  if (!done && list.completedAt) {
    list.completedAt = null;
    state.history = state.history.filter(h => h.runId !== list.runId);

}

function occursOn(e, k) {
  if (e.date === k) return true;
  if (e.repeat === "keine" || k < e.date) return false;
  const a = pkey(e.date), b = pkey(k);
  if (e.repeat === "täglich") return true;

  return a.getDate() === b.getDate();
}

const eventsOn = k => state.events.filter(e => occursOn(e, k)).sort(byTime);
const workMins = d => d && d.from && d.to && d.to > d.from ? Math.max(0, mins(d.to) - mins(d.from) - d.pause) : 0;
/* Alles, was an einem Tag im Kalender steht */
function dayItems(k) {
  const items = [];
  const hol = holiday(k), fer = ferien(k), d = state.days[k];
  if (hol) items.push({ cls: "feiertag", label: hol });
  /* Ferien nur dezent: Band über dem Tag, Beschriftung am ersten Tag und montags */
  if (fer && !hol && (pkey(k).getDay() === 1 || !ferien(dkey(addDays(pkey(k), -1))))) items.push({ cls: "ferien", label: fer });
  if (d && d.status) items.push({ cls: "work", label: DAY_STATUS[d.status] });
  else if (d && workMins(d)) items.push({ cls: "work", label: `Arbeit ${d.from}–${d.to}` });
  eventsOn(k).forEach(e => items.push({ cls: e.kind === "schule" ? "schule" : "termin", label: (e.from ? e.from + " " : "") + e.title, ev: e.id }));
  state.checklists.forEach(l => { if (!l.template && !l.archived) l.tasks.forEach(t => { if (t.due === k) items.push({ cls: "task" + (t.completed ? " done" : ""), label: "Aufgabe: " + t.title, list: l.id }); }); });
  state.orders.forEach(o => { if (o.due === k) items.push({ cls: "order", label: "Auftrag: " + propLabel(getProp(o.propId)), order: o.id }); });
  state.homework.forEach(h => { if (h.due === k && !h.done) items.push({ cls: "task", label: `HA ${h.subject}: ${h.text}`, hw: true }); });
  return items;
}

const startKey = () => state.settings.profile.start;
const weekNo = k => Math.floor((monday(pkey(k)) - monday(pkey(startKey()))) / 6048e5) + 1;
function weekRange(n) {
  const mon = addDays(monday(pkey(startKey())), (n - 1) * 7);
  const from = n === 1 ? startKey() : dkey(mon);
  const days = [];
  for (let i = 0; i < 5; i++) { const k = dkey(addDays(mon, i)); if (k >= from) days.push(k); }
  return { from, to: dkey(addDays(mon, 4)), days, kw: isoWeek(mon) };
}
function trainingYear(k) {
  const s = pkey(startKey()), d = pkey(k);
  let y = d.getFullYear() - s.getFullYear();
  if (d.getMonth() < s.getMonth() || (d.getMonth() === s.getMonth() && d.getDate() < s.getDate())) y--;
  return Math.max(1, y + 1);
}
const schoolMins = k => holiday(k) ? 0 : eventsOn(k).filter(e => e.kind === "schule" && e.from && e.to).reduce((n, e) => n + mins(e.to) - mins(e.from), 0);
/* Stichpunkte aus allem, was in der Woche gemerkt wurde */
function collectWeek(n) {
  const w = weekRange(n), today = todayKey();
  const seen = new Set(), betrieb = [], schule = [];
  const push = (list, t) => { t = String(t).replace(/^[-–•>\s]+/, "").trim(); const key = norm(t); if (t && !seen.has(key)) { seen.add(key); list.push("-" + t); } };
  let hB = 0, hS = 0, anySchool = false;
  w.days.forEach(k => {
    const d = state.days[k], hol = holiday(k);
    if (hol) push(betrieb, `${hol} (${fmtDs(k)}, Feiertag)`);
    else if (d && d.status) push(betrieb, `${DAY_STATUS[d.status]} am ${fmtDs(k)}`);
    state.logs.filter(l => l.date === k).forEach(l => push(betrieb, l.text));
    if (d) d.entries.forEach(x => push(betrieb, x.text));
    if (k <= today) eventsOn(k).filter(e => e.kind === "termin" && e.report).forEach(e => push(betrieb, e.title + (e.place ? ` (${e.place})` : "")));
    hB += workMins(d);
    const sm = schoolMins(k);
    if (sm) { anySchool = true; hS += sm; }
    if (d && d.school) d.school.split("\n").forEach(t => push(schule, t));
  });
  if (!anySchool) {
    const f = w.days.map(ferien).find(Boolean);
    const first = state.events.filter(e => e.kind === "schule").map(e => e.date).sort()[0];
    push(schule, first && w.to < first ? `Berufsschule erst ab ${fmtD(first)}` : f ? `Kein Unterricht (${f})` : "Kein Berufsschulunterricht in dieser Woche");
  }
  return { betrieb: betrieb.join("\n"), schule: schule.join("\n"), hBetrieb: hB ? fmtH(hB) : "", hSchule: hS ? fmtH(hS) : "" };
}

/* [id, Link, Icon, Name, in unterer Handy-Leiste, Bereich] */
const NAV = [
  ["overview", "#/", "dash", "Start", 1, ""],
  ["school", "#/school", "school", "Stundenplan", 0, "Schule"],
  ["homework", "#/homework", "note", "Hausaufgaben", 0, "Schule"],
  ["report", "#/report", "book", "Berichtsheft", 0, "Schule"],
  ["today", "#/today", "today", "Heute", 1, "Arbeit"],
  ["calendar", "#/calendar", "cal", "Kalender", 1, "Arbeit"],
  ["props", "#/props", "building", "Liegenschaften", 0, "Arbeit"],
  ["assistant", "#/assistant", "chat", "Assistent", 0, "Arbeit"],
  ["lists", "#/lists", "clipboard", "Checklisten", 0, "Arbeit"],
  ["templates", "#/templates", "layers", "Vorlagen", 0, "Arbeit"],
  ["settings", "#/settings", "sliders", "Einstellungen", 0, ""]
];
const SCHOOL_VIEWS = ["school", "homework", "report"];
function curNav(route) {
  if (route.view === "list") return getList(route.listId)?.template ? "templates" : "lists";
  if (route.view === "prop") return "props";
  return route.view;
}
function navLinks(cur, withGroups) {
  let last = "", html = "";
  NAV.forEach(([id, href, ic, label, mobile, group]) => {
    if (withGroups && group !== last) { html += group ? `<div class="nav-group">${group}</div>` : `<div style="height:10px"></div>`; last = group; }
    const count = id === "today" && dayStats().open ? `<span class="count">${dayStats().open}</span>` : id === "homework" && openHw().length ? `<span class="count">${openHw().length}</span>` : "";
    html += `<a href="${href}" class="${mobile ? "" : "desk"}" ${cur === id ? 'aria-current="page"' : ""}>${icon(ic, 19)}<span>${label}</span>${count}</a>`;
  });
  return html;
}
function renderRail(route) {
  const cur = curNav(route);
  return `
    <aside class="rail">
      <a class="brand" href="#/" aria-label="ArbeitsBuddy, zum Start">${LOGO}</a>
      <nav class="nav" aria-label="Hauptnavigation">
        ${navLinks(cur, true)}
        <a href="#/school" class="mob" ${SCHOOL_VIEWS.includes(cur) ? 'aria-current="page"' : ""}>${icon("school", 19)}<span>Schule</span></a>
        <button type="button" class="more-btn" data-act="more">${icon("more", 19)}<span>Mehr</span></button>
      </nav>
      <div class="rail-foot">KW ${isoWeek(new Date())} · ${fmtD(todayKey())}</div>
    </aside>`;
}
function renderTopbar() {
  const dark = resolveTheme() === "dark";
  return `
    <header class="topbar">
      <a class="m-brand" href="#/" aria-label="ArbeitsBuddy, zur Übersicht">${LOGO}</a>
      <button class="search-btn" type="button" data-act="palette" aria-label="Suchen und Befehle (${MOD} K)">${icon("search", 17)}<span class="grow">Suchen …</span><kbd>${MOD} K</kbd></button>
      <div class="top-actions">
        <button class="btn icon" type="button" data-act="theme" aria-label="${dark ? "Helles Design" : "Dunkles Design"}" title="${dark ? "Hell" : "Dunkel"}">${icon(dark ? "sun" : "moon", 18)}</button>
        <button class="btn primary" type="button" data-act="new-event">${icon("plus", 17)}<span class="lbl">Termin</span></button>
      </div>
    </header>`;
}

/* ==========================================================
   Übersicht
   ========================================================== */
function reportHint() {
  const now = new Date(), dow = now.getDay();
  if (dow !== 5 && dow !== 6 && dow !== 0) return "";
  const n = weekNo(todayKey());
  if (n < 1 || state.reports[n]?.done) return "";
  return `<div class="notice"><span>${icon("book", 18)}</span><strong style="flex:1">Berichtsheft für KW ${weekRange(n).kw} erstellen (Ausbildungsnachweis Nr. ${n})</strong><a class="btn primary small" href="#/report/${n}">Jetzt erstellen</a></div>`;
}
function sampleHint() {
  if (state.flags.seedChecked || !sampleLists().length) return "";
  return `<div class="notice warn"><span style="flex:1">In deinen Daten stecken noch die alten Beispiel-Checklisten (Arbeitsbeginn, Maschinenkontrolle, Arbeitsende).</span><div class="btn-row"><button type="button" class="btn small" data-act="keep-samples">Behalten</button><button type="button" class="btn small danger" data-act="drop-samples">Beispieldaten entfernen</button></div></div>`;
}
function renderOverview() {
  const k = todayKey(), d = dayStats();
  const evs = eventsOn(k).filter(e => e.kind !== "schule"), hol = holiday(k);
  const due = dueTasks(k);
  const open = sortLists(runs()).filter(l => !isDone(l) && l.tasks.length).slice(0, 5);
  const n = Math.max(1, weekNo(k)), w = weekRange(n), r = reportFor(n);
  const entries = bullet(r.betrieb).length;
  const ns = nextSchoolDay(), hw = openHw().slice(0, 5);
  return `
    <div class="page-head"><div><h1>${greeting()}, ${esc(state.settings.profile.name.split(" ")[0] || "")}</h1><p class="lede">${fmtLong(k)} · KW ${isoWeek(new Date())}${hol ? ` · ${esc(hol)}` : ""}</p></div></div>
    ${sampleHint()}${reportHint()}
    <div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      <div class="stack" style="gap:14px">
        <div class="sec-head"><h2 style="font-size:20px;display:flex;gap:8px;align-items:center">${icon("school", 20)} Schule</h2></div>
        <section class="panel panel-pad" aria-labelledby="hNs">
          <div class="sec-head"><h2 id="hNs">${ns ? (ns === k ? "Heute Berufsschule" : `Nächster Schultag: ${WD[pkey(ns).getDay()]}, ${fmtDs(ns)}`) : "Berufsschule"}</h2><a class="link-btn" href="#/school">Stundenplan</a></div>
          ${ns ? lessonsOf(ns).map(l => `<div class="item"><span class="time">${esc(l.from)}–${esc(l.to)}</span><div class="grow">${esc(l.subject)}<div class="sub">${esc(l.teacher)}</div></div></div>`).join("") || `<p class="hint-text">Kein Stundenplan eingetragen.</p>` : `<p class="hint-text">Keine Schultage mehr eingetragen.</p>`}
        </section>
        <section class="panel panel-pad" aria-labelledby="hHw">
          <div class="sec-head"><h2 id="hHw">Hausaufgaben</h2><a class="link-btn" href="#/homework">Alle</a></div>
          ${hw.length ? hw.map(h => `<div class="item"><span class="time">${h.due ? (h.due < k ? "überfällig" : fmtDs(h.due)) : "ohne Datum"}</span><div class="grow">${esc(h.text)}<div class="sub">${esc(h.subject)}</div></div></div>`).join("") : `<p class="hint-text">Keine offenen Hausaufgaben.</p>`}
        </section>
        <section class="panel panel-pad" aria-labelledby="hRep">
          <div class="sec-head"><h2 id="hRep">Berichtsheft diese Woche</h2><a class="link-btn" href="#/report/${n}">Öffnen</a></div>
          <p>Nachweis Nr. ${n} · ${fmtD(w.from)} – ${fmtD(w.to)}</p>
          <p class="hint-text" style="margin:4px 0 10px">${r.done ? "Fertig gespeichert." : r.saved ? "Entwurf gespeichert." : `${plural(entries, "Eintrag", "Einträge")} gemerkt.`} Betrieb ${r.hBetrieb || "0"} Std. · Schule ${r.hSchule || "0"} Std.</p>
          ${bar(Math.min(100, Math.round(parseH(sumH(r)) / 40 * 100)), r.done)}
        </section>
      </div>
      <div class="stack" style="gap:14px">
        <div class="sec-head"><h2 style="font-size:20px;display:flex;gap:8px;align-items:center">${icon("building", 20)} Arbeit</h2></div>
        <section class="panel panel-pad" aria-labelledby="hEv">
          <div class="sec-head"><h2 id="hEv">Termine heute</h2><a class="link-btn" href="#/calendar/day/${k}">Kalender</a></div>
          ${evs.length ? evs.map(e => evLine(e, k)).join("") : `<p class="hint-text">Heute keine Termine.</p>`}
          <div class="btn-row" style="margin-top:10px"><button type="button" class="btn small" data-act="day" data-date="${k}">${icon("clock", 15)} Arbeitszeit & Einträge heute</button></div>
        </section>
        <section class="panel panel-pad" aria-labelledby="hOpen">
          <div class="sec-head"><h2 id="hOpen">Offene Aufgaben</h2><a class="link-btn" href="#/today">Heute</a></div>
          ${due.map(({ t, l }) => `<div class="item"><span class="time">${t.due < k ? "überfällig" : "heute fällig"}</span><div class="grow"><a class="link-btn" style="color:inherit" href="#/list/${l.id}">${esc(t.title)}</a><div class="sub">${esc(l.title)}</div></div></div>`).join("")}
          ${open.map(l => { const s = stats(l); return `<div class="item"><span class="time">${s.reqDone}/${s.reqTotal}</span><div class="grow"><a class="link-btn" style="color:inherit" href="#/list/${l.id}">${esc(l.title)}</a>${bar(s.percent)}</div></div>`; }).join("")}
          ${!due.length && !open.length ? `<p class="hint-text">Keine offenen Aufgaben. ${d.req ? "Alles erledigt." : ""}</p>` : ""}
        </section>
      </div>
    </div>`;
}

/* ==========================================================
   Schule: Stundenplan und Hausaufgaben
   ========================================================== */
const schoolTabs = cur => `<nav class="tabs" aria-label="Schule" style="margin-bottom:16px">${NAV.filter(n => n[5] === "Schule").map(([id, href, , label]) => `<a href="${href}" ${cur === id ? 'aria-current="page"' : ""}>${label}</a>`).join("")}</nav>`;
const isSchoolDay = k => eventsOn(k).some(e => e.kind === "schule");
const lessonsOf = k => state.settings.school[pkey(k).getDay()]?.lessons || [];
function nextSchoolDay(from = todayKey(), subject = "") {
  for (let i = 0; i < 120; i++) {
    const k = dkey(addDays(pkey(from), i));
    if (isSchoolDay(k) && (!subject || lessonsOf(k).some(l => l.subject === subject))) return k;
  }
  return "";
}
const openHw = () => state.homework.filter(h => !h.done).sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
const subjects = () => [...new Set([4, 5].flatMap(d => state.settings.school[d].lessons.map(l => l.subject)))];
const lessonLines = d => state.settings.school[d].lessons.map(l => `${l.from}${l.to ? "-" + l.to : ""} ${l.subject}${l.teacher ? " | " + l.teacher : ""}${l.room ? " | " + l.room : ""}`).join("\n");
function renderTimetable() {
  const st = state.settings.school, ns = nextSchoolDay();
  const col = d => {
    const ls = st[d].lessons;
    const rows = ls.map((l, i) => {
      const gap = i && ls[i - 1].to && l.from && ls[i - 1].to < l.from ? `<div class="lesson pause"><span>${esc(ls[i - 1].to)}–${esc(l.from)}</span><span>Pause</span><span></span></div>` : "";
      return gap + `<div class="lesson"><span class="time">${esc(l.from)}–${esc(l.to)}</span><div><div>${esc(l.subject)}</div><div class="sub">${esc([l.teacher, l.room].filter(Boolean).join(" · "))}</div></div>
        <button type="button" class="btn small" data-act="hw-new" data-value="${esc(l.subject)}" title="Hausaufgabe für ${esc(l.subject)}">${icon("plus", 13)} HA</button></div>`;
    }).join("");
    return `<section class="panel panel-pad"><div class="sec-head"><h2>${WDL[d]}</h2><span class="hint-text">${st[d].from}–${st[d].to} Uhr</span></div>${rows || `<p class="hint-text">Noch keine Stunden eingetragen.</p>`}</section>`;
  };
  return `
    <div class="page-head"><div><h1>Stundenplan</h1><p class="lede">Berufsschule jeden Donnerstag und Freitag, Raum B108.${ns ? ` Nächster Schultag: ${fmtLong(ns)}.` : ""}</p></div></div>
    ${schoolTabs("school")}
    <div class="tt">${col(4)}${col(5)}</div>
    <form class="setting" id="schoolForm" style="margin-top:18px">
      <h3>Stundenplan bearbeiten</h3><p>Eine Stunde pro Zeile: „08:45-09:30 Fach | Lehrkraft | Raum“. Unterrichtszeiten zählen fürs Berichtsheft ohne Abzug der Pausen.</p>
      <div class="form">
        ${[4, 5].map(d => `<div class="field"><span class="lab">${WDL[d]}</span><div style="display:flex;gap:6px;align-items:center"><input class="input" type="time" id="s${d}f" value="${st[d].from}" aria-label="${WDL[d]} von"> – <input class="input" type="time" id="s${d}t" value="${st[d].to}" aria-label="${WDL[d]} bis"></div>
          <textarea class="textarea" id="s${d}l" rows="7" aria-label="Stundenplan ${WDL[d]}">${esc(lessonLines(d))}</textarea></div>`).join("")}
      </div>
      <div class="btn-row" style="margin-top:12px"><button type="submit" class="btn primary">Speichern</button><button type="button" class="btn" data-act="school-reseed">Berufsschultage im Kalender neu eintragen</button></div>
    </form>`;
}
function renderHomework() {
  const k = todayKey(), subs = subjects();
  const all = [...new Set([...subs, ...state.homework.map(h => h.subject)])];
  const pre = ui.hwSubject && all.includes(ui.hwSubject) ? ui.hwSubject : subs[0] || "Sonstiges";
  const groups = all.map(sub => {
    const items = state.homework.filter(h => h.subject === sub).sort((a, b) => Number(a.done) - Number(b.done) || (a.due || "9999").localeCompare(b.due || "9999"));
    if (!items.length) return "";
    const openN = items.filter(h => !h.done).length;
    return `<section class="panel panel-pad"><div class="sec-head"><h2>${esc(sub)}</h2><span class="hint-text">${openN ? `${openN} offen` : "alles erledigt"}</span></div>
      ${items.map(h => `<div class="hw ${h.done ? "done" : ""}">
        <button type="button" class="check" role="checkbox" aria-checked="${h.done}" aria-label="${esc(h.text)}" data-act="hw-toggle" data-value="${h.id}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19.5 7"/></svg></button>
        <div class="grow">${esc(h.text)}<div class="sub">${h.due ? `bis ${WD[pkey(h.due).getDay()]}, ${fmtD(h.due)}${!h.done && h.due < k ? " · überfällig" : ""}` : "ohne Datum"}</div></div>
        <button type="button" class="btn small icon quiet danger" data-act="hw-delete" data-value="${h.id}" aria-label="Löschen: ${esc(h.text)}" title="Löschen">${icon("trash", 15)}</button></div>`).join("")}</section>`;
  }).join("");
  return `
    <div class="page-head"><div><h1>Hausaufgaben</h1><p class="lede">Nach Fach sortiert. Das Datum wird auf die nächste Stunde im Fach gesetzt.</p></div></div>
    ${schoolTabs("homework")}
    <form class="panel panel-pad form" id="hwForm" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr) 170px auto;align-items:end;margin-bottom:18px" autocomplete="off">
      <div class="field"><label for="hwSub">Fach</label><select class="select" id="hwSub">${[...all, ...(all.includes("Sonstiges") ? [] : ["Sonstiges"])].map(x => `<option ${x === pre ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
      <div class="field"><label for="hwText">Aufgabe</label><input class="input" id="hwText" maxlength="2000" placeholder="z. B. S. 42 Nr. 3 bearbeiten"></div>
      <div class="field"><label for="hwDue">Bis</label><input class="input" id="hwDue" type="date" value="${esc(nextSchoolDay(dkey(addDays(new Date(), 1)), pre))}"></div>
      <button type="submit" class="btn primary">${icon("plus", 16)} Eintragen</button>
    </form>
    <div class="stack" style="gap:14px">${groups || emptyState({ ic: "note", title: "Keine Hausaufgaben", text: "Trag oben ein, was bis zur nächsten Stunde zu erledigen ist." })}</div>`;
}

/* ==========================================================
   Heute
   ========================================================== */
function renderToday() {
  const k = todayKey(), dd = state.days[k];
  const withOpen = sortLists(runs()).filter(l => l.tasks.some(t => !t.completed && !t.skipped));
  const groups = withOpen.map(l => {
    const open = l.tasks.filter(t => !t.completed && !t.skipped);
    const ordered = [...open.filter(t => t.type === "required"), ...open.filter(t => t.type === "optional")];
    return `
      <section class="group" style="margin-top:20px" aria-labelledby="g-${l.id}">
        <div class="sec-head"><h2 id="g-${l.id}"><a href="#/list/${l.id}" style="text-decoration:none">${esc(l.title)}</a> <span class="hint-text">${plural(open.length, "Aufgabe", "Aufgaben")} offen</span></h2>
        <button type="button" class="btn small" data-act="focus" data-list="${l.id}">${icon("play", 13)} Arbeitsmodus</button></div>
        <ul class="tasks">${ordered.map(t => renderTask(t, l, { compact: true })).join("")}</ul>
      </section>`;
  }).join("");
  const evs = eventsOn(k);
  return `
    <div class="page-head"><div><h1>Heute</h1><p class="lede">${fmtLong(k)}</p></div>
      <div class="head-actions"><button type="button" class="btn" data-act="day" data-date="${k}">${icon("clock", 16)} Arbeitszeit & Berichtsheft</button></div></div>
    <div class="cols">
      <div>${groups || emptyState({ ic: "check", title: "Keine offenen Aufgaben", text: "Starte eine Vorlage oder lege über den Assistenten einen Auftrag an.", actions: `<a class="btn" href="#/templates">Vorlagen</a><a class="btn primary" href="#/assistant">Assistent</a>` })}</div>
      <aside class="panel panel-pad">
        <div class="sec-head"><h2>Termine</h2><button type="button" class="btn small" data-act="new-event" data-date="${k}">${icon("plus", 14)} Termin</button></div>
        ${evs.length ? evs.map(e => evLine(e, k)).join("") : `<p class="hint-text">Keine Termine.</p>`}
        <div class="sec-head" style="margin-top:18px"><h2>Arbeitszeit</h2></div>
        <p>${dd && dd.status ? DAY_STATUS[dd.status] : dd && workMins(dd) ? `${dd.from}–${dd.to} Uhr${dd.pause ? `, ${dd.pause} Min. Pause` : ""} = ${fmtH(workMins(dd))} Std.` : `<span class="hint-text">Noch nicht eingetragen.</span>`}</p>
      </aside>
    </div>`;
}

/* ==========================================================
   Checklisten und Vorlagen
   ========================================================== */
function renderCard(list) {
  const s = stats(list);
  const meta = list.template ? `${s.reqTotal} Pflicht, ${s.optTotal} optional` : isDone(list) ? "Alle Pflichtaufgaben erledigt" : `${s.reqDone} von ${s.reqTotal} Pflichtaufgaben`;
  const primary = list.archived
    ? `<button type="button" class="btn small" data-act="archive" data-list="${list.id}">${icon("undo", 14)} Wiederherstellen</button>`
    : list.template
      ? `<button type="button" class="btn small" data-act="start-template" data-list="${list.id}">${icon("play", 13)} Starten</button>`
      : `<button type="button" class="btn small" data-act="focus" data-list="${list.id}">${icon("play", 13)} Arbeitsmodus</button>`;
  return `
    <article class="lcard">
      <div class="head">${tile(list)}<div><h3><a href="#/list/${list.id}">${esc(list.title)}</a></h3><p>${esc(list.description || "Keine Beschreibung")}</p></div></div>
      <div class="meta">${stateLabel(list)}<span class="hint-text">${meta}</span></div>
      ${list.template ? "" : bar(s.percent, isDone(list))}
      <div class="foot">${primary}<span class="grow"></span>
        <button type="button" class="btn small icon quiet ${list.favorite ? "fav-on" : ""}" data-act="fav" data-list="${list.id}" aria-pressed="${list.favorite}" aria-label="Favorit: ${esc(list.title)}" title="Favorit">${icon("star", 17, list.favorite ? "filled" : "")}</button>
      </div>
    </article>`;
}
function renderLists(route) {
  const tab = route.tab, active = runs();
  const fav = state.checklists.filter(c => !c.archived && c.favorite), arch = state.checklists.filter(c => c.archived);
  const shown = sortLists(tab === "favorites" ? fav : tab === "archive" ? arch : active);
  const tabs = [["active", "#/lists", "Aktiv", active.length], ["favorites", "#/lists/favorites", "Favoriten", fav.length], ["archive", "#/lists/archive", "Archiv", arch.length]];
  const empties = {
    active: { title: "Noch keine Checkliste", text: "Starte eine Vorlage oder lege eine neue Checkliste an.", actions: `<a class="btn" href="#/templates">Vorlagen</a><button type="button" class="btn primary" data-act="new-list">${icon("plus", 16)} Neue Checkliste</button>` },
    favorites: { ic: "star", title: "Keine Favoriten", text: "Markiere Checklisten mit dem Stern, dann liegen sie hier griffbereit." },
    archive: { ic: "archive", title: "Das Archiv ist leer", text: "Archivierte Checklisten bleiben hier erhalten." }
  };
  return `
    <div class="page-head"><div><h1>Checklisten</h1><p class="lede">Alles, was du gerade abarbeitest.</p></div>
      <div class="head-actions"><button type="button" class="btn primary" data-act="new-list">${icon("plus", 16)} Neue Checkliste</button></div></div>
    <div class="toolbar">
      <nav class="tabs" aria-label="Ansicht">${tabs.map(([id, href, label, n]) => `<a href="${href}" ${tab === id ? 'aria-current="page"' : ""}>${label} <span class="n">${n}</span></a>`).join("")}</nav>
      <select class="select" id="listSort" aria-label="Sortierung" style="width:auto">${[["updated", "Zuletzt geändert"], ["alpha", "Alphabetisch"], ["favorite", "Favoriten zuerst"], ["progress", "Fortschritt"]].map(([v, l]) => `<option value="${v}" ${state.settings.sort === v ? "selected" : ""}>${l}</option>`).join("")}</select>
    </div>
    ${shown.length ? `<div class="grid">${shown.map(renderCard).join("")}</div>` : emptyState(empties[tab])}`;
}
function renderTemplates() {
  const list = sortLists(templates());
  return `
    <div class="page-head"><div><h1>Vorlagen</h1><p class="lede">Wiederkehrende Abläufe einmal anlegen und mit einem Klick starten.</p></div>
      <div class="head-actions"><button type="button" class="btn primary" data-act="new-list" data-template="1">${icon("plus", 16)} Neue Vorlage</button></div></div>
    ${list.length ? `<div class="stack">${list.map(l => { const s = stats(l); return `
      <div class="row">${tile(l)}<div class="grow"><a class="cover" href="#/list/${l.id}">${esc(l.title)}</a><div class="sub">${esc(l.description || "Keine Beschreibung")} · ${plural(s.reqTotal, "Pflichtaufgabe", "Pflichtaufgaben")}${s.optTotal ? `, ${s.optTotal} optional` : ""}</div></div>
      <button type="button" class="btn primary small" style="position:relative;z-index:1" data-act="start-template" data-list="${l.id}">${icon("play", 13)} Starten</button></div>`; }).join("")}</div>`
      : emptyState({ ic: "layers", title: "Noch keine Vorlagen", text: "Öffne eine Checkliste und wähle „Als Vorlage speichern“, oder lege direkt eine Vorlage an." })}`;
}

const canReorder = () => ui.filter === "all" && ui.sort === "manual" && !ui.q.trim();
function visibleTasks(list) {
  let t = list.tasks;
  const q = norm(ui.q.trim());
  if (q) t = t.filter(x => norm(`${x.title} ${x.note} ${x.hint} ${x.category}`).includes(q));
  if (ui.filter === "required") t = t.filter(x => x.type === "required");
  if (ui.filter === "optional") t = t.filter(x => x.type === "optional");

/* ==========================================================
   Assistent (regelbasiert, ohne Internet)
   ========================================================== */
let chatBtns = [];
const say = (text, btns) => { state.chat.push({ from: "bot", text }); state.chat = state.chat.slice(-200); chatBtns = btns || []; };
const HELP = "Ich helfe dir bei Aufträgen, Aufgaben und Fragen zu Liegenschaften. Probier z. B.:\n• „Auftrag anlegen“\n• „Welche Firma hat 20630?“\n• „Was betreut RM?“\n• „Stadtberger Str.“\n• „Checkliste abarbeiten“\n• „Termine heute“";
const baseBtns = () => [
  { label: "Auftrag anlegen", run: () => startOrder() },
  { label: "Checkliste abarbeiten", run: () => pickList() },
  { label: "Termine heute", run: () => answer("termine heute") }
];
const stepDef = s => { const [label, opts] = s.split("|"); return { label: label.trim(), options: (opts || "").split(",").map(x => x.trim()).filter(Boolean) }; };
const propInfo = p => `${p.name}\nVE ${p.ve} · ${p.firma} (Firma ${p.firmaNr})\nSachbearbeiter: ${p.sb || "–"}${p.ort ? `\nOrt: ${p.ort}` : ""}`;

function startOrder(p) {
  if (!state.properties.length) { ui.flow = null; return say("Es sind noch keine Liegenschaften da. Importiere sie unter Liegenschaften → CSV importieren, dann kann ich Aufträge anlegen.", baseBtns()); }
  ui.flow = { type: "order", prop: null, i: 0, answers: [] };
  if (p) return pickProp(p);
  say("Für welche Liegenschaft ist der Auftrag? Tippe Straße, einen Teil des Namens oder die VE-Nummer.", [{ label: "Abbrechen", run: stopFlow }]);
}
function pickProp(p) {
  ui.flow.prop = p.id;
  say(`${propInfo(p)}`);
  askStep();
}
function askStep() {
  const f = ui.flow, steps = state.settings.orderSteps;
  if (f.i >= steps.length) return finishOrder();
  const s = stepDef(steps[f.i]);
  say(`Schritt ${f.i + 1} von ${steps.length}: ${s.label}`, [
    ...s.options.map(o => ({ label: o, run: () => { state.chat.push({ from: "me", text: o }); stepAnswer(o); } })),
    { label: "Überspringen", run: () => stepAnswer("") },
    { label: "Abbrechen", run: stopFlow }
  ]);
}
function stepAnswer(a) {
  const f = ui.flow;
  f.answers.push({ q: stepDef(state.settings.orderSteps[f.i]).label, a });
  f.i++;
  askStep();
}
const qLabel = q => q.replace(/\s*\(.*\)$/, "").replace(/[?:]\s*$/, "").trim();
function orderText(o) {
  const p = getProp(o.propId);
  return [`Auftrag – ${p ? p.name : "Liegenschaft"}`, p ? `VE: ${p.ve} | Firma: ${p.firma} (Firma ${p.firmaNr}) | Sachbearbeiter: ${p.sb || "–"}` : "", ...o.answers.filter(x => x.a).map(x => `${qLabel(x.q)}: ${x.a}`), `Erfasst am ${fmtD(dkey(o.at))}`].filter(Boolean).join("\n");
}
function finishOrder() {
  const f = ui.flow, p = getProp(f.prop);
  const dueAns = f.answers.find(x => /termin|datum/i.test(x.q));
  const o = { id: uid(), at: Date.now(), propId: f.prop, answers: f.answers, due: parseDate(dueAns && dueAns.a) };
  o.summary = orderText(o);
  state.orders.push(o);
  const desc = (f.answers[0] || {}).a;
  addLog(`Erstellung eines Auftrags für ${p.name} (VE ${p.ve})${desc ? ": " + desc : ""}`, "order", o.id);
  ui.flow = null;
  say(`Zusammenfassung:\n\n${o.summary}\n\nDer Auftrag ist gespeichert und mit der Liegenschaft verknüpft.`, [
    { label: "Kopieren", run: () => copyText(o.summary) },
    { label: "Als Aufgabe anlegen", run: () => orderToTask(o) },
    { label: "Als Termin anlegen", run: () => orderToEvent(o) },
    { label: "Neuer Auftrag", run: () => startOrder() }
  ]);
}
function orderToTask(o) {
  const p = getProp(o.propId), desc = (o.answers[0] || {}).a || "Auftrag";
  inbox().tasks.push(makeTask({ title: `${desc} – ${p ? p.name : ""}`.slice(0, 300), due: o.due, propId: o.propId, category: "Auftrag", note: o.summary, priority: /dringend|notfall/i.test(o.summary) ? "high" : "normal" }));
  say(`Aufgabe angelegt${o.due ? `, fällig am ${fmtD(o.due)}` : ""}. Du findest sie unter Checklisten → Aufgaben.`, baseBtns());
}
function orderToEvent(o) {
  const p = getProp(o.propId), desc = (o.answers[0] || {}).a || "Auftrag";
  state.events.push(makeEvent({ title: `${desc} – ${p ? p.name : ""}`.slice(0, 200), date: o.due || todayKey(), allDay: true, propId: o.propId, note: o.summary }));
  say(`Termin am ${fmtD(o.due || todayKey())} angelegt.`, baseBtns());
}
function pickList() {
  const lists = runs().filter(l => l.tasks.some(t => !t.completed && !t.skipped));
  if (!lists.length) return say("Es gibt gerade keine offene Checkliste oder Aufgabe.", baseBtns());
  say("Welche Checkliste gehen wir durch?", lists.slice(0, 10).map(l => ({ label: l.title, run: () => startList(l.id) })));
}
function startList(listId) {
  ui.flow = { type: "list", listId, skip: new Set() };
  nextListStep();
}
function nextListStep() {
  const f = ui.flow, l = getList(f.listId);
  const t = l && l.tasks.find(x => !x.completed && !x.skipped && !f.skip.has(x.id));
  if (!t) { ui.flow = null; return say(l && isDone(l) ? `„${l.title}“ ist abgeschlossen. Gut gemacht!` : "Keine offenen Punkte mehr in dieser Runde.", baseBtns()); }
  const s = stats(l);
  say(`${s.reqDone}/${s.reqTotal} erledigt. Nächster Punkt:\n${t.title}${t.type === "optional" ? " (optional)" : ""}${t.hint ? `\nHinweis: ${t.hint}` : ""}${t.note ? `\nNotiz: ${t.note}` : ""}`, [
    { label: "Erledigt", run: () => { setCompleted(l, t, true); nextListStep(); } },
    { label: t.type === "optional" ? "Überspringen" : "Später", run: () => { if (t.type === "optional") { t.skipped = true; touch(l); } else f.skip.add(t.id); nextListStep(); } },
    { label: "Stopp", run: stopFlow }
  ]);
}
function stopFlow() { ui.flow = null; say("Alles klar, abgebrochen. Womit kann ich helfen?", baseBtns()); }
function answer(text) {
  const q = text.trim(), n = norm(q), f = ui.flow;
  if (f && f.type === "order" && !f.prop) {
    const hits = propMatches(q);
    if (hits.length === 1) return pickProp(hits[0]);
    if (!hits.length) return say("Dazu finde ich keine Liegenschaft. Versuch es mit einem anderen Teil der Straße oder der VE-Nummer.", [{ label: "Abbrechen", run: stopFlow }]);
    return say(`Ich habe ${hits.length} Treffer. Welche meinst du?`, [...hits.slice(0, 12).map(p => ({ label: `${p.ve} ${p.name} (${p.sb})`, run: () => pickProp(p) })), { label: "Abbrechen", run: stopFlow }]);
  }
  if (f && f.type === "order") return stepAnswer(q);
  if (f && f.type === "list") {
    const l = getList(f.listId), t = l && l.tasks.find(x => !x.completed && !x.skipped && !f.skip.has(x.id));
    if (/stop|abbrech|ende/.test(n)) return stopFlow();
    if (t && /erledigt|fertig|ok|ja|done/.test(n)) { setCompleted(l, t, true); return nextListStep(); }
    if (t && /weiter|spater|uberspring|skip/.test(n)) { if (t.type === "optional") t.skipped = true; else f.skip.add(t.id); return nextListStep(); }
    return say("Antworte mit „erledigt“, „später“ oder „stopp“.", chatBtns);
  }
  if (/hilfe|help|was kannst/.test(n)) return say(HELP, baseBtns());
  if (/auftrag/.test(n)) {
    const rest = q.replace(/.*auftrag\w*\s*(anlegen|erstellen|fur|für)?\s*/i, "");
    const hits = rest.length > 2 ? propMatches(rest) : [];
    return hits.length === 1 ? startOrder(hits[0]) : startOrder();
  }
  if (/checkliste|abarbeiten|aufgabe/.test(n)) return pickList();
  if (/termin|heute|kalender/.test(n)) {
    const evs = eventsOn(todayKey());
    return say(evs.length ? "Heute:\n" + evs.map(e => `• ${e.from ? e.from + (e.to ? "–" + e.to : "") : "ganztägig"} ${e.title}`).join("\n") : "Heute stehen keine Termine im Kalender.", baseBtns());
  }
  const ve = q.match(/\b(\d{5})\b/);
  if (ve) {
    const hits = state.properties.filter(p => p.ve === ve[1]);
    return say(hits.length ? hits.map(propInfo).join("\n\n") : `Die VE ${ve[1]} kenne ich nicht.`, hits.map(p => ({ label: `Auftrag für ${p.ve}`, run: () => startOrder(p) })));
  }
  const sbs = [...new Set(state.properties.flatMap(p => p.sb.split("/")).filter(Boolean))];
  const tokens = q.split(/[^A-Za-zÄÖÜäöü]+/).filter(Boolean);
  const sb = sbs.find(s => tokens.some(t => t.toLowerCase() === s.toLowerCase()) && (/betreut|sachbearbeiter|zustandig|macht/.test(n) || tokens.length === 1));
  if (sb) {
    const hits = state.properties.filter(p => !p.archived && p.sb.split("/").includes(sb)).sort((a, b) => a.ve.localeCompare(b.ve));
    return say(`${sb} betreut ${hits.length} Liegenschaften:\n` + hits.map(p => `• ${p.ve} ${p.name} (Firma ${p.firmaNr})`).join("\n"));
  }
  const hits = propMatches(q);
  if (hits.length) return say(hits.slice(0, 8).map(p => `• ${p.ve} ${p.name} – Firma ${p.firmaNr}, ${p.sb}`).join("\n") + (hits.length > 8 ? `\n… und ${hits.length - 8} weitere` : ""), hits.slice(0, 4).map(p => ({ label: `Auftrag ${p.ve}`, run: () => startOrder(p) })));
  say("Das habe ich nicht verstanden. " + HELP, baseBtns());
}
function chatSend(text) {
  text = text.trim();
  if (!text) return;
  state.chat.push({ from: "me", text: text.slice(0, 4000) });
  answer(text);
  saveState(); ui.chatInput = ""; render();
  setTimeout(() => $("#chatInput")?.focus(), 0);
}
function renderAssistant() {
  if (!state.chat.length) say("Hallo! " + HELP, baseBtns());
  else if (!chatBtns.length && !ui.flow) chatBtns = baseBtns();
  return `
    <div class="page-head"><div><h1>Assistent</h1><p class="lede">Begleitet dich Schritt für Schritt bei Aufträgen und Aufgaben. Funktioniert ohne Internet.</p></div>
      <div class="head-actions"><button type="button" class="btn" data-act="chat-clear">${icon("trash", 16)} Verlauf leeren</button></div></div>
    <div class="chat">
      <div class="chat-log" id="chatLog" aria-live="polite">
        ${state.chat.map(m => `<div class="msg ${m.from}">${esc(m.text)}</div>`).join("")}
        ${chatBtns.length ? `<div class="msg-btns">${chatBtns.map((b, i) => `<button type="button" class="btn" data-act="chat-btn" data-value="${i}">${esc(b.label)}</button>`).join("")}</div>` : ""}
      </div>
      <form class="chat-in" id="chatForm" autocomplete="off">
        <input class="input" id="chatInput" placeholder="${ui.flow && ui.flow.type === "order" && !ui.flow.prop ? "Straße, Name oder VE …" : "Nachricht schreiben …"}" aria-label="Nachricht an den Assistenten" value="${esc(ui.chatInput)}">
        <button type="submit" class="btn primary" aria-label="Senden">${icon("send", 17)}</button>
      </form>
    </div>`;
}

const TITLES = { school: "Stundenplan", homework: "Hausaufgaben", overview: "Start", today: "Heute", calendar: "Kalender", props: "Liegenschaften", assistant: "Assistent", lists: "Checklisten", templates: "Vorlagen", report: "Berichtsheft", settings: "Einstellungen" };
function focusKey(el) { const d = el.dataset || {}; return [el.id, d.act, d.task, d.list, d.value, d.date, el.getAttribute("name"), el.getAttribute("href")].join("|"); }
function findByKey(key) {
  if (!key || /^\|+$/.test(key)) return null;
  return $$("#app button, #app input, #app select, #app a, #app textarea").find(el => focusKey(el) === key) || null;
}
function resetListUi() { ui.filter = "all"; ui.sort = "manual"; ui.q = ""; ui.quick = ""; ui.quickType = "required"; ui.expanded = new Set(); }
function renderPage(route) {
  switch (route.view) {
    case "today": return renderToday();
    case "calendar": return renderCalendar(route);
    case "props": return renderProps();
    case "prop": return renderProp(getProp(route.propId));
    case "assistant": return renderAssistant();
    case "lists": return renderLists(route);
    case "list": return renderListPage(getList(route.listId));
    case "templates": return renderTemplates();
    case "report": return renderReport(route);
    case "school": return renderTimetable();
    case "homework": return renderHomework();
    case "settings": return renderSettings();
    default: return renderOverview();
  }
}
function render(opts = {}) {
  const route = ui.route = parseRoute();
  if (route.view === "list") { if (ui.lastList !== route.listId) { resetListUi(); ui.lastList = route.listId; } } else ui.lastList = null;
  /* Bericht beim Verlassen oder Wochenwechsel als Entwurf sichern */
  if (ui.rep && ui.rep.dirty && $("#repForm") && (route.view !== "report" || route.n !== ui.rep.n)) saveReport();
  if (route.view !== "report") ui.rep = null;
  const app = $("#app"), active = document.activeElement;
  const keyBefore = app.contains(active) ? focusKey(active) : null;
  const caret = active && typeof active.selectionStart === "number" ? [active.selectionStart, active.selectionEnd] : null;
  const y = window.scrollY;
  const root = document.documentElement;
  root.dataset.theme = resolveTheme();
  root.dataset.motion = state.settings.animations ? "on" : "off";
  app.innerHTML = `
    <a class="skip" href="#main" data-act="skip-link">Zum Inhalt springen</a>
    <div class="app">${renderRail(route)}<div class="main">${renderTopbar()}<main class="page" id="main" tabindex="-1">${renderPage(route)}</main></div></div>`;
  const list = route.view === "list" ? getList(route.listId) : route.view === "prop" ? getProp(route.propId) : null;
  document.title = `${list ? list.title || list.name : TITLES[route.view] || "Übersicht"} – ArbeitsBuddy`;
  const log = $("#chatLog");
  if (log) log.scrollTop = log.scrollHeight;
  ui.flash = null;
  if (ui.scrollTo) {
    const el = document.getElementById("task-" + ui.scrollTo);
    ui.scrollTo = null;
    if (el) el.scrollIntoView({ block: "center" });
  } else if (opts.top) {
    window.scrollTo(0, 0);
    const h = $("h1", app);
    if (h && !opts.initial) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
  } else {
    window.scrollTo(0, y);
    const el = findByKey(keyBefore);
    if (el) { el.focus({ preventScroll: true }); if (caret && typeof el.setSelectionRange === "function") { try { el.setSelectionRange(caret[0], caret[1]); } catch (e) { /* ohne Auswahl */ } } }
  }
}
function refreshTaskList() {

  if (!list || !wrap) { render(); return; }
  wrap.innerHTML = renderTaskItems(list);

let toastTimer = null, toastAction = null;
function toast(msg, o = {}) {
  const el = $("#toast");
  if (!el) return;
  el.innerHTML = `<span>${esc(msg)}</span>${o.action ? `<button type="button" data-act="toast-action">${esc(o.action.label)}</button>` : ""}`;
  toastAction = o.action || null;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), o.ms || 3400);
}
const snapshot = () => JSON.stringify(state);
function toastUndo(msg, snap) {
  toast(msg, { ms: 7000, action: { label: "Rückgängig", run: () => { state = sanitizeState(JSON.parse(snap)); state.flags.schoolSeeded = true; saveState(); render(); toast("Wiederhergestellt."); } } });
}
function copyText(t) {
  const done = () => toast("In die Zwischenablage kopiert.");
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done));
  else fallbackCopy(t, done);
}
function fallbackCopy(t, done) {
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("Kopieren nicht möglich."); }
  ta.remove();
}
