  --side-2: #0e4f4a;
  --side-ink: #e8f4f1;
  --side-muted: #9cc3bc;
  --shadow-sm: 0 1px 2px rgba(15, 27, 26, .05), 0 1px 3px rgba(15, 27, 26, .06);
  --shadow: 0 2px 6px rgba(15, 27, 26, .05), 0 10px 24px -8px rgba(15, 27, 26, .12);
  --shadow-lg: 0 18px 50px -12px rgba(11, 59, 55, .35);
  --r: 18px;
  --r-sm: 12px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b1413;
  --dot: rgba(61, 214, 156, .06);
  --surface: #111d1b;
  --surface-2: #16241f;
  --ink: #e6f0ee;
  --ink-2: #c3d4d0;
  --muted: #8fa5a0;
  --line: #1f302c;
  --line-strong: #2e4540;
  --accent: #3dd69c;
  --accent-2: #5fe3b0;
  --accent-ink: #062b22;
  --accent-soft: #143a31;
  --mint: #3dd69c;
  --mint-ink: #7eebc0;
  --mint-soft: #143a31;
  --green: #3dd69c;
  --green-soft: #143a31;
  --red: #ff8a80;
  --red-soft: #3a2020;
  --warn-soft: #3a2a20;
  --focus: #3dd69c;
  --track: #1f302c;
  --side: #07100f;
  --side-2: #0f2421;
  --side-ink: #e6f0ee;
  --side-muted: #7f9a94;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow: 0 2px 6px rgba(0, 0, 0, .35), 0 10px 24px -8px rgba(0, 0, 0, .5);
  --shadow-lg: 0 18px 50px -12px rgba(0, 0, 0, .7);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font: 400 15px/1.55 var(--font); -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv11", "ss01"; background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.2px), radial-gradient(1200px 600px at 110% -10%, color-mix(in srgb, var(--mint) 14%, transparent), transparent 60%), radial-gradient(900px 500px at -10% 110%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%);
  background-size: 22px 22px, auto, auto; background-attachment: fixed;
}
body.no-scroll { overflow: hidden; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
h1[tabindex="-1"]:focus, main:focus { outline: none; }
.i { display: block; flex: none; }
.i.filled path, .i.filled polygon { fill: currentColor; }
.muted, .hint-text { color: var(--muted); }
.hint-text { font-size: 13.5px; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 300; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 8px; }
.skip:focus { top: 12px; }

h1 { font-size: clamp(28px, 3.6vw, 38px); font-weight: 800; line-height: 1.1; letter-spacing: -.03em; }
h2 { font-size: 17px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em; }
h3 { font-size: 15.5px; font-weight: 650; line-height: 1.3; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--accent-2); }
.eyebrow::before { content: ""; width: 18px; height: 2px; border-radius: 2px; background: var(--mint); }
.lede { color: var(--muted); margin-top: 8px; max-width: 62ch; }
.hl { background: linear-gradient(transparent 62%, color-mix(in srgb, var(--mint) 35%, transparent) 62%); padding: 0 2px; }

/* ---------- Buttons ---------- */
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 0 15px; border: 1px solid var(--line-strong); border-radius: 11px; background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14.5px; white-space: nowrap; text-decoration: none; transition: transform .18s var(--ease), box-shadow .18s var(--ease), background-color .15s, border-color .15s; }
.btn:hover { border-color: var(--accent-2); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.98); }
.btn.primary { background: linear-gradient(180deg, var(--accent-2), var(--accent)); border-color: transparent; color: var(--accent-ink); box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--accent) 60%, transparent); }
.btn.primary::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .35) 50%, transparent 70%); transform: translateX(-120%); transition: transform .6s var(--ease); }
.btn.primary:hover::after { transform: translateX(120%); }
.btn.primary:hover { box-shadow: 0 10px 22px -8px color-mix(in srgb, var(--accent) 70%, transparent); }
.btn.danger { color: var(--red); }
.btn.danger:hover { background: var(--red-soft); border-color: var(--red); }
.btn.danger.solid { background: var(--red); border-color: var(--red); color: #fff; }
.btn.quiet { border-color: transparent; background: transparent; box-shadow: none; }
.btn.quiet:hover { background: var(--surface-2); transform: none; }
.btn.small { min-height: 32px; padding: 0 11px; font-size: 13.5px; border-radius: 9px; }
.btn.icon { width: 38px; padding: 0; }
.btn.small.icon { width: 32px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link-btn { color: var(--accent-2); font-weight: 600; text-decoration: none; background-image: linear-gradient(currentColor, currentColor); background-size: 0 1.5px; background-position: 0 100%; background-repeat: no-repeat; transition: background-size .25s var(--ease); }
.link-btn:hover { background-size: 100% 1.5px; }

/* ---------- Gerüst ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.rail { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: 20px 14px; background: linear-gradient(180deg, var(--side-2), var(--side)); color: var(--side-ink); overflow-y: auto; }
.brand { display: block; padding: 2px 8px 18px; text-decoration: none; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 38px; height: 38px; flex: none; transition: transform .35s var(--ease); }
.brand:hover .logo-mark { transform: rotate(-8deg) scale(1.05); }
.logo-word { font-size: 23px; font-weight: 800; letter-spacing: -.03em; color: var(--side-ink); }
.logo-word b { color: var(--mint); font-weight: 800; }
.nav { display: grid; gap: 2px; }
.nav-group { margin: 16px 12px 6px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--side-muted); }
.nav a, .nav button { position: relative; display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 11px; color: var(--side-muted); text-decoration: none; font-weight: 550; font-size: 14.5px; width: 100%; text-align: left; transition: background-color .15s, color .15s; }
.nav a .i { transition: transform .3s var(--ease); }
.nav a:hover { background: rgba(255, 255, 255, .06); color: var(--side-ink); }
.nav a:hover .i { transform: translateX(2px) rotate(-6deg); }
.nav a[aria-current="page"] { background: rgba(43, 196, 138, .16); color: #fff; font-weight: 650; }
.nav a[aria-current="page"]::before { content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 4px; border-radius: 0 4px 4px 0; background: var(--mint); box-shadow: 0 0 12px var(--mint); }
.nav a[aria-current="page"] .i { color: var(--mint); }
.nav .count { margin-left: auto; min-width: 22px; padding: 0 7px; text-align: center; font-size: 12px; font-weight: 700; line-height: 20px; border-radius: 10px; background: var(--mint); color: #06392b; }
.nav .mob, .nav .fab-slot, .m-only { display: none; }
.rail-foot { margin-top: auto; padding: 16px 12px 2px; font-size: 12.5px; color: var(--side-muted); }

.main { min-width: 0; padding: 0 clamp(16px, 3.2vw, 44px) 64px; }
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: calc(14px + env(safe-area-inset-top)) 0 12px; margin: 0 calc(-1 * clamp(16px, 3.2vw, 44px)); padding-left: clamp(16px, 3.2vw, 44px); padding-right: clamp(16px, 3.2vw, 44px); background: color-mix(in srgb, var(--bg) 78%, transparent); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); border-bottom: 1px solid transparent; }
.m-brand { display: none; text-decoration: none; }
.search-btn { flex: 1; min-width: 0; max-width: 480px; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--muted); text-align: left; box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s; }
.search-btn:hover { border-color: var(--accent-2); box-shadow: var(--shadow); }
.search-btn .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
kbd { font: 600 11.5px/1 var(--font); padding: 3px 6px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
.top-actions { margin-left: auto; display: flex; gap: 8px; }
.page { max-width: 1200px; padding-top: 10px; }
.page.enter > * { animation: fadeUp .45s var(--ease) both; }
.page.enter > *:nth-child(2) { animation-delay: .04s; } .page.enter > *:nth-child(3) { animation-delay: .08s; }
.page.enter > *:nth-child(4) { animation-delay: .12s; } .page.enter > *:nth-child(5) { animation-delay: .16s; } .page.enter > *:nth-child(n+6) { animation-delay: .2s; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin: 10px 0 24px; }
.page-head > div:first-child { min-width: 0; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec-head > * { min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); gap: 22px; align-items: start; }
.stack { display: grid; gap: 10px; }
.stack > * { min-width: 0; }
.panel { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow-sm); transition: box-shadow .25s var(--ease), transform .25s var(--ease), border-color .25s; }
.panel:hover { box-shadow: var(--shadow); border-color: var(--line-strong); }
.panel-pad { padding: 20px; }
.notice { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 14px 18px; margin-bottom: 18px; border-radius: var(--r); background: linear-gradient(100deg, var(--accent-soft), var(--mint-soft)); border: 1px solid color-mix(in srgb, var(--mint) 30%, transparent); }
.notice.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--coral) 30%, transparent); }

/* ---------- Kennzahlen ---------- */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 24px; }
.tile-stat { position: relative; overflow: hidden; display: block; padding: 18px 18px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); text-decoration: none; transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s; }
.tile-stat:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--mint) 55%, var(--line)); }
.tile-stat .ic { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; background: var(--accent-soft); color: var(--accent-2); margin-bottom: 12px; transition: transform .35s var(--ease); }
.tile-stat:hover .ic { transform: rotate(-8deg) scale(1.08); }
.tile-stat .val { font-size: 26px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile-stat .lab { font-size: 13px; color: var(--muted); margin-top: 3px; }
.tile-stat.hero { background: linear-gradient(135deg, var(--side-2), var(--side)); color: var(--side-ink); border-color: transparent; }
.tile-stat.hero .ic { background: rgba(43, 196, 138, .18); color: var(--mint); }
.tile-stat.hero .lab { color: var(--side-muted); }
.tile-stat.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, rgba(43, 196, 138, .35), transparent 70%); }
.plus { color: var(--green); } .minus { color: var(--red); }
.tile-stat.hero .plus { color: var(--mint); } .tile-stat.hero .minus { color: #ff9f8f; }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--mint); margin-right: 6px; box-shadow: 0 0 0 0 color-mix(in srgb, var(--mint) 60%, transparent); animation: ping 1.8s infinite; vertical-align: middle; }

/* ---------- Fortschritt, Chips ---------- */
.bar { height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; }
.bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--mint)); border-radius: 4px; animation: grow .8s var(--ease) both; transform-origin: left; }
.bar.complete > span { background: var(--green); }
.tile { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 12px; background: var(--accent-soft); color: var(--accent-2); }
.tile.sm { width: 28px; height: 28px; border-radius: 8px; }
.tile .emo { font-size: 18px; line-height: 1; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 23px; padding: 0 9px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); font-size: 12.5px; font-weight: 550; white-space: nowrap; }
.chip.optional { border-style: dashed; }
.chip.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent-2); }
.chip.ok { background: var(--mint-soft); border-color: transparent; color: var(--mint-ink); }
.chip.imp { background: var(--red-soft); border-color: transparent; color: var(--red); }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.state { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; color: var(--muted); }
.state.done { color: var(--green); }
.state.run { color: var(--accent-2); }

/* ---------- Tabellen, Zeilen, Reiter ---------- */
.table { width: 100%; border-collapse: collapse; background: var(--surface); }
.table th, .table td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table th { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr { transition: background-color .15s; }
.table tbody tr:hover td { background: var(--accent-soft); }
.table a { text-decoration: none; font-weight: 600; }
.table a:hover { color: var(--accent-2); }
.table .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.table-wrap { border: 1px solid var(--line); border-radius: var(--r); overflow: auto; box-shadow: var(--shadow-sm); }
.group-title { margin: 26px 0 10px; display: flex; gap: 10px; align-items: baseline; }
.group-title:first-child { margin-top: 0; }
.row { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; }
.row:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--line-strong); }
.row .grow { flex: 1; min-width: 0; }
.row .sub { font-size: 13.5px; color: var(--muted); }
.row a.cover { text-decoration: none; font-weight: 600; }
.row a.cover::after { content: ""; position: absolute; inset: 0; }
.item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .grow { flex: 1; min-width: 0; }
.item .sub { font-size: 13px; color: var(--muted); }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13.5px; min-width: 92px; font-weight: 550; }
.tabs { display: inline-flex; max-width: 100%; overflow-x: auto; scrollbar-width: none; padding: 4px; gap: 2px; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tabs a, .tabs button { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 14px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); text-decoration: none; transition: color .15s, background-color .2s; }
.tabs a:hover, .tabs button:hover { color: var(--ink); }
.tabs a[aria-current="page"], .tabs button[aria-pressed="true"] { background: var(--surface); color: var(--accent-2); box-shadow: var(--shadow-sm); }
.tabs .n { font-size: 12px; color: var(--muted); }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.toolbar .grow { flex: 1; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.lcard { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow-sm); transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s; }
.lcard:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--mint) 50%, var(--line)); }
.lcard .head { display: flex; gap: 12px; align-items: flex-start; }
.lcard .head > div { min-width: 0; }
.lcard h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lcard h3 a { text-decoration: none; }
.lcard h3 a::after { content: ""; position: absolute; inset: 0; }
.lcard p { color: var(--muted); font-size: 13.5px; }
.lcard .meta { display: flex; justify-content: space-between; gap: 10px; }
.lcard .foot { display: flex; align-items: center; gap: 8px; margin-top: auto; position: relative; z-index: 1; }
.lcard .foot .grow { flex: 1; }
.fav-on { color: var(--coral); }
.empty { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 10px; text-align: center; padding: 44px 20px; border: 1.5px dashed var(--line-strong); border-radius: var(--r); background: color-mix(in srgb, var(--surface) 60%, transparent); }
.empty > * { max-width: 100%; }
.empty .tile { background: var(--accent-soft); color: var(--accent-2); }
.empty p { color: var(--muted); max-width: min(46ch, 100%); overflow-wrap: anywhere; }
.empty.tight { padding: 26px 16px; }

/* ---------- Hub-Kacheln (Arbeit) ---------- */
.hub { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.hub a { position: relative; display: grid; gap: 6px; padding: 18px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); text-decoration: none; transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s; }
.hub a:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--mint) 55%, var(--line)); }
.hub a .ic { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--accent-soft); color: var(--accent-2); margin-bottom: 4px; transition: transform .35s var(--ease); }
.hub a:hover .ic { transform: rotate(-8deg) scale(1.08); }
.hub a strong { font-size: 16px; }
.hub a span { font-size: 13.5px; color: var(--muted); }
.hub a .arrow { position: absolute; right: 16px; top: 18px; color: var(--muted); transition: transform .25s var(--ease), color .2s; }
.hub a:hover .arrow { transform: translateX(4px); color: var(--mint); }

/* ---------- Checkliste ---------- */
.crumb { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-weight: 600; margin: 8px 0 10px; }
.crumb:hover { color: var(--ink); }
.list-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.list-head .who { display: flex; gap: 14px; align-items: center; min-width: 0; }
.list-head .chips { margin-top: 8px; }
.progress-band { display: flex; gap: 14px; align-items: center; margin: 18px 0 4px; flex-wrap: wrap; }
.progress-band .bar { flex: 1; min-width: 140px; max-width: 420px; }
.progress-band strong { font-variant-numeric: tabular-nums; }
.tpl-note { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; padding: 14px 16px; margin-top: 16px; border-radius: var(--r-sm); background: var(--accent-soft); }
.detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 22px; align-items: start; margin-top: 18px; }
.side { position: sticky; top: 84px; }
.side .block + .block { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
.side .num { font-size: 26px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.side .num small { font-size: .6em; color: var(--muted); font-weight: 500; }
.side .cap { color: var(--muted); font-size: 13.5px; }
.side-list { display: grid; gap: 1px; margin: 0 -8px; }
.side-list button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 38px; padding: 0 10px; border-radius: 9px; text-align: left; color: var(--ink-2); transition: background-color .15s, padding-left .2s var(--ease); }
.side-list button:hover { background: var(--surface-2); color: var(--ink); padding-left: 14px; }
.side-list button.danger { color: var(--red); }
.quick-add { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; }
.filters { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0 2px; }
.fchips { display: flex; gap: 5px; flex-wrap: wrap; }
.fchip { display: inline-flex; align-items: center; gap: 6px; min-height: 31px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 16px; font-size: 13.5px; font-weight: 550; color: var(--ink-2); transition: background-color .15s, border-color .15s; }
.fchip:hover { border-color: var(--accent-2); }
.fchip .n { color: var(--muted); font-size: 12px; }
.fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.fchip[aria-pressed="true"] .n { color: inherit; opacity: .8; }
.filter-tools { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-tools .input { min-height: 34px; padding: 4px 10px; width: 170px; }
.filter-tools .select { min-height: 34px; padding: 4px 8px; width: auto; }
.tasks { display: grid; gap: 8px; margin-top: 12px; }
.task { position: relative; padding: 12px 12px 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s, opacity .3s; }
.task:hover { border-color: var(--line-strong); box-shadow: var(--shadow-sm); transform: translateX(2px); }
.task.done { background: var(--surface-2); }
.task.flash { animation: flash 1.2s var(--ease); }
.task.dragging { opacity: .4; }
.task.drop-before { box-shadow: 0 -3px 0 0 var(--mint); }
.task.drop-after { box-shadow: 0 3px 0 0 var(--mint); }
.task-row { display: flex; gap: 10px; align-items: flex-start; }
.grip { display: grid; place-items: center; width: 18px; height: 24px; margin-left: -4px; color: var(--line-strong); cursor: grab; touch-action: none; }
.task-body { flex: 1; min-width: 0; padding-top: 1px; }
.task-line { display: flex; gap: 6px; align-items: flex-start; }
.title { font-weight: 550; overflow-wrap: anywhere; }
.task.done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--mint); text-decoration-thickness: 2px; }
.task.skipped .title { color: var(--muted); font-style: italic; }
.task-title-btn { display: inline-flex; gap: 4px; align-items: flex-start; text-align: left; }
.task-title-btn .chev { margin-top: 3px; color: var(--muted); transition: transform .2s var(--ease); }
.task-title-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.task .chips { margin-top: 6px; }
.details { display: grid; gap: 6px; margin: 8px 0 2px; }
.detail { display: flex; gap: 8px; padding: 9px 12px; border-radius: 10px; font-size: 14px; color: var(--ink-2); background: var(--surface-2); max-width: 66ch; }
.detail .i { margin-top: 2px; }
.detail span { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.check { flex: none; width: 23px; height: 23px; margin-top: 1px; display: grid; place-items: center; border: 1.8px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: #fff; transition: background-color .2s, border-color .2s, transform .2s var(--ease); }
.check:hover { border-color: var(--mint); transform: scale(1.08); }
.check svg { width: 14px; height: 14px; }
.check path { fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s var(--ease) .05s; }
.check[aria-checked="true"] { background: var(--mint); border-color: var(--mint); }
.check[aria-checked="true"] path { stroke-dashoffset: 0; }
.stepno { flex: none; width: 23px; height: 23px; display: grid; place-items: center; border-radius: 7px; background: var(--surface-2); font-size: 12.5px; font-weight: 700; color: var(--muted); }
.prio { flex: none; margin-top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); }
.prio.high { background: var(--coral); }
.tact { display: flex; gap: 1px; opacity: 0; margin: -3px 0 0 auto; flex: none; transition: opacity .15s; }
.task:hover .tact, .task:focus-within .tact { opacity: 1; }
@media (hover: none) { .tact { opacity: 1; } }

/* ---------- Kalender ---------- */
.cal-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.cal-head h2 { font-size: 19px; }
.cal-head .spacer { flex: 1; }
.month { display: grid; grid-template-columns: 42px repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--line); gap: 1px; box-shadow: var(--shadow-sm); }
.month .wd { background: var(--surface-2); padding: 8px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.month .kw { background: var(--surface-2); padding: 10px 4px; font-size: 11.5px; color: var(--muted); text-align: center; font-weight: 600; }
.day { background: var(--surface); min-height: 108px; padding: 6px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; transition: background-color .15s; }
.day:hover { background: var(--accent-soft); }
.day.other { background: var(--surface-2); color: var(--muted); }
.day.ferien { box-shadow: inset 0 3px 0 color-mix(in srgb, var(--coral) 45%, transparent); }
.day .dn { font-size: 13px; font-weight: 600; width: 27px; height: 27px; display: grid; place-items: center; border-radius: 50%; transition: background-color .15s, transform .2s var(--ease); }
.day .dn:hover { background: var(--surface-2); transform: scale(1.1); }
.day.today .dn { background: var(--accent); color: var(--accent-ink); }
.day.hol .dn { color: var(--red); }
.ev { display: block; width: 100%; font-size: 12px; font-weight: 550; line-height: 1.3; padding: 3px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; transition: transform .15s var(--ease), filter .15s; }
.ev:hover { transform: translateX(2px); filter: brightness(.97); }
.ev.schule { background: var(--surface-2); color: var(--ink-2); box-shadow: inset 3px 0 0 var(--accent-2); }
.ev.klausur { background: var(--red-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--red); font-weight: 600; }
.chip.warn { background: var(--red-soft); border-color: transparent; color: var(--red); }
.ev.feiertag { background: var(--red-soft); color: var(--red); }
.ev.ferien { background: var(--warn-soft); color: var(--muted); }
.ev.task { background: transparent; color: var(--ink-2); border: 1px dashed var(--line-strong); }
.ev.order { background: transparent; color: var(--ink-2); border: 1px dashed var(--accent-2); }
.ev.work { background: transparent; color: var(--mint-ink); font-size: 11px; padding: 0 6px; }
.ev.done { text-decoration: line-through; opacity: .7; }
.more { font-size: 11.5px; color: var(--muted); padding-left: 5px; text-align: left; }
.weekgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.wcol { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); min-height: 230px; padding: 10px; display: flex; flex-direction: column; gap: 5px; min-width: 0; transition: box-shadow .2s var(--ease), border-color .2s; }
.wcol:hover { box-shadow: var(--shadow); }
.wcol.today { border-color: var(--mint); box-shadow: 0 0 0 3px var(--mint-soft); }
.wcol h3 { font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; }
.wcol .ev { white-space: normal; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }

/* ---------- Assistent ---------- */
.chat { display: flex; flex-direction: column; height: calc(100dvh - 230px); min-height: 420px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow-sm); overflow: hidden; }
.chat-log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: min(580px, 88%); padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; animation: pop .3s var(--ease) both; }
.msg.bot { background: var(--surface-2); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 5px; }
.msg.me { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 5px; }
.msg-btns { display: flex; gap: 6px; flex-wrap: wrap; align-self: flex-start; max-width: 100%; animation: fadeUp .35s var(--ease) both; }
.msg-btns .btn { white-space: normal; text-align: left; min-height: 34px; padding: 6px 12px; border-radius: 18px; }
.chat-in { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: var(--surface); }

/* ---------- Zeiterfassung ---------- */
.stamp-card .now { font-size: 38px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stamp-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.stamp-btns .btn { min-height: 46px; padding: 0 20px; font-size: 15.5px; border-radius: 13px; }
.stamp-card.running { border-color: color-mix(in srgb, var(--mint) 55%, var(--line)); box-shadow: 0 0 0 4px var(--mint-soft), var(--shadow-sm); }
.saldo { font-size: 38px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.weekbars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; align-items: end; height: 96px; margin-top: 8px; }
.weekbars div { display: grid; grid-template-rows: 1fr auto; gap: 4px; height: 100%; text-align: center; font-size: 11.5px; color: var(--muted); }
.weekbars .b { position: relative; align-self: end; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, var(--mint), var(--accent-2)); animation: rise .8s var(--ease) both; transform-origin: bottom; }
.weekbars .b.low { background: linear-gradient(180deg, #ffb28f, var(--coral)); }
.weekbars .goal { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--line-strong); }
.mini { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; }
.mini .wd { font-size: 11.5px; font-weight: 700; color: var(--muted); padding: 2px 0; text-transform: uppercase; }
.mini button { min-height: 46px; border-radius: 10px; display: grid; align-content: center; gap: 1px; font-size: 13px; border: 1px solid transparent; transition: background-color .15s, transform .15s var(--ease), border-color .15s; }
.mini button:hover { background: var(--accent-soft); transform: translateY(-1px); }
.mini button.other { color: var(--muted); opacity: .55; }
.mini button.sel { border-color: var(--mint); background: var(--mint-soft); }
.mini button.today .n { font-weight: 800; color: var(--accent-2); }
.mini button .m { font-size: 10.5px; line-height: 1; min-height: 11px; font-weight: 600; }

/* ---------- Schule ---------- */
.tt { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.lesson { display: grid; grid-template-columns: 100px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.lesson:last-child { border-bottom: 0; }
.lesson .sub { font-size: 13px; color: var(--muted); }
.lesson.pause { color: var(--muted); font-size: 13px; padding: 5px 0; }
.lesson.now { background: var(--mint-soft); margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 10px; }
.hw { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.hw:last-child { border-bottom: 0; }
.hw .grow { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.hw.done .grow { color: var(--muted); text-decoration: line-through; }
.hw .sub { font-size: 13px; color: var(--muted); text-decoration: none; }

/* ---------- Berichtsheft ---------- */
.week-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.week-nav .select { min-width: 0; max-width: 100%; }
.edit-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.edit-grid > * { min-width: 0; }
.sheet-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: #e6ecea; padding: 16px; }
:root[data-theme="dark"] .sheet-wrap { background: #081110; }
.sheet-wrap .ihk { margin: 0 auto; box-shadow: 0 6px 24px rgba(0, 0, 0, .18); zoom: .62; }
.days { display: grid; gap: 6px; }
.dayrow { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.dayrow:last-child { border-bottom: 0; }
.dayrow .d { font-weight: 600; }
.dayrow .sub { font-size: 13px; color: var(--muted); }
.log { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.log .grow { flex: 1; min-width: 0; }

/* IHK-Ausbildungsnachweis (A4, nach Vorlage) */
.ihk { width: 210mm; min-height: 297mm; padding: 17mm 22.5mm 10mm 24mm; background: #fff; color: #000; font: 10pt/1.25 Arial, Helvetica, sans-serif; }
.ihk table { width: 175mm; border-collapse: collapse; table-layout: fixed; border: 1.5pt solid #000; }
.ihk td { vertical-align: top; padding: 1mm 1.9mm; border: 0; }
.ihk .b { font-weight: 700; }
.ihk .s8 { font-size: 8pt; } .ihk .s9 { font-size: 9pt; }
.ihk .rl { border-right: .75pt solid #000; }
.ihk .bl { border-bottom: .75pt solid #000; }
.ihk .tl { border-top: .75pt solid #000; }
.ihk .hrs { text-align: center; }
.ihk .sig { padding-top: 6mm; }
.ihk.gen { padding-top: 12mm; }
.day-edit { display: grid; grid-template-columns: minmax(0, 1fr) 80px; gap: 10px; align-items: start; }
.lf-row { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 8px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.lf-row textarea { grid-column: 1 / -1; }
.calc-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 80px; gap: 8px; }
fieldset.quiz-q { border: 0; border-top: 1px solid var(--line); padding: 12px 0; margin: 0; }
fieldset.quiz-q legend { padding: 0; margin-bottom: 6px; float: left; width: 100%; }
.quiz-a { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 6px; cursor: pointer; clear: both; }
.quiz-a.ok { background: var(--green-soft, rgba(30,160,90,.12)); }
.quiz-a.bad { background: var(--red-soft); }
@media (max-width: 560px) { .lf-row { grid-template-columns: 1fr; } .calc-row { grid-template-columns: 1fr 1fr; } .calc-row > :first-child { grid-column: 1 / -1; } }
.field.warn-note, .warn-note { display: flex; flex-direction: row; gap: 8px; align-items: flex-start; background: var(--red-soft); color: var(--ink, inherit); padding: 8px 10px; border-radius: 8px; font-size: .92em; }
.rp-row { gap: 10px; align-items: center; cursor: pointer; }
.rp-row input { width: 18px; height: 18px; flex: none; }
details.dictate { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
details.dictate summary { cursor: pointer; display: flex; gap: 8px; align-items: center; font-weight: 600; }
.ihk .gen-title { width: 175mm; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3mm; }

/* ---------- Einstellungen, Formulare ---------- */
.settings { display: grid; gap: 14px; max-width: 840px; }
.setting { padding: 20px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow-sm); }
.setting h3 { margin-bottom: 4px; font-size: 16.5px; }
.setting > p { color: var(--muted); font-size: 14px; margin-bottom: 12px; max-width: 64ch; }
.toggle-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 10px 0; }
.toggle-row + .toggle-row { border-top: 1px solid var(--line); }
.toggle-row .sub { color: var(--muted); font-size: 13.5px; }
.switch { position: relative; flex: none; width: 44px; height: 26px; }
.switch input { appearance: none; -webkit-appearance: none; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; border-radius: 13px; background: var(--line-strong); cursor: pointer; transition: background-color .2s; }
.switch input::before { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.switch input:checked { background: var(--mint); }
.switch input:checked::before { transform: translateX(18px); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.data-facts { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 14px; }
.data-facts div { display: grid; }
.data-facts strong { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.data-facts span { color: var(--muted); font-size: 13px; }
.shortcut-list div { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.shortcut-list div:last-child { border-bottom: 0; }
.shortcut-list dd { display: flex; gap: 5px; }
.input, .select, .textarea { width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 11px; background: var(--surface); color: var(--ink); transition: border-color .15s, box-shadow .15s; }
.textarea { resize: vertical; min-height: 86px; line-height: 1.5; }
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.input:hover, .select:hover, .textarea:hover { border-color: var(--accent-2); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--mint); box-shadow: 0 0 0 4px var(--mint-soft); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form.three { grid-template-columns: 1fr 1fr 1fr; }
.field { display: grid; gap: 6px; align-content: start; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field > label, .field > .lab, legend.lab { font-weight: 600; font-size: 13.5px; color: var(--ink-2); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend.lab { padding: 0; margin-bottom: 6px; }
.opts { display: inline-flex; padding: 4px; gap: 2px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); flex-wrap: wrap; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span { display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; border-radius: 8px; font-weight: 600; font-size: 13.5px; color: var(--muted); transition: background-color .15s, color .15s; }
.opt input:checked + span { background: var(--surface); color: var(--accent-2); box-shadow: var(--shadow-sm); }
.opt input:focus-visible + span { outline: 2px solid var(--focus); }
.picker { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.pick { position: relative; }
.pick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.pick span { display: grid; place-items: center; height: 44px; border: 1px solid var(--line); border-radius: 11px; color: var(--ink-2); transition: border-color .15s, transform .15s var(--ease); }
.pick:hover span { transform: translateY(-1px); border-color: var(--accent-2); }
.pick input:checked + span { border-color: var(--mint); background: var(--mint-soft); color: var(--accent-2); }
.pick input:focus-visible + span { outline: 2px solid var(--focus); }
.err { color: var(--red); }
.input[aria-invalid="true"] { border-color: var(--red); }

.scrim { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(6, 20, 18, .45); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fade .2s ease both; }
.scrim.top { place-items: start center; padding-top: min(12vh, 100px); }
.dialog { width: min(620px, 100%); max-height: min(92vh, 900px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-lg); animation: pop .3s var(--ease) both; }
.dialog.narrow { width: min(440px, 100%); }
.dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 14px 14px 22px; border-bottom: 1px solid var(--line); }
.dialog-head h2 { font-size: 18px; }
.dialog-body { padding: 20px 22px; overflow: auto; }
.dialog-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding: 14px 22px; border-top: 1px solid var(--line); }
.sheet-menu { display: grid; gap: 2px; }
.sheet-menu a, .sheet-menu button { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-weight: 600; width: 100%; text-align: left; transition: background-color .15s, padding-left .2s var(--ease); }
.sheet-menu a:hover, .sheet-menu button:hover { background: var(--accent-soft); padding-left: 16px; }
.sheet-menu .nav-group { margin: 12px 12px 4px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.palette { width: min(640px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow-lg); overflow: hidden; animation: pop .25s var(--ease) both; }
.pal-search { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); color: var(--muted); }

function renderToday() {
  const k = todayKey(), dd = state.days[k];
  const withOpen = sortLists(runs()).filter(l => l.tasks.some(t => !t.completed && !t.skipped));
  const groups = withOpen.map(l => {
    const open = l.tasks.filter(t => !t.completed && !t.skipped);
    const ordered = [...open.filter(t => t.type === "required"), ...open.filter(t => t.type === "optional")];
    return `
      <section class="group" style="margin-top:20px" aria-labelledby="g-${l.id}">
        <div class="sec-head"><h2 id="g-${l.id}"><a href="#/list/${l.id}" style="text-decoration:none">${esc(l.title)}</a> <span class="hint-text">${plural(open.length, "Aufgabe", "Aufgaben")} offen</span></h2>
        <button type="button" class="btn small" data-act="focus" data-list="${l.id}">${icon("play", 13)} Arbeitsmodus</button></div>
        <ul class="tasks">${ordered.map(t => renderTask(t, l, { compact: true })).join("")}</ul>
      </section>`;
  }).join("");
  const evs = eventsOn(k);
  return `
    <div class="page-head"><div><p class="eyebrow">Arbeit · Heute</p><h1>Was heute <span class="hl">zählt.</span></h1><p class="lede">${fmtLong(k)}</p></div>
      <div class="head-actions"><button type="button" class="btn" data-act="day" data-date="${k}">${icon("book", 16)} Einträge fürs Berichtsheft</button></div></div>
    <div class="cols">
      <div>${groups || emptyState({ ic: "check", title: "Keine offenen Aufgaben", text: "Starte eine Vorlage oder lege über den Assistenten einen Auftrag an.", actions: `<a class="btn" href="#/templates">Vorlagen</a><a class="btn primary" href="#/assistant">Assistent</a>` })}</div>
      <aside class="panel panel-pad">
        <div class="sec-head"><h2>Termine</h2><button type="button" class="btn small" data-act="new-event" data-date="${k}">${icon("plus", 14)} Termin</button></div>
        ${evs.length ? evs.map(e => evLine(e, k)).join("") : `<p class="hint-text">Keine Termine.</p>`}
        <div style="margin-top:18px">${timeCard(true)}</div>
      </aside>
    </div>`;
}

function renderCard(list) {
  const s = stats(list);
  const meta = list.template ? `${s.reqTotal} Pflicht, ${s.optTotal} optional` : isDone(list) ? "Alle Pflichtaufgaben erledigt" : `${s.reqDone} von ${s.reqTotal} Pflichtaufgaben`;
  const primary = list.archived
    ? `<button type="button" class="btn small" data-act="archive" data-list="${list.id}">${icon("undo", 14)} Wiederherstellen</button>`
    : list.template
      ? `<button type="button" class="btn small" data-act="start-template" data-list="${list.id}">${icon("play", 13)} Starten</button>`
      : `<button type="button" class="btn small" data-act="focus" data-list="${list.id}">${icon("play", 13)} Arbeitsmodus</button>`;
  return `
    <article class="lcard">
      <div class="head">${tile(list)}<div><h3><a href="#/list/${list.id}">${esc(list.title)}</a></h3><p>${esc(list.description || "Keine Beschreibung")}</p></div></div>
      <div class="meta">${stateLabel(list)}<span class="hint-text">${meta}</span></div>
      ${list.template ? "" : bar(s.percent, isDone(list))}
      <div class="foot">${primary}<span class="grow"></span>
        <button type="button" class="btn small icon quiet ${list.favorite ? "fav-on" : ""}" data-act="fav" data-list="${list.id}" aria-pressed="${list.favorite}" aria-label="Favorit: ${esc(list.title)}" title="Favorit">${icon("star", 17, list.favorite ? "filled" : "")}</button>
      </div>
    </article>`;
}
function renderLists(route) {
  const tab = route.tab, active = runs();
  const fav = state.checklists.filter(c => !c.archived && c.favorite), arch = state.checklists.filter(c => c.archived);
  const shown = sortLists(tab === "favorites" ? fav : tab === "archive" ? arch : active);
  const tabs = [["active", "#/lists", "Aktiv", active.length], ["favorites", "#/lists/favorites", "Favoriten", fav.length], ["archive", "#/lists/archive", "Archiv", arch.length]];
  const empties = {
    active: { title: "Noch keine Checkliste", text: "Starte eine Vorlage oder lege eine neue Checkliste an.", actions: `<a class="btn" href="#/templates">Vorlagen</a><button type="button" class="btn primary" data-act="new-list">${icon("plus", 16)} Neue Checkliste</button>` },
    favorites: { ic: "star", title: "Keine Favoriten", text: "Markiere Checklisten mit dem Stern, dann liegen sie hier griffbereit." },

  };
  return `
    <div class="page-head"><div><p class="eyebrow">Arbeit · Checklisten</p><h1>Abhaken statt <span class="hl">nachdenken.</span></h1><p class="lede">Alles, was du gerade abarbeitest.</p></div>
      <div class="head-actions"><button type="button" class="btn primary" data-act="new-list">${icon("plus", 16)} Neue Checkliste</button></div></div>
    <div class="toolbar">
      <nav class="tabs" aria-label="Ansicht">${tabs.map(([id, href, label, n]) => `<a href="${href}" ${tab === id ? 'aria-current="page"' : ""}>${label} <span class="n">${n}</span></a>`).join("")}</nav>
      <select class="select" id="listSort" aria-label="Sortierung" style="width:auto">${[["updated", "Zuletzt geändert"], ["alpha", "Alphabetisch"], ["favorite", "Favoriten zuerst"], ["progress", "Fortschritt"]].map(([v, l]) => `<option value="${v}" ${state.settings.sort === v ? "selected" : ""}>${l}</option>`).join("")}</select>
    </div>
    ${shown.length ? `<div class="grid">${shown.map(renderCard).join("")}</div>` : emptyState(empties[tab])}`;
}
function renderTemplates() {

    <div class="page-head"><div><p class="eyebrow">Arbeit · Vorlagen</p><h1>Einmal anlegen. <span class="hl">Immer starten.</span></h1><p class="lede">Wiederkehrende Abläufe mit einem Klick starten.</p></div>

const canReorder = () => ui.filter === "all" && ui.sort === "manual" && !ui.q.trim();
function visibleTasks(list) {
  let t = list.tasks;
  const q = norm(ui.q.trim());
  if (q) t = t.filter(x => norm(`${x.title} ${x.note} ${x.hint} ${x.category}`).includes(q));
  if (ui.filter === "required") t = t.filter(x => x.type === "required");
  if (ui.filter === "optional") t = t.filter(x => x.type === "optional");
  if (ui.filter === "open") t = t.filter(x => !x.completed && !x.skipped);
  if (ui.filter === "done") t = t.filter(x => x.completed);
  return sortTasks(t, ui.sort);
}
function filterCounts(list) {
  const t = list.tasks;
  return { all: t.length, required: t.filter(x => x.type === "required").length, optional: t.filter(x => x.type === "optional").length, open: t.filter(x => !x.completed && !x.skipped).length, done: t.filter(x => x.completed).length };
}
function renderTask(t, list, o = {}) {
  const has = !!(t.note || t.hint), open = has && ui.expanded.has(t.id);
  const cls = ["task", t.completed && "done", t.skipped && "skipped", ui.flash === t.id && "flash"].filter(Boolean).join(" ");
  const full = !o.compact, reorder = full && canReorder();
  const lead = list.template
    ? `<span class="stepno" aria-hidden="true">${list.tasks.indexOf(t) + 1}</span>`
    : `<button type="button" class="check" role="checkbox" aria-checked="${t.completed}" aria-label="${esc(t.title)}" data-act="toggle" data-list="${list.id}" data-task="${t.id}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19.5 7"/></svg></button>`;
  const titleInner = `<span class="title">${esc(t.title)}</span>`;
  const title = has ? `<button type="button" class="task-title-btn" data-act="expand" data-task="${t.id}" aria-expanded="${open}">${titleInner}${icon("chev", 15, "chev")}</button>` : titleInner;
  const p = getProp(t.propId);
  const chips = [
    t.type === "optional" ? `<span class="chip optional">Optional</span>` : "",
    t.skipped ? `<span class="chip">Übersprungen</span>` : "",
    t.due ? `<span class="chip ${!t.completed && t.due < todayKey() ? "imp" : ""}">${icon("cal", 12)} ${fmtD(t.due)}</span>` : "",
    p ? `<a class="chip accent" href="#/prop/${p.id}" style="text-decoration:none">${esc(propLabel(p))}</a>` : "",
    t.category ? `<span class="chip">${esc(t.category)}</span>` : "",
    !t.report ? `<span class="chip" title="Nicht fürs Berichtsheft">${icon("book", 12)} aus</span>` : "",
    !open && t.hint ? `<span class="chip">${icon("bulb", 12)} Hinweis</span>` : "",
    !open && t.note ? `<span class="chip">${icon("note", 12)} Notiz</span>` : ""
  ].join("");
  const details = open ? `<div class="details">${t.hint ? `<div class="detail">${icon("bulb", 16)}<span>${esc(t.hint)}</span></div>` : ""}${t.note ? `<div class="detail">${icon("note", 16)}<span>${esc(t.note)}</span></div>` : ""}</div>` : "";
  const btn = (act, label, ic, extra = "", disabled = false) => `<button type="button" class="btn small icon quiet ${extra}" data-act="${act}" data-list="${list.id}" data-task="${t.id}" aria-label="${label}: ${esc(t.title)}" title="${label}" ${disabled ? "disabled" : ""}>${icon(ic, 16)}</button>`;
  const tact = full ? `<div class="tact">${btn("edit", "Bearbeiten", "edit")}${t.type === "optional" && !t.completed && !list.template ? btn("skip", t.skipped ? "Wieder öffnen" : "Überspringen", t.skipped ? "undo" : "skip") : ""}${reorder ? btn("up", "Nach oben", "up", "", o.index === 0) + btn("down", "Nach unten", "down", "", o.index === o.count - 1) : ""}${btn("delete", "Löschen", "trash", "danger")}</div>` : "";
  return `
    <li class="${cls}" id="task-${t.id}" data-tid="${t.id}">
      <div class="task-row">
        ${reorder ? `<span class="grip" title="Ziehen zum Sortieren" aria-hidden="true">${icon("grip", 16)}</span>` : ""}
        ${lead}
        <div class="task-body"><div class="task-line">${prioSign(t.priority)}${title}</div>${chips ? `<div class="chips">${chips}</div>` : ""}${details}</div>
        ${tact}
      </div>
    </li>`;
}
function renderTaskItems(list) {
  const items = visibleTasks(list);
  if (!list.tasks.length) return emptyState({ tight: true, title: "Noch keine Aufgaben", text: "Schreibe oben den ersten Arbeitsschritt auf und drücke Enter." });
  if (!items.length) return emptyState({ ic: "search", tight: true, title: "Keine Treffer", text: "Mit diesem Filter ist nichts zu sehen.", actions: `<button type="button" class="btn" data-act="filter-reset">Filter zurücksetzen</button>` });
  return `<ul class="tasks" id="taskList">${items.map((t, i) => renderTask(t, list, { index: i, count: items.length })).join("")}</ul>`;
}

function propGroups(list) {

  const nrs = [...new Set(firms.map(p => p.firmaNr))].sort((a, b) => (FIRM_ORDER.indexOf(a) + 1 || 99) - (FIRM_ORDER.indexOf(b) + 1 || 99) || a.localeCompare(b, "de", { numeric: true }));
  const groups = nrs.map(nr => { const items = firms.filter(p => p.firmaNr === nr); return { title: `Firma ${nr} – ${items[0].firma}`, items }; });
  const proj = list.filter(p => p.kategorie === "Projekte");
  if (proj.length) groups.push({ title: `Projekte – ${proj[0].firma}`, items: proj });
  groups.forEach(g => g.items.sort((a, b) => a.ve.localeCompare(b.ve, "de", { numeric: true })));
  return groups;
}

const SUBJECT_WORDS = { immobilienwirtschaft: "IWi", immobilien: "IWi", iwi: "IWi", deutsch: "D", englisch: "E", english: "E", politik: "PuG", pug: "PuG", sozialkunde: "PuG", ksc: "KSC", controlling: "KSC", rechnungswesen: "KSC", buchfuhrung: "KSC", steuerung: "KSC" };
function findSubject(text) {
  const words = text.split(/[^A-Za-zÄÖÜäöüß-]+/).filter(Boolean);
  const subs = subjects();
  const direct = words.find(w => subs.some(x => x.toLowerCase() === w.toLowerCase()));
  if (direct) return subs.find(x => x.toLowerCase() === direct.toLowerCase());
  for (const w of words) { const c = SUBJECT_WORDS[norm(w)]; if (c) return c; }
  const short = words.find(w => /^(D|E)$/.test(w));
  return short || "";
}

const glossarHit = n => GLOSSAR.find(([re]) => re.test(n));

/* ---------- Datum und Uhrzeit aus Text ---------- */
const WDN = ["sonntag", "montag", "dienstag", "mittwoch", "donnerstag", "freitag", "samstag"];
function futureDate(k) { if (!k) return ""; if (/\d{1,2}\.\d{1,2}\.\d{2,4}/.test(k)) return k; return k; }
function parseWhen(text) {
  let s = ` ${text} `, date = "", date2 = "", from = "", to = "";
  const cut = re => { const m = s.match(re); if (m) s = s.replace(m[0], " "); return m; };
  const today = todayKey(), hm = (h, m) => `${pad(Math.min(23, Number(h)))}:${pad(Number(m || 0))}`;
  const dm = str => { let k = parseDate(str); if (k && k < today && !/\.\d{2,4}\s*$/.test(str.trim())) { const d = pkey(k); d.setFullYear(d.getFullYear() + 1); k = dkey(d); } return k; };
  let m;
  if ((m = cut(/\b(?:vom\s+|von\s+)?(\d{1,2}\.\d{1,2}\.(?:\d{2,4})?)\s*(?:bis|-|–)\s*(\d{1,2}\.\d{1,2}\.(?:\d{2,4})?)/i))) { date = dm(m[1]); date2 = dm(m[2]); }
  if ((m = cut(/\b(?:von\s+)?(\d{1,2})(?:[:.](\d{2}))?\s*(?:uhr\s*)?(?:bis|-|–)\s*(\d{1,2})(?:[:.](\d{2}))?\s*uhr\b/i))) { from = hm(m[1], m[2]); to = hm(m[3], m[4]); }
  else if ((m = cut(/\b(?:von\s+)?(\d{1,2}):(\d{2})\s*(?:uhr\s*)?(?:bis|-|–)\s*(\d{1,2}):(\d{2})/i))) { from = hm(m[1], m[2]); to = hm(m[3], m[4]); }
  else if ((m = cut(/\b(?:um|ab)?\s*(\d{1,2}):(\d{2})\s*(?:uhr)?/i)) || (m = cut(/\b(?:um|ab)?\s*(\d{1,2})\s*uhr\b/i))) from = hm(m[1], m[2]);
  if (!date) {
    if ((m = cut(/\b(?:am\s+|bis\s+|ab\s+)?(\d{1,2}\.\d{1,2}\.(?:\d{2,4})?)/i))) date = dm(m[1]);
    else if ((m = cut(/(?<![A-Za-zÄÖÜäöüß])(?:bis\s+)?(heute|übermorgen|uebermorgen|morgen)(?![A-Za-zÄÖÜäöüß])/i))) date = dkey(addDays(pkey(today), { heute: 0, morgen: 1 }[m[1].toLowerCase()] ?? 2));
    else if ((m = cut(/\bin\s+(\d{1,3})\s+tag(?:en)?\b/i))) date = dkey(addDays(pkey(today), Number(m[1])));
    else if ((m = cut(/(?<![A-Za-zÄÖÜäöüß])nächste[nr]?\s+woche\s+(?:am\s+)?(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)\b/i))) date = dkey(addDays(monday(pkey(today)), 7 + (WDN.indexOf(m[1].toLowerCase()) + 6) % 7));
    else if ((m = cut(/(?<![A-Za-zÄÖÜäöüß])nächste[nr]?\s+woche\b/i))) date = dkey(addDays(monday(pkey(today)), 7));
    else if ((m = cut(/\b(?:am\s+|bis\s+|ab\s+)?(nächsten|nächste|kommenden|diesen)?\s*(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)\b/i))) {

}
const dayWord = k => k === todayKey() ? "heute" : k === dkey(addDays(new Date(), 1)) ? "morgen" : `${WD[pkey(k).getDay()]}, ${fmtD(k)}`;
const clean = (t, words) => t.replace(words, " ").replace(/(^|\s)(bitte|mal|eintragen|anlegen|erstellen|starten|hinzufügen|neue[rn]?|eine[nr]?|ein|am|um)(?=\s|$)/gi, " ").replace(/^[\s:,.–-]+|[\s:,.–-]+$/g, "").replace(/\s+/g, " ").trim();
const isQuestion = (q, n) => /\?\s*$/.test(q) || /^(was|wann|welche[rsn]?|wie|wo|zeig|gibt es|habe ich|hab ich|steht|stehen|sag)\b/.test(n);

/* ---------- Aktionen ---------- */
function startAuftrag(pre) {
  const run = startFlow("auftrag", false);
  Object.entries(pre).forEach(([k, v]) => { if (v) run.data[k] = v; });
  saveState();
  return run;
}
function eventsText(k) {
  const evs = eventsOn(k).filter(e => e.kind !== "schule"), sch = eventsOn(k).some(e => e.kind === "schule"), hol = holiday(k);
  const lines = [];
  if (hol) lines.push(`Feiertag: ${hol}`);
  if (sch) lines.push(`Berufsschule${lessonsOf(k).length ? ": " + [...new Set(lessonsOf(k).map(l => l.subject))].join(", ") : ""}`);
  evs.forEach(e => lines.push(`${e.from ? e.from + (e.to ? "–" + e.to : "") : "ganztägig"} ${e.title}`));
  state.flowRuns.filter(r => !r.doneAt && r.data.frist === k).forEach(r => lines.push(`Frist: ${r.data.mangel || r.title}`));
  state.homework.filter(h => !h.done && h.due === k).forEach(h => lines.push(`Hausaufgabe ${h.subject}: ${h.text}`));

}
function setDayStatus(from, to, status) {
  const days = [];
  for (let d = pkey(from); dkey(d) <= (to || from); d = addDays(d, 1)) { const k = dkey(d); if (d.getDay() >= 1 && d.getDay() <= 5 && !holiday(k)) days.push(k); }
  days.forEach(k => { state.days[k] = { ...sanitizeDay(state.days[k]), status }; });
  return days;
}

function answer(text) {
  const q = text.trim(), n = norm(q), ask = isQuestion(q, n), when = parseWhen(q);
  if (/^(hilfe|help|was kannst|befehle|\?)/.test(n)) return say(HELP, baseBtns());
  const snap = snapshot();

  /* Fachbegriffe */
  const gl = glossarHit(n);
  if (gl && (/was (ist|sind|bedeutet|heisst)|erklar|definition|wie (lange|hoch|viel)|frist|regel/.test(n) || (q.split(/\s+/).length <= 3 && !/auftrag|defekt|kaputt|piept|termin|klausur|hausaufgabe|note|lernkarte|krank|urlaub/.test(n)))) return say(`${gl[1]}\n${gl[2]}\n\nKeine Rechtsberatung – im Zweifel beim Sachbearbeiter nachfragen.`, [{ label: "Als Lernkarte speichern", run: () => { state.cards.push({ id: uid(), subject: "IWi", front: `Was bedeutet „${gl[1]}“?`, back: gl[2], box: 1, due: todayKey(), at: Date.now() }); say("Lernkarte gespeichert (IWi).", baseBtns()); } }, ...baseBtns().slice(0, 2)]);

  /* Berichtsheft-Eintrag */
  const note = q.match(/^(eintrag|notiz|merken|berichtsheft)\s*[:\-]\s*(.+)$/i);
  if (note) { const k = when.date || todayKey(), d = state.days[k] = sanitizeDay(state.days[k]); d.entries.push({ id: uid(), text: note[2].trim().slice(0, 500) }); return say(`Fürs Berichtsheft gemerkt (${dayWord(k)}): ${note[2].trim()}`, [undoBtn(snap), openBtn("Berichtsheft", "/report")]); }

  /* Auftrag */
  if (/auftrag|mangel|defekt|kaputt|reparatur|undicht|verstopf|ausgefallen|tropf|piept|klemmt|leckt|schimmel|funktioniert nicht|geht nicht|kein warmwasser|wasserschaden|feucht/.test(n) && !ask) {
    const ve = q.match(/\b(\d{5})\b/), prop = ve ? state.properties.find(p => p.ve === ve[1]) : null;
    const name = (q.match(/\b(?:mieter(?:in)?|herr|frau)\s+([A-ZÄÖÜ][a-zäöüß-]+)/) || q.match(/\b([A-ZÄÖÜ][a-zäöüß]+)\b(?=\s+\d{5}|\s*$)/) || [])[1] || "";
    let mangel = clean(q.replace(/\b\d{5}\b/, " ").replace(name ? new RegExp(`\\b(mieter(in)?|herr|frau)?\\s*${name}\\b`, "i") : /$^/, " "), /\bauftrag(e|s)?\b|\bmängelmeldung\b|\bmangel\b/gi);
    mangel = mangel.replace(/(^|\s)(dringend|notfall|sofort|eilig)(?=\s|$)/gi, " ").replace(/\s+/g, " ").trim();
    mangel = mangel ? mangel[0].toUpperCase() + mangel.slice(1) : "";
    const pre = { mangel, gewerk: findGewerk(q), mieter: name, ...(prop ? { prop: propLabel(prop), wohnanlage: prop.name, firmaNr: ["1", "2", "11"].includes(prop.firmaNr) ? prop.firmaNr : "1" } : {}), dringend: /dringend|notfall|sofort|eilig/.test(n) };
    startAuftrag(pre);
    const run = state.flowRuns[state.flowRuns.length - 1];
    return say(`Auftrag gestartet:\n${[mangel && "Mangel: " + mangel, pre.gewerk && "Gewerk: " + pre.gewerk, name && "Mieter: " + name, prop && `Liegenschaft: ${prop.ve} ${prop.name} (Firma ${prop.firmaNr})`, `Frist: ${fmtD(fristAuto(run.data))}${pre.dringend ? " (dringend)" : ""}`].filter(Boolean).join("\n")}\n\nDen Rest ergänzt du in der Aufgabe.`, [openBtn("Aufgabe öffnen", `/task/${run.id}`), undoBtn(snap)]);
  }

    const sub = findSubject(q);
    if (num && sub && !ask) {
      const v = Number(num[1].replace(",", ".")), type = /schulaufgabe/.test(n) ? "Schulaufgabe" : /mundlich|referat/.test(n) ? "Mündlich / Referat" : /kurzarbeit/.test(n) ? "Kurzarbeit" : "Stegreifaufgabe / Test";
      addGrade(sub, v, type, when.date || todayKey(), "");
      const list = state.grades.filter(g => g.subject === sub);
      return say(`Note ${String(v).replace(".", ",")} in ${sub} (${type}) eingetragen. Neuer Schnitt in ${sub}: ${fmtGrade(avg(list))}.`, [undoBtn(snap), openBtn("Noten", "/grades")]);
    }
    const subs = [...new Set(state.grades.map(g => g.subject))];
    if (!subs.length) return say("Noch keine Noten eingetragen. Schreib z. B. „Note 2,3 in KSC Schulaufgabe“.", [openBtn("Noten", "/grades")]);

  }

      const ex = upcomingExams();
      return say(ex.length ? "Anstehend:\n" + ex.slice(0, 8).map(e => `• ${e.title} – ${dayWord(e.date)} (${inDays(e.date)})`).join("\n") : "Keine Klausuren eingetragen. Schreib z. B. „Klausur IWi am 15.10.“", [openBtn("Stundenplan", "/school")]);
    }
    const sub = findSubject(q), kind = /prufung/.test(n) ? "Prüfung" : /schulaufgabe/.test(n) ? "Schulaufgabe" : "Klausur";
    const topic = clean(when.rest, /\b(klausur|prüfung|pruefung|schulaufgabe|stegreifaufgabe|stegreif|ex|test|kurzarbeit)\b/gi).replace(new RegExp(`\\b${sub}\\b`), "").trim();
    const title = `${kind}${sub ? " " + sub : ""}${topic ? " – " + topic : ""}`;
    state.events.push(makeEvent({ title, date: when.date, from: when.from, to: when.to, allDay: !when.from, kind: "klausur", subject: sub, report: false }));
    return say(`Eingetragen: ${title} am ${dayWord(when.date)} (${inDays(when.date)}).`, [undoBtn(snap), openBtn("Kalender", `/calendar/month/${when.date}`), { label: "Lernkarten dazu", run: () => { saveState(); go("/cards"); } }]);
  }

    const sub = findSubject(q) || "Sonstiges";

  /* Krank, Urlaub, Gleittag */

    return say(`${DAY_STATUS[status]} eingetragen: ${days.length === 1 ? dayWord(days[0]) : `${fmtD(days[0])} bis ${fmtD(days[days.length - 1])} (${days.length} Arbeitstage)`}. Zählt ${status === "frei" ? "0" : "8"} Std. pro Tag.`, [undoBtn(snap), openBtn("Zeiterfassung", "/time")]);
  }

  /* Zeiterfassung */

    const k = todayKey(), d = state.days[k];
    return say(`Stundenkonto: ${fmtHM(saldo(startKey(), k), true)} Std.\nHeute: ${fmtHM(liveMins(d))} Std. gearbeitet.`, [openBtn("Zeiterfassung", "/time")]);
  }
  if (/einchecken|einstempeln|ich (bin|komme) (da|an)|arbeitsbeginn/.test(n)) return say("Einchecken?", [{ label: "Jetzt einchecken", run: () => { handleAction("t-in", document.body); say("Eingecheckt.", baseBtns()); } }]);
  if (/auschecken|ausstempeln|feierabend|ich gehe/.test(n)) return say("Auschecken?", [{ label: "Jetzt auschecken", run: () => { handleAction("t-out", document.body); say("Ausgecheckt. Schönen Feierabend!", baseBtns()); } }]);

  /* Stundenplan */
  if (/stundenplan|unterricht|welche facher|welche stunden|wann (ist|hab ich|habe ich) schule/.test(n)) {
    const k = when.date || todayKey(), ls = lessonsOf(k), isS = isSchoolDay(k);
    const Day = w => w[0].toUpperCase() + w.slice(1);
    if (!isS) { const nx = (() => { for (let d = addDays(pkey(k), 1), i = 0; i < 60; i++, d = addDays(d, 1)) if (isSchoolDay(dkey(d))) return dkey(d); return ""; })(); return say(`${Day(dayWord(k))} ist keine Schule.${nx ? ` Nächster Schultag: ${dayWord(nx)}.` : ""}`, [openBtn("Stundenplan", "/school")]); }

  }

      return say(out.join("\n\n"), [openBtn("Kalender", "/calendar/week/" + dkey(mon))]);
    }
    const k = when.date || todayKey();
    return say(`${dayWord(k)[0].toUpperCase() + dayWord(k).slice(1)}:\n${eventsText(k)}`, [openBtn("Kalender", `/calendar/day/${k}`)]);

async function makeBerufPack() {
  const p = state.settings.profile;
  ui.packBusy = true; render();
  try {
    const res = await aiCall({ mode: "beruf", name: p.berufName, fachrichtung: p.fachrichtung, land: LAENDER[p.land], dauer: p.dauer });
    const pack = sanitizePack({ ...res, id: "eigen", name: p.berufName });
    if (!pack || !pack.lernfelder.length) throw new Error("Paket unvollständig");
    state.berufPack = pack; saveState();
    toast(`Berufspaket erstellt: ${pack.lernfelder.length} Lernfelder, ${pack.taetigkeiten.length} Tätigkeiten. Bitte Lernfelder kurz prüfen.`, { ms: 8000 });
  } finally { ui.packBusy = false; render(); }
}

let toastTimer = null, toastAction = null;
function toast(msg, o = {}) {

  toastAction = o.action || null;

  toastTimer = setTimeout(() => el.classList.remove("show"), o.ms || 3400);
}
const snapshot = () => JSON.stringify(state);
function toastUndo(msg, snap) {
  toast(msg, { ms: 7000, action: { label: "Rückgängig", run: () => { state = sanitizeState(JSON.parse(snap)); state.flags.schoolSeeded = true; saveState(); render(); toast("Wiederhergestellt."); } } });
}
function copyText(t) {
  const done = () => toast("In die Zwischenablage kopiert.");
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done));
  else fallbackCopy(t, done);
}
function fallbackCopy(t, done) {
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("Kopieren nicht möglich."); }

}

let dialogReturn = null, pendingConfirm = null;
const dialogOpen = () => !!$("#modal-root").firstElementChild;
function trapTab(e, root) {
  const f = $$('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])', root).filter(el => el.offsetParent !== null || el === document.activeElement);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (!root.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
function openDialog({ title, body, foot = "", narrow = false }) {

    <div class="scrim" data-scrim>

  document.body.classList.add("no-scroll");
  const first = $("[data-autofocus]", $("#modal-root")) || $("input:not([type=radio]):not([type=checkbox]), textarea, select", $("#modal-root"));
  if (first) first.focus();
}
function closeDialog() {
  $("#modal-root").innerHTML = "";
  if (!ui.focus && !ui.palette) document.body.classList.remove("no-scroll");

/* ==========================================================
   Export, Import, CSV, Kalenderdatei
   ========================================================== */
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportData() {
  download(`azubino-sicherung-${todayKey()}.json`, JSON.stringify({ app: "Azubino", version: 3, exportedAt: new Date().toISOString(), ...state }, null, 2), "application/json");
  toast("Sicherung wurde erstellt.");
}
function importData(file) {
  const reader = new FileReader();
  reader.onerror = () => toast("Die Datei konnte nicht gelesen werden.");
  reader.onload = async () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); if (!parsed || !Array.isArray(parsed.checklists)) throw new Error("format"); }
    catch (err) { toast("Import fehlgeschlagen: Das ist keine Azubino-Sicherung."); return; }
    const next = sanitizeState(parsed);
    next.flags.schoolSeeded = true;
    if (!await confirmDialog({ title: "Sicherung importieren?", text: `Enthalten: ${next.checklists.length} Checklisten, ${next.properties.length} Liegenschaften, ${next.events.length} Termine, ${next.orders.length} Aufträge, ${Object.keys(next.reports).length} Berichte, ${next.homework.length} Hausaufgaben. Deine aktuellen Daten werden ersetzt.`, confirm: "Importieren", danger: true })) return;
    const snap = snapshot();
    state = next; saveState(); go("/"); toastUndo("Sicherung importiert.", snap);
  };
  reader.readAsText(file);
}
/* CSV / Excel-CSV (Semikolon, UTF-8 mit BOM): Kategorie;Firmennummer;Firma;VE;Liegenschaft;Sachbearbeiter */
function importCsv(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    const text = String(reader.result).replace(/^﻿/, "");
    const rows = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => l.split(l.includes(";") ? ";" : ",").map(c => c.replace(/^"|"$/g, "").trim()));
    const head = rows[0] ? rows[0].map(norm) : [];
    const col = name => head.findIndex(h => h.startsWith(name));
    const ix = { kat: col("kategorie"), nr: col("firmennummer"), firma: head.findIndex(h => h === "firma"), ve: head.findIndex(h => h === "ve"), name: col("liegenschaft"), sb: col("sachbearbeiter"), ort: col("ort") };
    if (ix.ve < 0 || ix.name < 0) { toast("CSV nicht erkannt. Erwartet: Kategorie;Firmennummer;Firma;VE;Liegenschaft;Sachbearbeiter"); return; }
    let added = 0, updated = 0;
    const next = clone(state.properties);
    rows.slice(1).forEach(r => {
      const g = i => (i >= 0 ? r[i] || "" : "");
      const data = { kategorie: g(ix.kat) || "Firmen", firmaNr: g(ix.nr), firma: g(ix.firma), ve: g(ix.ve), name: g(ix.name), sb: g(ix.sb) };
      if (!data.name) return;
      if (ix.ort >= 0 && g(ix.ort)) data.ort = g(ix.ort);
      const ex = next.find(p => p.ve === data.ve && p.firmaNr === data.firmaNr);
      if (ex) { Object.assign(ex, data); updated++; } else { next.push(makeProp(data)); added++; }
    });
    if (!await confirmDialog({ title: "Liegenschaften importieren?", text: `${added} neu, ${updated} aktualisiert (erkannt an VE und Firmennummer). Orte und Notizen bleiben erhalten, nichts wird gelöscht.`, confirm: "Importieren" })) return;
    const snap = snapshot();
    state.properties = next.map(sanitizeProp).filter(Boolean);
    saveState(); render(); toastUndo("Liegenschaften importiert.", snap);
  };
  reader.readAsText(file, "utf-8");
}
function exportIcs() {
  const icsEsc = s => String(s).replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const dt = (k, t) => k.replace(/-/g, "") + (t ? "T" + t.replace(":", "") + "00" : "");
  const rr = { "täglich": "DAILY", "wöchentlich": "WEEKLY", monatlich: "MONTHLY" };
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Azubino//DE", "CALSCALE:GREGORIAN"];
  state.events.forEach(e => {
    lines.push("BEGIN:VEVENT", `UID:${e.id}@azubino`, `DTSTAMP:${stamp}`, `SUMMARY:${icsEsc(e.title)}`);
    if (e.from) lines.push(`DTSTART:${dt(e.date, e.from)}`, `DTEND:${dt(e.date, e.to || e.from)}`);
    else lines.push(`DTSTART;VALUE=DATE:${dt(e.date)}`, `DTEND;VALUE=DATE:${dt(dkey(addDays(pkey(e.date), 1)))}`);
    if (rr[e.repeat]) lines.push(`RRULE:FREQ=${rr[e.repeat]}`);
    const p = getProp(e.propId), loc = [e.place, p && `${p.name}${p.ort ? ", " + p.ort : ""}`].filter(Boolean).join(" – ");
    if (loc) lines.push(`LOCATION:${icsEsc(loc)}`);
    if (e.note) lines.push(`DESCRIPTION:${icsEsc(e.note)}`);
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  download(`arbeitsbuddy-termine-${todayKey()}.ics`, lines.join("\r\n"), "text/calendar");
  toast(`${plural(state.events.length, "Termin", "Termine")} exportiert.`);
}

/* ==========================================================
   Wiederkehrende Checklisten
   ========================================================== */
function rollRepeats() {
  if (!state.settings.autoRepeat) return 0;
  const now = new Date();
  let n = 0;
  runs().forEach(l => {
    if (l.repeat === "keine" || !l.completedAt) return;
    const done = new Date(l.completedAt);
    if (+startOfDay(done) === +startOfDay(now)) return;
    const dow = now.getDay();
    const due = l.repeat === "täglich" || (l.repeat === "werktags" && dow >= 1 && dow <= 5) || (l.repeat === "wöchentlich" && +monday(now) > +monday(done)) || (l.repeat === "monatlich" && (now.getFullYear() !== done.getFullYear() || now.getMonth() !== done.getMonth()));
    if (!due) return;
    l.tasks.forEach(t => { t.completed = false; t.skipped = false; });
    l.startedAt = null; l.completedAt = null; l.runId = uid(); touch(l); n++;
  });
  return n;
}
