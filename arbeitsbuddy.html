let dialogReturn = null, pendingConfirm = null;
const dialogOpen = () => !!$("#modal-root").firstElementChild;
function trapTab(e, root) {
  const f = $$('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])', root).filter(el => el.offsetParent !== null || el === document.activeElement);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (!root.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
function openDialog({ title, body, foot = "", narrow = false }) {
  if (!dialogOpen()) dialogReturn = document.activeElement;
  $("#modal-root").innerHTML = `
    <div class="scrim" data-scrim>
      <section class="dialog ${narrow ? "narrow" : ""}" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
        <div class="dialog-head"><h2 id="dlgTitle">${esc(title)}</h2><button type="button" class="btn icon quiet" data-act="close-dialog" aria-label="Schließen">${icon("x", 18)}</button></div>
        <div class="dialog-body">${body}</div>${foot ? `<div class="dialog-foot">${foot}</div>` : ""}
      </section>
    </div>`;
  document.body.classList.add("no-scroll");
  const first = $("[data-autofocus]", $("#modal-root")) || $("input:not([type=radio]):not([type=checkbox]), textarea, select", $("#modal-root"));
  if (first) first.focus();
}
function closeDialog() {
  $("#modal-root").innerHTML = "";
  if (!ui.focus && !ui.palette) document.body.classList.remove("no-scroll");
  if (pendingConfirm) { const r = pendingConfirm; pendingConfirm = null; r(false); }
  if (dialogReturn && document.contains(dialogReturn)) dialogReturn.focus({ preventScroll: true });
  dialogReturn = null;
}
function confirmDialog({ title, text, confirm = "Bestätigen", danger = false }) {
  return new Promise(resolve => {
    openDialog({ title, narrow: true, body: `<p>${esc(text)}</p>`, foot: `<button type="button" class="btn" data-act="dlg-cancel" ${danger ? "data-autofocus" : ""}>Abbrechen</button><button type="button" class="btn ${danger ? "danger solid" : "primary"}" data-act="dlg-ok" ${danger ? "" : "data-autofocus"}>${esc(confirm)}</button>` });
    pendingConfirm = resolve;

}
const askDelete = (title, text, confirm = "Löschen") => state.settings.confirmDelete ? confirmDialog({ title, text, confirm, danger: true }) : Promise.resolve(true);
const propOptions = () => `<datalist id="propList">${state.properties.filter(p => !p.archived).map(p => `<option value="${esc(propLabel(p))}">`).join("")}</datalist>`;
const propFromInput = v => { v = String(v || "").trim(); if (!v) return ""; const p = state.properties.find(x => propLabel(x) === v) || propMatches(v)[0]; return p ? p.id : ""; };
const toggle = (id, label, sub, on) => `<div class="toggle-row field full" style="padding:0"><div><div id="${id}L">${label}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div><span class="switch"><input type="checkbox" id="${id}" aria-labelledby="${id}L" ${on ? "checked" : ""}></span></div>`;

function toggleTask(listId, taskId) {
  const list = getList(listId), t = list?.tasks.find(x => x.id === taskId);
  if (!t) return;
  const finished = setCompleted(list, t, !t.completed);
  saveState(); render();
  if (finished) toast(`„${list.title}“ ist abgeschlossen.`);
}
function startFromTemplate(id) {
  const tpl = getList(id);
  if (!tpl) return;
  const run = makeRun(tpl);
  state.checklists.push(run);
  saveState(); toast(`„${tpl.title}“ gestartet.`); go(`/list/${run.id}`);
}
function copyList(list, { asTemplate = false } = {}) {
  const c = clone(list);
  Object.assign(c, { id: uid(), runId: uid(), title: `${list.title} (${asTemplate ? "Vorlage" : "Kopie"})`, favorite: false, archived: false, template: asTemplate || list.template, startedAt: null, completedAt: null, updatedAt: Date.now() });
  c.tasks = c.tasks.map(t => ({ ...t, id: uid(), completed: false, skipped: false }));
  state.checklists.push(c);
  return c;
}
function moveTask(listId, taskId, dir) {
  const list = getList(listId);
  if (!list) return;
  const i = list.tasks.findIndex(t => t.id === taskId), j = i + dir;
  if (i < 0 || j < 0 || j >= list.tasks.length) return;
  [list.tasks[i], list.tasks[j]] = [list.tasks[j], list.tasks[i]];
  touch(list); saveState(); render();
}
function addQuickTask(list) {
  const title = ui.quick.trim();
  if (!title) { toast("Bitte schreibe zuerst den Arbeitsschritt auf."); $("#quickInput")?.focus(); return; }

  list.tasks.push(t);
  ui.quick = ""; ui.flash = t.id;
  touch(list); syncCompletion(list); saveState(); render();
  $("#quickInput")?.focus();
}
function printReport() {

}
function reseedSchool() {

async function handleAction(act, el) {
  const listId = el.dataset.list, taskId = el.dataset.task, val = el.dataset.value;
  const list = listId ? getList(listId) : null;
  switch (act) {
    case "skip-link": document.getElementById("main")?.focus(); break;
    case "palette": openPalette(); break;
    case "more": openMoreSheet(); break;
    case "theme": state.settings.theme = resolveTheme() === "dark" ? "light" : "dark"; saveState(); render(); break;
    case "theme-set": state.settings.theme = val; saveState(); render(); break;
    case "new-list": openListModal(null, { template: el.dataset.template === "1" }); break;
    case "edit-list": if (list) openListModal(list.id); break;
    case "open-list": go(`/list/${listId}`); break;
    case "goto": closeDialog(); go(val); break;
    case "hw-new": ui.hwSubject = val; go("/homework"); setTimeout(() => $("#hwText")?.focus(), 60); break;
    case "hw-toggle": { const h = state.homework.find(x => x.id === val); if (h) { h.done = !h.done; saveState(); render(); } break; }
    case "hw-delete": {
      const h = state.homework.find(x => x.id === val);
      if (!h) break;
      const snap = snapshot();
      state.homework = state.homework.filter(x => x.id !== val);
      saveState(); render(); toastUndo("Hausaufgabe gelöscht.", snap);
      break;
    }
    case "close-dialog": closeDialog(); break;
    case "dlg-cancel": closeDialog(); break;
    case "dlg-ok": { const r = pendingConfirm; pendingConfirm = null; closeDialog(); if (r) r(true); break; }
    case "toast-action": { const a = toastAction; toastAction = null; $("#toast").classList.remove("show"); if (a) a.run(); break; }

    case "toggle": toggleTask(listId, taskId); break;
    case "expand": ui.expanded.has(taskId) ? ui.expanded.delete(taskId) : ui.expanded.add(taskId); render(); break;
    case "edit": openTaskModal(listId, taskId); break;
    case "up": moveTask(listId, taskId, -1); break;
    case "down": moveTask(listId, taskId, 1); break;
    case "skip": {
      const t = list?.tasks.find(x => x.id === taskId);
      if (!t) break;
      t.skipped = !t.skipped; if (t.skipped) t.completed = false;
      touch(list); syncCompletion(list); saveState(); render();
      break;
    }
    case "filter": ui.filter = val; render(); break;
    case "filter-reset": ui.filter = "all"; ui.q = ""; render(); break;
    case "delete": {
      const t = list?.tasks.find(x => x.id === taskId);
      if (!t || !await askDelete("Aufgabe löschen?", `„${t.title}“ wird entfernt.`)) break;
      const snap = snapshot();
      list.tasks = list.tasks.filter(x => x.id !== taskId);
      touch(list); syncCompletion(list); saveState(); render(); toastUndo("Aufgabe gelöscht.", snap);
      break;
    }
    case "fav": if (list) { list.favorite = !list.favorite; touch(list); saveState(); render(); } break;
    case "archive": {
      if (!list) break;
      const snap = snapshot();
      list.archived = !list.archived; touch(list); saveState();
      if (list.archived && ui.route.view === "list") go("/lists"); else render();
      toastUndo(list.archived ? "Archiviert." : "Wiederhergestellt.", snap);
      break;
    }
    case "duplicate": if (list) { const c = copyList(list); saveState(); toast("Kopie angelegt."); go(`/list/${c.id}`); } break;
    case "save-template": if (list) { copyList(list, { asTemplate: true }); saveState(); toast("Vorlage gespeichert."); render(); } break;
    case "start-template": startFromTemplate(listId); break;
    case "reset": {
      if (!list) break;
      const snap = snapshot();
      list.tasks.forEach(t => { t.completed = false; t.skipped = false; });
      list.startedAt = null; list.completedAt = null; list.runId = uid();
      touch(list); saveState(); render(); toastUndo("Aufgaben zurückgesetzt.", snap);
      break;
    }
    case "delete-list": {
      if (!list || !await askDelete("Checkliste löschen?", `„${list.title}“ mit ${plural(list.tasks.length, "Aufgabe", "Aufgaben")} wird gelöscht.`)) break;
      const snap = snapshot();
      state.checklists = state.checklists.filter(c => c.id !== list.id);
      saveState(); go("/lists"); toastUndo("Checkliste gelöscht.", snap);
      break;
    }
    case "print": if (list) { buildPrintList(list); setTimeout(() => window.print(), 30); } break;
    case "focus": if (list) openFocus(list.id); break;
    case "chat-list": if (list) { go("/assistant"); startList(list.id); saveState(); render(); } break;

    case "keep-samples": state.flags.seedChecked = true; saveState(); render(); break;
    case "drop-samples": {
      const ids = new Set(sampleLists().map(l => l.id));
      if (!await confirmDialog({ title: "Beispieldaten entfernen?", text: `${plural(ids.size, "Beispiel-Checkliste wird", "Beispiel-Checklisten werden")} gelöscht (Arbeitsbeginn, Maschinenkontrolle, Arbeitsende). Deine eigenen Daten bleiben erhalten.`, confirm: "Entfernen", danger: true })) break;
      const snap = snapshot();
      state.checklists = state.checklists.filter(l => !ids.has(l.id));
      state.flags.seedChecked = true;
      saveState(); render(); toastUndo("Beispieldaten entfernt.", snap);
      break;
    }

    /* Kalender */
    case "new-event": closeDialog(); openEventModal(null, { date: el.dataset.date || (ui.route.view === "calendar" ? ui.route.date : todayKey()), propId: el.dataset.prop }); break;
    case "edit-event": openEventModal(val); break;
    case "delete-event": {
      const e = getEvent(val);
      if (!e) break;
      const snap = snapshot();
      state.events = state.events.filter(x => x.id !== val);
      saveState(); closeDialog(); render(); toastUndo(`„${e.title}“ gelöscht${e.repeat !== "keine" ? " (ganze Serie)" : ""}.`, snap);
      break;
    }
    case "day": openDayModal(el.dataset.date); break;
    case "log-del": { state.logs = state.logs.filter(l => l.id !== val); saveState(); openDayModal(el.dataset.date); break; }
    case "ics": exportIcs(); break;

    /* Liegenschaften */
    case "new-prop": openPropModal(); break;
    case "edit-prop": openPropModal(val); break;
    case "order-for": { const p = getProp(val); if (p) { startOrder(p); saveState(); go("/assistant"); } break; }
    case "copy-order": { const o = state.orders.find(x => x.id === val); if (o) copyText(o.summary); break; }
    case "import-csv": $("#csvFile")?.click(); break;

    /* Assistent */
    case "chat-btn": { const b = chatBtns[Number(val)]; if (b) { b.run(); saveState(); render(); setTimeout(() => $("#chatInput")?.focus(), 0); } break; }
    case "chat-clear": state.chat = []; ui.flow = null; chatBtns = []; saveState(); render(); break;

    /* Berichtsheft */
    case "rep-save": saveReport(); render(); toast("Bericht gespeichert."); break;
    case "rep-done": saveReport(!ui.rep.done); render(); toast(ui.rep.done ? "Als fertig markiert." : "Wieder als Entwurf."); break;
    case "rep-print": saveReport(); printReport(); break;
    case "rep-regen": {
      const n = ui.rep.n, fresh = collectWeek(n);
      readRepForm();
      Object.assign(ui.rep, fresh);
      render(); toast("Stichpunkte und Stunden neu zusammengestellt. Speichern nicht vergessen.");
      break;
    }
    case "rep-delete": {
      const n = ui.rep.n, snap = snapshot();
      delete state.reports[n]; ui.rep = null;
      saveState(); render(); toastUndo(`Nachweis Nr. ${n} gelöscht.`, snap);
      break;
    }
    case "rep-order": {
      const o = state.orders.find(x => x.id === val), p = o && getProp(o.propId);
      if (!o) break;
      readRepForm();
      ui.rep.vorgangTitel = `Auftrag anlegen: ${(o.answers[0] || {}).a || "Instandhaltung"}`;
      ui.rep.vorgang = ["Liegenschaft im Programm aufrufen" + (p ? ` (VE ${p.ve}, ${p.name})` : ""), "Firma und zuständigen Sachbearbeiter prüfen", ...o.answers.filter(a => a.a).map(a => `${qLabel(a.q)} erfassen: ${a.a}`), "Auftrag speichern und an den Auftragnehmer versenden"].join("\n");
      render();
      break;
    }

    /* Einstellungen */
    case "steps-default": state.settings.orderSteps = [...DEFAULT_STEPS]; saveState(); render(); toast("Standard-Schritte wiederhergestellt."); break;
    case "school-reseed": {
      if (!await confirmDialog({ title: "Berufsschultage neu eintragen?", text: "Alle Berufsschultermine ab heute werden mit den aktuellen Zeiten neu erzeugt (Do + Fr, ohne Ferien und Feiertage). Frühere Termine bleiben.", confirm: "Neu eintragen" })) break;
      const snap = snapshot();
      reseedSchool(); saveState(); render(); toastUndo("Berufsschultage neu eingetragen.", snap);
      break;
    }
    case "export": exportData(); break;
    case "import": $("#importFile")?.click(); break;
    case "reset-all": {
      if (!await confirmDialog({ title: "Alles zurücksetzen?", text: "Alle Checklisten, Termine, Aufträge, Berichte und Einstellungen werden gelöscht. Liegenschaften und Berufsschultage werden neu eingetragen. Direkt danach noch rückgängig machbar.", confirm: "Zurücksetzen", danger: true })) break;
      const snap = snapshot();
      state = seedState(); ui.flow = null; chatBtns = [];
      saveState(); go("/"); toastUndo("Alles zurückgesetzt.", snap);
      break;
    }
    default: break;
  }
}

/* ==========================================================
   Export, Import, CSV, Kalenderdatei
   ========================================================== */
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportData() {
  download(`arbeitsbuddy-sicherung-${todayKey()}.json`, JSON.stringify({ app: "ArbeitsBuddy", version: 3, exportedAt: new Date().toISOString(), ...state }, null, 2), "application/json");
  toast("Sicherung wurde erstellt.");
}
function importData(file) {
  const reader = new FileReader();
  reader.onerror = () => toast("Die Datei konnte nicht gelesen werden.");
  reader.onload = async () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); if (!parsed || !Array.isArray(parsed.checklists)) throw new Error("format"); }
    catch (err) { toast("Import fehlgeschlagen: Das ist keine ArbeitsBuddy-Sicherung."); return; }
    const next = sanitizeState(parsed);
    next.flags.schoolSeeded = true;
    if (!await confirmDialog({ title: "Sicherung importieren?", text: `Enthalten: ${next.checklists.length} Checklisten, ${next.properties.length} Liegenschaften, ${next.events.length} Termine, ${next.orders.length} Aufträge, ${Object.keys(next.reports).length} Berichte, ${next.homework.length} Hausaufgaben. Deine aktuellen Daten werden ersetzt.`, confirm: "Importieren", danger: true })) return;
    const snap = snapshot();
    state = next; saveState(); go("/"); toastUndo("Sicherung importiert.", snap);
  };
  reader.readAsText(file);
}
/* CSV / Excel-CSV (Semikolon, UTF-8 mit BOM): Kategorie;Firmennummer;Firma;VE;Liegenschaft;Sachbearbeiter */
function importCsv(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    const text = String(reader.result).replace(/^﻿/, "");
    const rows = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => l.split(l.includes(";") ? ";" : ",").map(c => c.replace(/^"|"$/g, "").trim()));
    const head = rows[0] ? rows[0].map(norm) : [];
    const col = name => head.findIndex(h => h.startsWith(name));
    const ix = { kat: col("kategorie"), nr: col("firmennummer"), firma: head.findIndex(h => h === "firma"), ve: head.findIndex(h => h === "ve"), name: col("liegenschaft"), sb: col("sachbearbeiter"), ort: col("ort") };
    if (ix.ve < 0 || ix.name < 0) { toast("CSV nicht erkannt. Erwartet: Kategorie;Firmennummer;Firma;VE;Liegenschaft;Sachbearbeiter"); return; }
    let added = 0, updated = 0;
    const next = clone(state.properties);
    rows.slice(1).forEach(r => {
      const g = i => (i >= 0 ? r[i] || "" : "");
      const data = { kategorie: g(ix.kat) || "Firmen", firmaNr: g(ix.nr), firma: g(ix.firma), ve: g(ix.ve), name: g(ix.name), sb: g(ix.sb) };
      if (!data.name) return;
      if (ix.ort >= 0 && g(ix.ort)) data.ort = g(ix.ort);
      const ex = next.find(p => p.ve === data.ve && p.firmaNr === data.firmaNr);
      if (ex) { Object.assign(ex, data); updated++; } else { next.push(makeProp(data)); added++; }
    });
    if (!await confirmDialog({ title: "Liegenschaften importieren?", text: `${added} neu, ${updated} aktualisiert (erkannt an VE und Firmennummer). Orte und Notizen bleiben erhalten, nichts wird gelöscht.`, confirm: "Importieren" })) return;
    const snap = snapshot();
    state.properties = next.map(sanitizeProp).filter(Boolean);
    saveState(); render(); toastUndo("Liegenschaften importiert.", snap);
  };
  reader.readAsText(file, "utf-8");
}
function exportIcs() {
  const icsEsc = s => String(s).replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const dt = (k, t) => k.replace(/-/g, "") + (t ? "T" + t.replace(":", "") + "00" : "");
  const rr = { "täglich": "DAILY", "wöchentlich": "WEEKLY", monatlich: "MONTHLY" };
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//ArbeitsBuddy//DE", "CALSCALE:GREGORIAN"];
  state.events.forEach(e => {
    lines.push("BEGIN:VEVENT", `UID:${e.id}@arbeitsbuddy`, `DTSTAMP:${stamp}`, `SUMMARY:${icsEsc(e.title)}`);
    if (e.from) lines.push(`DTSTART:${dt(e.date, e.from)}`, `DTEND:${dt(e.date, e.to || e.from)}`);
    else lines.push(`DTSTART;VALUE=DATE:${dt(e.date)}`, `DTEND;VALUE=DATE:${dt(dkey(addDays(pkey(e.date), 1)))}`);
    if (rr[e.repeat]) lines.push(`RRULE:FREQ=${rr[e.repeat]}`);
    const p = getProp(e.propId), loc = [e.place, p && `${p.name}${p.ort ? ", " + p.ort : ""}`].filter(Boolean).join(" – ");
    if (loc) lines.push(`LOCATION:${icsEsc(loc)}`);
    if (e.note) lines.push(`DESCRIPTION:${icsEsc(e.note)}`);
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  download(`arbeitsbuddy-termine-${todayKey()}.ics`, lines.join("\r\n"), "text/calendar");
  toast(`${plural(state.events.length, "Termin", "Termine")} exportiert.`);
}

/* ==========================================================
   Wiederkehrende Checklisten
   ========================================================== */
function rollRepeats() {
  if (!state.settings.autoRepeat) return 0;
  const now = new Date();
  let n = 0;
  runs().forEach(l => {
    if (l.repeat === "keine" || !l.completedAt) return;
    const done = new Date(l.completedAt);
    if (+startOfDay(done) === +startOfDay(now)) return;
    const dow = now.getDay();
    const due = l.repeat === "täglich" || (l.repeat === "werktags" && dow >= 1 && dow <= 5) || (l.repeat === "wöchentlich" && +monday(now) > +monday(done)) || (l.repeat === "monatlich" && (now.getFullYear() !== done.getFullYear() || now.getMonth() !== done.getMonth()));
    if (!due) return;
    l.tasks.forEach(t => { t.completed = false; t.skipped = false; });
    l.startedAt = null; l.completedAt = null; l.runId = uid(); touch(l); n++;
  });
  return n;
}

/* ==========================================================
   Eingaben
   ========================================================== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el) {
    if (el.dataset.act === "skip-link") e.preventDefault();
    handleAction(el.dataset.act, el);
    return;
  }
  const item = e.target.closest("[data-pal]");
  if (item && ui.palette) { ui.palette.sel = Number(item.dataset.pal); runPaletteItem(); }
});
document.addEventListener("mousedown", e => {
  if (e.target.matches("[data-scrim]")) closeDialog();
  if (e.target.matches("[data-scrim-pal]")) closePalette();
});
document.addEventListener("submit", e => {
  const f = e.target;
  e.preventDefault();
  if (f.id === "quickForm") { const list = getList(ui.route.listId); if (list) addQuickTask(list); }
  else if (f.id === "listForm") saveListForm(f);
  else if (f.id === "taskForm") saveTaskForm(f);
  else if (f.id === "eventForm") saveEventForm(f);
  else if (f.id === "dayForm") saveDayForm(f);
  else if (f.id === "propForm") savePropForm(f);
  else if (f.id === "chatForm") chatSend($("#chatInput").value);
  else if (f.id === "profileForm") {
    const p = state.settings.profile;
    Object.assign(p, { name: $("#pName").value.trim(), firma: $("#pFirma").value.trim(), abteilung: $("#pAbt").value.trim(), start: keyOr($("#pStart").value) || p.start });
    saveState(); render(); toast("Gespeichert.");
  } else if (f.id === "schoolForm") {
    const fix = x => x ? x.replace(".", ":").padStart(5, "0") : "";
    const parse = t => bullet(t).map(l => {
      const m = l.match(/^(\d{1,2}[:.]\d{2})\s*[-–]?\s*(\d{1,2}[:.]\d{2})?\s*(.*)$/);
      const [subject, teacher = "", room = ""] = (m ? m[3] : l).split("|").map(x => x.trim());
      return { from: m ? timeOr(fix(m[1])) : "", to: m ? timeOr(fix(m[2])) : "", subject: subject || "Unterricht", teacher, room };
    });
    [4, 5].forEach(d => { const s = state.settings.school[d]; s.from = timeOr($(`#s${d}f`).value) || s.from; s.to = timeOr($(`#s${d}t`).value) || s.to; s.lessons = parse($(`#s${d}l`).value).slice(0, 14); });
    saveState(); render(); toast("Gespeichert. Zeiten neu übernehmen mit „Berufsschultage neu eintragen“.");
  } else if (f.id === "hwForm") {
    const text = $("#hwText").value.trim();
    if (!text) { toast("Bitte schreib die Hausaufgabe auf."); $("#hwText").focus(); return; }
    ui.hwSubject = $("#hwSub").value;
    state.homework.push({ id: uid(), subject: ui.hwSubject, text: text.slice(0, 2000), due: keyOr($("#hwDue").value), done: false, at: Date.now() });
    saveState(); render(); toast("Hausaufgabe eingetragen."); setTimeout(() => $("#hwText")?.focus(), 0);
  } else if (f.id === "stepsForm") {
    const steps = bullet($("#stepsText").value).slice(0, 20);
    state.settings.orderSteps = steps.length ? steps : [...DEFAULT_STEPS];
    saveState(); render(); toast("Auftragsschritte gespeichert.");
  }
});
let propTimer = null;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "quickInput") ui.quick = t.value;
  else if (t.id === "chatInput") ui.chatInput = t.value;
  else if (t.id === "taskQuery") { ui.q = t.value; refreshTaskList(); }
  else if (t.id === "propQ") { ui.propQ = t.value; clearTimeout(propTimer); propTimer = setTimeout(render, 120); }
  else if (t.id === "palInput" && ui.palette) { ui.palette.q = t.value; ui.palette.sel = 0; renderPalette(); }
  else if (t.closest && t.closest("#repForm")) { const r = readRepForm(); r.dirty = true; const pv = $("#sheetPreview"); if (pv && r) pv.innerHTML = ihkSheet(r.n, r); }
  else if (t.getAttribute("aria-invalid")) { t.removeAttribute("aria-invalid"); const err = document.getElementById(t.id + "Err"); if (err) err.hidden = true; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.name === "qtype") ui.quickType = t.value;
  else if (t.id === "taskSort") { ui.sort = t.value; render(); }
  else if (t.id === "listSort") { state.settings.sort = t.value; saveState(); render(); }
  else if (t.id === "hwSub") { ui.hwSubject = t.value; const d = $("#hwDue"); if (d) d.value = nextSchoolDay(dkey(addDays(new Date(), 1)), t.value); }
  else if (t.id === "propFirm") { ui.propFirm = t.value; render(); }
  else if (t.id === "propSb") { ui.propSb = t.value; render(); }
  else if (t.id === "propArch") { ui.showArchived = t.checked; render(); }
  else if (t.id === "repWeek") go(`/report/${t.value}`);
  else if (t.id === "animToggle") { state.settings.animations = t.checked; saveState(); render(); }
  else if (t.id === "confirmToggle") { state.settings.confirmDelete = t.checked; saveState(); }
  else if (t.id === "repeatToggle") { state.settings.autoRepeat = t.checked; saveState(); }
  else if (t.id === "eAll") { $("#eFrom").disabled = $("#eTo").disabled = t.checked; }
  else if (t.id === "importFile") { const f = t.files && t.files[0]; if (f) importData(f); t.value = ""; }
  else if (t.id === "csvFile") { const f = t.files && t.files[0]; if (f) importCsv(f); t.value = ""; }
});
/* ---------- Sortieren per Ziehen ---------- */
let dragId = null, dropInfo = null;
const clearDrop = () => $$(".drop-before, .drop-after").forEach(x => x.classList.remove("drop-before", "drop-after"));
document.addEventListener("pointerdown", e => { const g = e.target.closest(".grip"), li = g && g.closest(".task"); if (li) li.draggable = true; });
document.addEventListener("dragstart", e => {
  const li = e.target.closest && e.target.closest(".task");
  if (!li || !li.draggable) return;
  dragId = li.dataset.tid; e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", dragId); } catch (err) { /* ältere Browser */ }
  requestAnimationFrame(() => li.classList.add("dragging"));
});
document.addEventListener("dragover", e => {
  if (!dragId) return;
  const over = e.target.closest && e.target.closest("#taskList .task");
  if (!over) return;
  e.preventDefault(); clearDrop();
  if (over.dataset.tid === dragId) { dropInfo = null; return; }
  const r = over.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
  over.classList.add(after ? "drop-after" : "drop-before");
  dropInfo = { id: over.dataset.tid, after };
});
document.addEventListener("drop", e => {
  if (!dragId || !dropInfo) return;
  e.preventDefault();
  const list = getList(ui.route.listId);
  if (!list) return;
  const from = list.tasks.findIndex(t => t.id === dragId);
  if (from < 0) return;
  const [moved] = list.tasks.splice(from, 1);
  let to = list.tasks.findIndex(t => t.id === dropInfo.id);
  if (to < 0) to = list.tasks.length;
  list.tasks.splice(dropInfo.after ? to + 1 : to, 0, moved);
  touch(list); saveState(); render();
});
document.addEventListener("dragend", () => { dragId = null; dropInfo = null; clearDrop(); $$(".task.dragging, .task[draggable=true]").forEach(x => { x.classList.remove("dragging"); x.draggable = false; }); });

/* ==========================================================
   Arbeitsmodus
   ========================================================== */
function firstOpenIndex(list, from = 0) {
  for (let i = from; i < list.tasks.length; i++) if (!list.tasks[i].completed && !list.tasks[i].skipped) return i;
  return -1;
}
function openFocus(listId) {
  const list = getList(listId);
  if (!list || list.template) return;
  let i = firstOpenIndex(list);
  const summary = !list.tasks.length || i < 0;
  ui.focus = { listId, i: Math.max(0, i), summary, t0: Date.now(), timer: null };
  document.body.classList.add("no-scroll");
  renderFocus();
  ui.focus.timer = setInterval(() => { const c = document.getElementById("focusClock"); if (c && ui.focus) c.textContent = fmtClock(Date.now() - ui.focus.t0); }, 1000);
}
function renderFocus() {
  const f = ui.focus;
  if (!f) return;
  const list = getList(f.listId);
  if (!list) { closeFocus(); return; }
  const n = list.tasks.length, s = stats(list);
  let body, foot = "";
  if (f.summary) {
    body = `<div class="focus-body"><h2 class="focus-title">${isDone(list) ? "Checkliste abgeschlossen." : n ? "Keine offenen Schritte." : "Noch keine Aufgaben."}</h2>
      <div class="summary"><div><strong>${s.reqDone}/${s.reqTotal}</strong><span>Pflichtaufgaben</span></div>${s.optTotal ? `<div><strong>${s.optDone}</strong><span>optional erledigt</span></div>` : ""}</div>
      <div class="focus-actions"><button type="button" class="btn primary" data-act="f-list" data-autofocus>Zur Checkliste</button><button type="button" class="btn" data-act="f-close">Schließen</button></div></div>`;
  } else {
    const t = list.tasks[f.i];
    body = `<div class="focus-body">
      <div class="focus-step">${tile(list, "sm")}<span>${esc(list.title)}, Schritt ${f.i + 1} von ${n}</span>${t.type === "optional" ? `<span class="chip optional">Optional</span>` : ""}${t.priority === "high" ? `<span class="chip imp">Sehr wichtig</span>` : t.priority === "medium" ? `<span class="chip accent">Wichtig</span>` : ""}</div>
      <h2 class="focus-title">${esc(t.title)}</h2>
      ${t.hint ? `<div class="detail">${icon("bulb", 18)}<span>${esc(t.hint)}</span></div>` : ""}${t.note ? `<div class="detail" style="margin-top:6px">${icon("note", 18)}<span>${esc(t.note)}</span></div>` : ""}
      <div class="focus-actions"><button type="button" class="btn primary" data-act="f-done" data-autofocus>${icon(t.completed ? "undo" : "check", 20)} ${t.completed ? "Wieder öffnen" : "Erledigt"}</button>
      ${t.type === "optional" && !t.completed ? `<button type="button" class="btn" data-act="f-skip">${icon("skip", 18)} ${t.skipped ? "Nicht überspringen" : "Überspringen"}</button>` : ""}</div></div>`;
    foot = `<div class="focus-foot"><button type="button" class="btn small" data-act="f-prev" ${f.i === 0 ? "disabled" : ""}>${icon("left", 15)} Zurück</button><span>Leertaste erledigt den Schritt</span><button type="button" class="btn small" data-act="f-next" ${f.i >= n - 1 ? "disabled" : ""}>Weiter ${icon("right", 15)}</button></div>`;
  }
  $("#focus-root").innerHTML = `
    <div class="focus-mode" role="dialog" aria-modal="true" aria-label="Arbeitsmodus: ${esc(list.title)}">
      <div class="focus-top">${bar(s.percent, isDone(list))}<span class="focus-clock" id="focusClock" aria-hidden="true">${fmtClock(Date.now() - f.t0)}</span><button type="button" class="btn icon" data-act="f-close" aria-label="Arbeitsmodus beenden">${icon("x", 20)}</button></div>
      ${body}${foot}
    </div>`;
  $("[data-autofocus]", $("#focus-root"))?.focus({ preventScroll: true });
}
function focusAction(act, el) {
  const f = ui.focus, list = f && getList(f.listId);
  if (!list) return;
  if (act === "f-close") { closeFocus(); return; }
  if (act === "f-list") { const id = list.id; closeFocus(); go(`/list/${id}`); return; }
  if (act === "f-prev") { f.i = Math.max(0, f.i - 1); renderFocus(); return; }
  if (act === "f-next") { f.i = Math.min(list.tasks.length - 1, f.i + 1); renderFocus(); return; }
  const t = list.tasks[f.i];
  if (!t) return;
  const advance = () => { let i = firstOpenIndex(list, f.i + 1); if (i < 0) i = firstOpenIndex(list, 0); if (i < 0) f.summary = true; else f.i = i; };
  if (act === "f-done") { const will = !t.completed; setCompleted(list, t, will); saveState(); if (will) advance(); renderFocus(); }
  else if (act === "f-skip") { t.skipped = !t.skipped; if (t.skipped) t.completed = false; touch(list); saveState(); if (t.skipped) advance(); renderFocus(); }
  void el;
}
function closeFocus() {
  if (ui.focus && ui.focus.timer) clearInterval(ui.focus.timer);
  ui.focus = null;
  $("#focus-root").innerHTML = "";
  if (!dialogOpen()) document.body.classList.remove("no-scroll");
  render();
}

/* ==========================================================
   Suche und Befehle (Palette)
   ========================================================== */
function paletteItems(q) {
  const words = norm(q.trim()).split(/\s+/).filter(Boolean);
  const hit = text => { const h = norm(text); return words.every(w => h.includes(w)); };
  const cmds = [
    ["Neuer Termin", "plus", () => openEventModal(null, {})],
    ["Auftrag anlegen (Assistent)", "chat", () => { startOrder(); saveState(); go("/assistant"); }],
    ["Arbeitszeit heute eintragen", "clock", () => openDayModal(todayKey())],
    ["Berichtsheft dieser Woche", "book", () => go("/report")],
    ["Neue Checkliste", "plus", () => openListModal()],
    ...NAV.map(([, href, ic, label]) => [`Zu „${label}“`, ic, () => go(href.slice(1) || "/")])
  ].map(([label, ic, run]) => ({ group: "Befehle", label, ic: icon(ic, 17), run })).filter(c => !words.length || hit(c.label));
  if (!words.length) return cmds;
  const props = propMatches(q).slice(0, 6).map(p => ({ group: "Liegenschaften", label: `${p.ve} ${p.name}`, sub: `Firma ${p.firmaNr} · ${p.sb}`, ic: icon("building", 17), run: () => go(`/prop/${p.id}`) }));
  const lists = state.checklists.filter(l => hit(`${l.title} ${l.description} ${l.category}`)).slice(0, 5).map(l => ({ group: "Checklisten", label: l.title, sub: l.template ? "Vorlage" : "Checkliste", ic: icon("clipboard", 17), run: () => go(`/list/${l.id}`) }));
  const tasks = state.checklists.flatMap(l => l.tasks.filter(t => hit(`${t.title} ${t.note} ${t.hint} ${t.category}`)).map(t => ({ group: "Aufgaben", label: t.title, sub: l.title, ic: icon(t.completed ? "check" : "clipboard", 17), run: () => { ui.flash = t.id; ui.scrollTo = t.id; go(`/list/${l.id}`); } }))).slice(0, 6);
  const evs = state.events.filter(e => e.kind === "termin" && hit(`${e.title} ${e.place} ${e.note}`)).slice(0, 5).map(e => ({ group: "Termine", label: e.title, sub: fmtD(e.date), ic: icon("cal", 17), run: () => go(`/calendar/day/${e.date}`) }));
  return [...props, ...lists, ...tasks, ...evs, ...cmds];
}
function openPalette() {
  if (ui.focus) return;
  ui.palette = { q: "", sel: 0, items: [], returnTo: document.activeElement };
  $("#palette-root").innerHTML = `
    <div class="scrim top" data-scrim-pal><div class="palette" role="dialog" aria-modal="true" aria-label="Suche und Befehle">
      <div class="pal-search">${icon("search", 18)}<input id="palInput" type="text" placeholder="Liegenschaft, Checkliste, Aufgabe, Termin oder Befehl …" role="combobox" aria-expanded="true" aria-controls="palList" aria-autocomplete="list" autocomplete="off" spellcheck="false"></div>
      <div class="pal-list" id="palList" role="listbox" aria-label="Ergebnisse"></div>
      <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> wählen</span><span><kbd>Enter</kbd> öffnen</span><span><kbd>Esc</kbd> schließen</span></div>
    </div></div>`;
  document.body.classList.add("no-scroll");
  renderPalette(); $("#palInput").focus();
}
function renderPalette() {
  const p = ui.palette;
  if (!p) return;
  const items = p.items = paletteItems(p.q);
  p.sel = Math.max(0, Math.min(p.sel, items.length - 1));
  let html = "", last = "";
  items.forEach((it, i) => {
    if (it.group !== last) { html += `<div class="pal-group" role="presentation">${it.group}</div>`; last = it.group; }
    html += `<div class="pal-item" role="option" id="pal-${i}" data-pal="${i}" aria-selected="${i === p.sel}"><span class="ic">${it.ic}</span><span class="grow"><span>${esc(it.label)}</span>${it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ""}</span></div>`;
  });
  $("#palList").innerHTML = html || `<div class="pal-empty">Nichts gefunden.</div>`;
  const input = $("#palInput");
  if (items.length) input.setAttribute("aria-activedescendant", `pal-${p.sel}`); else input.removeAttribute("aria-activedescendant");
}
function runPaletteItem() { const p = ui.palette, it = p && p.items[p.sel]; if (!it) return; closePalette(false); it.run(); }
function closePalette(restore = true) {
  const p = ui.palette;
  ui.palette = null;
  $("#palette-root").innerHTML = "";
  if (!dialogOpen() && !ui.focus) document.body.classList.remove("no-scroll");
  if (restore && p && p.returnTo && document.contains(p.returnTo)) p.returnTo.focus({ preventScroll: true });
}
function paletteKeys(e) {
  const p = ui.palette;
  if (e.key === "Escape") { e.preventDefault(); closePalette(); }
  else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const n = p.items.length;
    if (!n) return;
    p.sel = (p.sel + (e.key === "ArrowDown" ? 1 : -1) + n) % n;
    renderPalette(); document.getElementById(`pal-${p.sel}`)?.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") { e.preventDefault(); runPaletteItem(); }
  else if (e.key === "Tab") trapTab(e, $(".palette"));
}

/* ==========================================================
   Tastatur und Start
   ========================================================== */
document.addEventListener("keydown", e => {
  const a = document.activeElement, tag = (a && a.tagName || "").toLowerCase();
  const typing = ["input", "textarea", "select"].includes(tag) || (a && a.isContentEditable);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (ui.palette) closePalette(); else if (!dialogOpen()) openPalette(); return; }
  if (ui.palette) { paletteKeys(e); return; }
  if (dialogOpen()) {
    if (e.key === "Escape") { e.preventDefault(); closeDialog(); }
    else if (e.key === "Tab") trapTab(e, $("#modal-root .dialog"));
    return;
  }
  if (ui.focus) {
    const f = ui.focus;
    if (e.key === "Escape") { e.preventDefault(); closeFocus(); }
    else if (e.key === "Tab") trapTab(e, $("#focus-root .focus-mode"));
    else if (!f.summary) {
      if (e.key === " " && tag !== "button" && tag !== "a") { e.preventDefault(); focusAction("f-done"); }
      else if (e.key === "ArrowRight") { e.preventDefault(); focusAction("f-next"); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); focusAction("f-prev"); }
    }
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key.toLowerCase() === "n") { e.preventDefault(); openListModal(); }
  else if (e.key.toLowerCase() === "t") { e.preventDefault(); openEventModal(null, {}); }
});
document.addEventListener("click", e => {
  const el = e.target.closest("#focus-root [data-act]");
  if (el && ui.focus && /^f-/.test(el.dataset.act)) { e.stopPropagation(); focusAction(el.dataset.act, el); }
}, true);

/* Web-App: Offline-Speicher und dauerhafter Speicher (nicht über file://) */
function setupWebApp() {
  if (!/^https?:$/.test(location.protocol)) return;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
const installed = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function init() {
  setupWebApp();
  const rolled = rollRepeats();
  saveState();
  window.addEventListener("hashchange", () => { if (!ui.focus) { closeDialog(); render({ top: true }); } });
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const onScheme = () => { if (state.settings.theme === "system") render(); };
  if (mq.addEventListener) mq.addEventListener("change", onScheme); else if (mq.addListener) mq.addListener(onScheme);
  window.addEventListener("storage", e => { if (e.key === STORAGE_KEY && !ui.focus && !dialogOpen() && !ui.palette) { state = loadState(); render(); } });
  render({ top: true, initial: true });
  if (rolled) toast(`${plural(rolled, "wiederkehrende Checkliste wurde", "wiederkehrende Checklisten wurden")} für heute zurückgesetzt.`, { ms: 5000 });
}
init();

})();
