/* ==========================================================
   Rendern
   ========================================================== */
const TITLES = { overview: "Übersicht", today: "Heute", lists: "Checklisten", templates: "Vorlagen", settings: "Einstellungen" };

function focusKey(el) {
  const d = el.dataset || {};
  return [el.id, d.act, d.task, d.list, d.value, d.to, el.getAttribute("name"), el.getAttribute("href")].join("|");
}
function findByKey(key) {
  if (!key || /^\|+$/.test(key)) return null;
  return $$("#app button, #app input, #app select, #app a, #app textarea").find(el => focusKey(el) === key) || null;
}

function resetListUi() {
  ui.filter = "all"; ui.sort = "manual"; ui.q = ""; ui.quick = ""; ui.quickType = "required"; ui.expanded = new Set();
}

function renderShell(route) {
  let page;
  switch (route.view) {
    case "today": page = renderToday(); break;
    case "lists": page = renderLists(route); break;
    case "templates": page = renderTemplates(); break;
    case "settings": page = renderSettings(); break;
    case "list": page = renderListPage(getList(route.listId)); break;
    default: page = renderOverview();
  }
  return `
    <a class="skip" href="#main" data-act="skip-link">Zum Inhalt springen</a>
    <div class="app">
      ${renderRail(route)}
      <div class="main">
        ${renderTopbar()}
        <main class="page" id="main" tabindex="-1">${page}</main>
      </div>
    </div>`;
}

function render(opts = {}) {
  const route = ui.route = parseRoute();
  if (route.view === "list") {
    if (ui.lastList !== route.listId) { resetListUi(); ui.lastList = route.listId; }
  } else ui.lastList = null;

  const app = $("#app");
  const active = document.activeElement;
  const keyBefore = app.contains(active) ? focusKey(active) : null;
  const caret = active && typeof active.selectionStart === "number" ? [active.selectionStart, active.selectionEnd] : null;
  const y = window.scrollY;

  const root = document.documentElement;
  root.dataset.theme = resolveTheme();
  root.dataset.motion = state.settings.animations ? "on" : "off";

  app.innerHTML = renderShell(route);

  const list = route.view === "list" ? getList(route.listId) : null;
  document.title = `${list ? list.title : TITLES[route.view] || "Übersicht"} – ArbeitsBuddy`;

  $$("[data-bar]", app).forEach(el => {
    const to = Number(el.dataset.to);
    ui.prevPct[el.dataset.bar] = to;
    const fill = el.firstElementChild;
    if (fill) void fill.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => { if (fill) fill.style.width = to + "%"; }));
  });

  ui.pop = null; ui.flash = null; ui.justFinished = null;

  if (ui.scrollTo) {
    const el = document.getElementById("task-" + ui.scrollTo);
    ui.scrollTo = null;
    if (el) el.scrollIntoView({ block: "center", behavior: reducedMotion() ? "auto" : "smooth" });
  } else if (opts.top) {
    window.scrollTo(0, 0);
    const h = $("h1", app);
    if (h && !opts.initial) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
  } else {
    window.scrollTo(0, y);
    const el = findByKey(keyBefore);
    if (el) {
      el.focus({ preventScroll: true });
      if (caret && typeof el.setSelectionRange === "function") { try { el.setSelectionRange(caret[0], caret[1]); } catch (e) { /* Eingabetyp ohne Auswahl */ } }
    }
  }
}

function refreshTaskList() {
  const list = getList(ui.route.listId);
  const wrap = $("#taskListWrap");
  if (!list || !wrap) { render(); return; }
  wrap.innerHTML = renderTaskItems(list);
  const c = filterCounts(list);
  $$(".fchip").forEach(b => { b.setAttribute("aria-pressed", String(b.dataset.value === ui.filter)); $(".n", b).textContent = c[b.dataset.value]; });
}

/* ==========================================================
   Hinweise (Toast) und Rückgängig
   ========================================================== */
let toastTimer = null, toastAction = null;
function toast(msg, o = {}) {
  const el = $("#toast");
  if (!el) return;
  el.innerHTML = `<span>${esc(msg)}</span>${o.action ? `<button type="button" data-act="toast-action">${esc(o.action.label)}</button>` : ""}`;
  toastAction = o.action || null;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), o.ms || 3400);
}
const snapshot = () => JSON.stringify({ checklists: state.checklists, history: state.history });
function restoreSnapshot(snap) {
  const s = JSON.parse(snap);
  state.checklists = s.checklists;
  state.history = s.history;
  saveState();
  render();
}
function toastUndo(msg, snap) {
  toast(msg, { ms: 7000, action: { label: "Rückgängig", run: () => { restoreSnapshot(snap); toast("Wiederhergestellt."); } } });
}

/* ==========================================================
   Dialoge
   ========================================================== */
let dialogReturn = null, pendingConfirm = null;
const dialogOpen = () => !!$("#modal-root").firstElementChild;

function trapTab(e, root) {
  const f = $$('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])', root)
    .filter(el => el.offsetParent !== null || el === document.activeElement);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (!root.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

function openDialog({ title, body, foot = "", narrow = false }) {
  dialogReturn = document.activeElement;
  $("#modal-root").innerHTML = `
    <div class="scrim" data-scrim>
      <section class="dialog ${narrow ? "narrow" : ""}" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
        <div class="dialog-head"><h2 id="dlgTitle">${esc(title)}</h2><button type="button" class="btn icon quiet" data-act="close-dialog" aria-label="Schließen">${icon("x", 20)}</button></div>
        <div class="dialog-body">${body}</div>
        ${foot ? `<div class="dialog-foot">${foot}</div>` : ""}
      </section>
    </div>`;
  document.body.classList.add("no-scroll");
  const first = $("[data-autofocus]", $("#modal-root")) || $("input:not([type=radio]):not([type=checkbox]), textarea, select", $("#modal-root"));
  if (first) first.focus();
}

function closeDialog() {
  $("#modal-root").innerHTML = "";
  if (!ui.focus && !ui.palette) document.body.classList.remove("no-scroll");
  if (pendingConfirm) { const r = pendingConfirm; pendingConfirm = null; r(false); }
  if (dialogReturn && document.contains(dialogReturn)) dialogReturn.focus({ preventScroll: true });
  dialogReturn = null;
}

function confirmDialog({ title, text, confirm = "Bestätigen", danger = false }) {
  return new Promise(resolve => {
    openDialog({
      title, narrow: true,
      body: `<p>${esc(text)}</p>`,
      foot: `<button type="button" class="btn" data-act="dlg-cancel" ${danger ? "data-autofocus" : ""}>Abbrechen</button><button type="button" class="btn ${danger ? "danger solid" : "primary"}" data-act="dlg-ok" ${danger ? "" : "data-autofocus"}>${esc(confirm)}</button>`
    });
    pendingConfirm = resolve;
  });
}
async function askDelete(title, text, confirm = "Löschen") {
  if (!state.settings.confirmDelete) return true;
  return confirmDialog({ title, text, confirm, danger: true });
}

function saveTaskForm(form) {
  const list = getList(form.dataset.list);

/* ==========================================================
   Aktionen
   ========================================================== */
function toggleTask(listId, taskId) {
  const list = getList(listId);
  const t = list?.tasks.find(x => x.id === taskId);
  if (!t) return;
  const willComplete = !t.completed;
  const finished = setCompleted(list, t, willComplete);
  if (willComplete) ui.pop = t.id;
  if (finished) ui.justFinished = list.id;
  saveState(); render();
  if (finished) { celebrate(); toast(`„${list.title}“ ist abgeschlossen.`); }
}

function startFromTemplate(id) {
  const tpl = getList(id);
  if (!tpl) return;
  const run = makeRun(tpl);
  state.checklists.push(run);
  saveState();
  toast(`„${tpl.title}“ gestartet.`);
  go(`/list/${run.id}`);
}

function copyList(list, { asTemplate = false } = {}) {
  const c = clone(list);
  c.id = uid(); c.runId = uid();
  c.title = asTemplate ? `${list.title} (Vorlage)` : `${list.title} (Kopie)`;
  c.favorite = false; c.archived = false;
  c.template = asTemplate ? true : list.template;
  c.startedAt = null; c.completedAt = null;
  c.updatedAt = Date.now();
  c.tasks = c.tasks.map(t => ({ ...t, id: uid(), completed: false, skipped: false }));
  state.checklists.push(c);
  return c;
}

function moveTask(listId, taskId, dir) {
  const list = getList(listId);
  if (!list) return;
  const i = list.tasks.findIndex(t => t.id === taskId), j = i + dir;
  if (i < 0 || j < 0 || j >= list.tasks.length) return;
  [list.tasks[i], list.tasks[j]] = [list.tasks[j], list.tasks[i]];
  touch(list); saveState(); render();
}

function addQuickTask(list) {
  const title = ui.quick.trim();
  if (!title) { toast("Bitte schreibe zuerst den Arbeitsschritt auf."); $("#quickInput")?.focus(); return; }
  const t = makeTask({ title: title.slice(0, 300), type: ui.quickType });
  list.tasks.push(t);
  ui.quick = "";
  ui.flash = t.id;
  touch(list);
  syncCompletion(list);
  saveState(); render();
  $("#quickInput")?.focus();
}

async function handleAction(act, el, e) {
  const listId = el.dataset.list, taskId = el.dataset.task;
  const list = listId ? getList(listId) : null;
  switch (act) {
    case "skip-link": document.getElementById("main")?.focus(); break;
    case "palette": openPalette(); break;
    case "theme": state.settings.theme = resolveTheme() === "dark" ? "light" : "dark"; saveState(); render(); break;
    case "theme-set": state.settings.theme = el.dataset.value; saveState(); render(); break;
    case "new-list": openListModal(null, { template: el.dataset.template === "1" }); break;
    case "edit-list": if (list) openListModal(list.id); break;
    case "close-dialog": closeDialog(); break;
    case "dlg-cancel": closeDialog(); break;
    case "dlg-ok": { const r = pendingConfirm; pendingConfirm = null; closeDialog(); if (r) r(true); break; }
    case "toast-action": { const a = toastAction; toastAction = null; $("#toast").classList.remove("show"); if (a) a.run(); break; }

    case "toggle": case "complete": toggleTask(listId, taskId); break;
    case "expand": ui.expanded.has(taskId) ? ui.expanded.delete(taskId) : ui.expanded.add(taskId); render(); break;
    case "edit": openTaskModal(listId, taskId); break;
    case "up": moveTask(listId, taskId, -1); break;
    case "down": moveTask(listId, taskId, 1); break;
    case "skip": {
      const t = list?.tasks.find(x => x.id === taskId);
      if (!t) break;
      t.skipped = !t.skipped;
      if (t.skipped) t.completed = false;
      touch(list); syncCompletion(list); saveState(); render();
      toast(t.skipped ? "Optionale Aufgabe übersprungen." : "Aufgabe wieder geöffnet.");
      break;
    }
    case "jump":
      ui.filter = "all"; ui.q = ""; ui.flash = taskId; ui.scrollTo = taskId; render(); break;
    case "filter": ui.filter = el.dataset.value; render(); break;
    case "filter-reset": ui.filter = "all"; ui.q = ""; render(); break;

    case "delete": {
      const t = list?.tasks.find(x => x.id === taskId);
      if (!t) break;
      if (!await askDelete("Aufgabe löschen?", `„${t.title}“ wird aus der Checkliste entfernt.`)) break;
      const snap = snapshot();
      list.tasks = list.tasks.filter(x => x.id !== taskId);
      touch(list); syncCompletion(list); saveState(); render();
      toastUndo("Aufgabe gelöscht.", snap);
      break;
    }
    case "fav": if (list) { list.favorite = !list.favorite; touch(list); saveState(); render(); toast(list.favorite ? "Als Favorit markiert." : "Favorit entfernt."); } break;
    case "archive": {
      if (!list) break;
      const snap = snapshot();
      list.archived = !list.archived; touch(list); saveState();
      if (list.archived && ui.route.view === "list") go("/lists"); else render();
      toastUndo(list.archived ? "Archiviert." : "Wiederhergestellt.", snap);
      break;
    }
    case "duplicate": if (list) { const c = copyList(list); saveState(); toast("Kopie angelegt."); go(`/list/${c.id}`); } break;
    case "save-template":
      if (list) { const c = copyList(list, { asTemplate: true }); saveState(); toast("Vorlage gespeichert."); render(); void c; }
      break;
    case "start-template": startFromTemplate(listId); break;
    case "reset": {
      if (!list) break;
      const snap = snapshot();
      list.tasks.forEach(t => { t.completed = false; t.skipped = false; });
      list.startedAt = null; list.completedAt = null; list.runId = uid();
      touch(list); saveState(); render();
      toastUndo("Aufgaben zurückgesetzt.", snap);
      break;
    }
    case "delete-list": {
      if (!list) break;
      if (!await askDelete("Checkliste löschen?", `„${list.title}“ mit allen ${list.tasks.length} Aufgaben wird gelöscht.`)) break;
      const snap = snapshot();
      state.checklists = state.checklists.filter(c => c.id !== list.id);
      saveState(); go("/lists"); render();
      toastUndo("Checkliste gelöscht.", snap);
      break;
    }
    case "print": if (list) { buildPrint(list); setTimeout(() => window.print(), 30); } break;
    case "focus": if (list) openFocus(list.id); break;

    case "export": exportData(); break;
    case "import": $("#importFile")?.click(); break;
    case "reset-all": {
      const ok = await confirmDialog({ title: "Auf Beispieldaten zurücksetzen?", text: "Alle Checklisten, Vorlagen und der Verlauf werden ersetzt. Du kannst das direkt danach noch rückgängig machen.", confirm: "Zurücksetzen", danger: true });
      if (!ok) break;
      const snap = snapshot();
      const fresh = seedState();
      state.checklists = fresh.checklists; state.history = [];
      saveState(); render();
      toastUndo("Beispieldaten geladen.", snap);
      break;
    }
    default: break;
  }
}

function exportData() {
  const payload = { app: "ArbeitsBuddy", version: 2, exportedAt: new Date().toISOString(), ...state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `arbeitsbuddy-sicherung-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Sicherung wurde erstellt.");
}

function importData(file) {
  const reader = new FileReader();
  reader.onerror = () => toast("Die Datei konnte nicht gelesen werden.");
  reader.onload = async () => {
    let parsed;
    try {
      parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.checklists)) throw new Error("format");
    } catch (err) {
      toast("Import fehlgeschlagen: Das ist keine ArbeitsBuddy-Sicherung.");
      return;
    }
    const next = sanitizeState(parsed);
    const ok = await confirmDialog({
      title: "Sicherung importieren?",
      text: `Die Datei enthält ${plural(next.checklists.length, "Checkliste oder Vorlage", "Checklisten und Vorlagen")}. Deine aktuellen Daten werden dadurch ersetzt.`,
      confirm: "Importieren", danger: true
    });
    if (!ok) return;
    const snap = snapshot();
    state.checklists = next.checklists; state.history = next.history; state.settings = next.settings;
    saveState(); go("/"); render({ top: true });
    toastUndo("Sicherung importiert.", snap);
  };
  reader.readAsText(file);
}

/* ==========================================================
   Wiederkehrende Checklisten
   ========================================================== */
function weekStart(d) { const x = startOfDay(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return +x; }
function rollRepeats() {
  if (!state.settings.autoRepeat) return 0;
  const now = new Date();
  let n = 0;
  runs().forEach(l => {
    if (l.repeat === "keine" || !l.completedAt) return;
    const done = new Date(l.completedAt);
    if (+startOfDay(done) === +startOfDay(now)) return;
    const dow = now.getDay();
    let due = false;
    if (l.repeat === "täglich") due = true;
    else if (l.repeat === "werktags") due = dow >= 1 && dow <= 5;
    else if (l.repeat === "wöchentlich") due = weekStart(now) > weekStart(done);
    else if (l.repeat === "monatlich") due = now.getFullYear() !== done.getFullYear() || now.getMonth() !== done.getMonth();
    if (!due) return;
    l.tasks.forEach(t => { t.completed = false; t.skipped = false; });
    l.startedAt = null; l.completedAt = null; l.runId = uid();
    touch(l);
    n++;
  });
  return n;
}

/* ==========================================================
   Eingaben (Suche, Sortierung, Schalter, Formulare)
   ========================================================== */
document.addEventListener("click", e => {
  const scrim = e.target.closest("[data-scrim]");
  const el = e.target.closest("[data-act]");
  if (el) {
    if (el.dataset.act === "skip-link") e.preventDefault();
    handleAction(el.dataset.act, el, e);
    return;
  }
  void scrim;
  const item = e.target.closest("[data-pal]");
  if (item && ui.palette) { ui.palette.sel = Number(item.dataset.pal); runPaletteItem(); }
});

document.addEventListener("mousedown", e => {
  if (e.target.matches("[data-scrim]")) closeDialog();
  if (e.target.matches("[data-scrim-pal]")) closePalette();
});

document.addEventListener("submit", e => {
  const f = e.target;
  if (f.id === "quickForm") { e.preventDefault(); const list = getList(ui.route.listId); if (list) addQuickTask(list); }
  else if (f.id === "listForm") { e.preventDefault(); saveListForm(f); }
  else if (f.id === "taskForm") { e.preventDefault(); saveTaskForm(f); }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "quickInput") ui.quick = t.value;
  else if (t.id === "taskQuery") { ui.q = t.value; refreshTaskList(); }
  else if (t.id === "palInput" && ui.palette) { ui.palette.q = t.value; ui.palette.sel = 0; renderPalette(); }
  else if (t.id === "fTitle" && t.getAttribute("aria-invalid")) { t.removeAttribute("aria-invalid"); $("#fTitleErr").hidden = true; }
  else if (t.id === "tTitle" && t.getAttribute("aria-invalid")) { t.removeAttribute("aria-invalid"); $("#tTitleErr").hidden = true; }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.name === "qtype") ui.quickType = t.value;
  else if (t.id === "taskSort") { ui.sort = t.value; render(); }
  else if (t.id === "listSort" || t.id === "sortSetting") { state.settings.sort = t.value; saveState(); render(); }
  else if (t.id === "animToggle") { state.settings.animations = t.checked; saveState(); render(); }
  else if (t.id === "confirmToggle") { state.settings.confirmDelete = t.checked; saveState(); }
  else if (t.id === "repeatToggle") { state.settings.autoRepeat = t.checked; saveState(); }
  else if (t.id === "importFile") { const f = t.files && t.files[0]; if (f) importData(f); t.value = ""; }
});

/* ---------- Sortieren per Ziehen ---------- */
let dragId = null, dropInfo = null;
const clearDrop = () => $$(".drop-before, .drop-after").forEach(x => x.classList.remove("drop-before", "drop-after"));
document.addEventListener("pointerdown", e => {
  const g = e.target.closest(".grip");
  const li = g && g.closest(".task");
  if (li) li.draggable = true;
});
document.addEventListener("dragstart", e => {
  const li = e.target.closest && e.target.closest(".task");
  if (!li || !li.draggable) return;
  dragId = li.dataset.tid;
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", dragId); } catch (err) { /* ältere Browser */ }
  requestAnimationFrame(() => li.classList.add("dragging"));
});
document.addEventListener("dragover", e => {
  if (!dragId) return;
  const over = e.target.closest && e.target.closest("#taskList .task");
  if (!over) return;
  e.preventDefault();
  clearDrop();
  if (over.dataset.tid === dragId) { dropInfo = null; return; }
  const r = over.getBoundingClientRect();
  const after = e.clientY > r.top + r.height / 2;
  over.classList.add(after ? "drop-after" : "drop-before");
  dropInfo = { id: over.dataset.tid, after };
});
document.addEventListener("drop", e => {
  if (!dragId || !dropInfo) return;
  e.preventDefault();
  const list = getList(ui.route.listId);
  if (!list) return;
  const from = list.tasks.findIndex(t => t.id === dragId);
  if (from < 0) return;
  const [moved] = list.tasks.splice(from, 1);
  let to = list.tasks.findIndex(t => t.id === dropInfo.id);
  if (to < 0) to = list.tasks.length;
  list.tasks.splice(dropInfo.after ? to + 1 : to, 0, moved);
  touch(list); saveState();
  ui.flash = moved.id;
  render();
});
document.addEventListener("dragend", () => {
  dragId = null; dropInfo = null; clearDrop();
  $$(".task.dragging, .task[draggable=true]").forEach(x => { x.classList.remove("dragging"); x.draggable = false; });
});

/* ==========================================================
   Arbeitsmodus
   ========================================================== */
function firstOpenIndex(list, from = 0) {
  for (let i = from; i < list.tasks.length; i++) if (!list.tasks[i].completed && !list.tasks[i].skipped) return i;
  return -1;
}
function openFocus(listId) {
  const list = getList(listId);
  if (!list || list.template) return;
  let i = firstOpenIndex(list);
  const summary = list.tasks.length === 0 || i < 0;
  if (i < 0) i = 0;
  ui.focus = { listId, i, summary, t0: Date.now(), timer: null };
  document.body.classList.add("no-scroll");
  renderFocus(true);
  ui.focus.timer = setInterval(() => {
    const c = document.getElementById("focusClock");
    if (c && ui.focus) c.textContent = fmtClock(Date.now() - ui.focus.t0);
  }, 1000);
}

function renderFocus(initial = false) {
  const f = ui.focus;
  if (!f) return;
  const list = getList(f.listId);
  if (!list) { closeFocus(); return; }
  const n = list.tasks.length;
  const segs = list.tasks.map((t, idx) => {
    const cls = idx === f.i && !f.summary ? "now" : t.completed ? "done" : t.skipped ? "skip" : "";
    return `<button type="button" class="seg ${cls}" data-act="f-go" data-value="${idx}" aria-label="Schritt ${idx + 1}: ${esc(t.title)}"></button>`;
  }).join("");
  const s = stats(list);
  let body, foot;
  if (f.summary) {
    const dur = list.startedAt ? fmtDuration(Date.now() - list.startedAt) : "";
    body = `
      <div class="focus-body">
        ${isDone(list) ? `<span class="stamp in">${icon("check", 30)} Erledigt</span>` : ""}
        <h2 class="focus-title">${isDone(list) ? "Checkliste abgeschlossen." : n ? "Keine offenen Schritte." : "Noch keine Aufgaben."}</h2>
        <div class="summary">
          <div><strong>${s.reqDone}/${s.reqTotal}</strong><span>Pflichtaufgaben</span></div>
          ${s.optTotal ? `<div><strong>${s.optDone}</strong><span>Optional erledigt, ${s.optSkipped} übersprungen</span></div>` : ""}
          ${dur ? `<div><strong>${dur}</strong><span>seit dem Start</span></div>` : ""}
        </div>
        <div class="focus-actions">
          <button type="button" class="btn primary big" data-act="f-list" data-autofocus>Zur Checkliste</button>
          <button type="button" class="btn on-dark big" data-act="f-close">Schließen</button>
        </div>
      </div>`;
    foot = `<div class="focus-foot"><span></span><span></span></div>`;
  } else {
    const t = list.tasks[f.i];
    body = `
      <div class="focus-body">
        <div class="focus-step">${tile(list, "sm")}<span>${esc(list.title)}, Schritt ${f.i + 1} von ${n}</span>${t.type === "optional" ? `<span class="chip optional">Optional</span>` : ""}${t.priority !== "normal" ? `<span class="chip">${prioSign(t.priority)} ${t.priority === "high" ? "Sehr wichtig" : "Wichtig"}</span>` : ""}</div>
        <h2 class="focus-title">${esc(t.title)}</h2>
        ${t.hint ? `<div class="detail hint on-dark">${icon("bulb", 20)}<span>${esc(t.hint)}</span></div>` : ""}
        ${t.note ? `<div class="detail note">${icon("note", 20)}<span>${esc(t.note)}</span></div>` : ""}
        <div class="focus-actions">
          <button type="button" class="btn primary big" data-act="f-done" data-autofocus>${icon(t.completed ? "undo" : "check", 24)} ${t.completed ? "Wieder öffnen" : "Erledigt"}</button>
          ${t.type === "optional" && !t.completed ? `<button type="button" class="btn on-dark big" data-act="f-skip">${icon("skip", 20)} ${t.skipped ? "Nicht überspringen" : "Überspringen"}</button>` : ""}
        </div>
      </div>`;
    foot = `
      <div class="focus-foot">
        <button type="button" class="btn small" data-act="f-prev" ${f.i === 0 ? "disabled" : ""}>${icon("left", 16)} Zurück</button>
        <span>Leertaste erledigt den Schritt</span>
        <button type="button" class="btn small" data-act="f-next" ${f.i >= n - 1 ? "disabled" : ""}>Weiter ${icon("right", 16)}</button>
      </div>`;
  }
  const hadFocus = document.activeElement && $("#focus-root").contains(document.activeElement) ? focusKey(document.activeElement) : null;
  $("#focus-root").innerHTML = `
    <div class="focus-mode" role="dialog" aria-modal="true" aria-label="Arbeitsmodus: ${esc(list.title)}">
      <div class="focus-top">
        <div class="segs">${segs}</div>
        <span class="focus-clock" id="focusClock" aria-hidden="true">${fmtClock(Date.now() - f.t0)}</span>
        <button type="button" class="btn on-dark icon" data-act="f-close" aria-label="Arbeitsmodus beenden">${icon("x", 22)}</button>
      </div>
      ${body}
      ${foot}
    </div>`;
  const root = $("#focus-root");
  const target = (hadFocus && $$("button", root).find(b => focusKey(b) === hadFocus && !b.disabled)) || $("[data-autofocus]", root);
  if (target) target.focus({ preventScroll: true });
  void initial;
}

function focusAdvance(list) {
  const f = ui.focus;
  let i = firstOpenIndex(list, f.i + 1);
  if (i < 0) i = firstOpenIndex(list, 0);
  if (i < 0) { f.summary = true; } else { f.i = i; f.summary = false; }
}

function focusAction(act, el) {
  const f = ui.focus;
  const list = f && getList(f.listId);
  if (!list) return;
  if (act === "f-close") { closeFocus(); return; }
  if (act === "f-list") { const id = list.id; closeFocus(); go(`/list/${id}`); return; }
  if (act === "f-go") { f.i = Number(el.dataset.value); f.summary = false; renderFocus(); return; }
  if (act === "f-prev") { f.i = Math.max(0, f.i - 1); renderFocus(); return; }
  if (act === "f-next") { f.i = Math.min(list.tasks.length - 1, f.i + 1); renderFocus(); return; }
  const t = list.tasks[f.i];
  if (!t) return;
  if (act === "f-done") {
    const willComplete = !t.completed;
    const finished = setCompleted(list, t, willComplete);
    saveState();
    if (willComplete) focusAdvance(list);
    renderFocus();
    if (finished) { celebrate(); ui.justFinished = list.id; }
  } else if (act === "f-skip") {
    t.skipped = !t.skipped; if (t.skipped) t.completed = false;
    touch(list); saveState();
    if (t.skipped) focusAdvance(list);
    renderFocus();
  }
}

function closeFocus() {
  if (ui.focus && ui.focus.timer) clearInterval(ui.focus.timer);
  ui.focus = null;
  $("#focus-root").innerHTML = "";
  if (!dialogOpen()) document.body.classList.remove("no-scroll");
  render();
}

/* ==========================================================
   Suche und Befehle (Palette)
   ========================================================== */
function paletteItems(q) {
  const words = norm(q.trim()).split(/\s+/).filter(Boolean);
  const hit = text => { const h = norm(text); return words.every(w => h.includes(w)); };
  const dark = resolveTheme() === "dark";
  const cmds = [
    { group: "Befehle", label: "Neue Checkliste anlegen", ic: icon("plus", 18), run: () => openListModal() },
    { group: "Befehle", label: "Neue Vorlage anlegen", ic: icon("layers", 18), run: () => openListModal(null, { template: true }) },
    { group: "Befehle", label: "Zu „Heute“ wechseln", ic: icon("today", 18), run: () => go("/today") },
    { group: "Befehle", label: "Zur Übersicht", ic: icon("dash", 18), run: () => go("/") },
    { group: "Befehle", label: "Vorlagen öffnen", ic: icon("layers", 18), run: () => go("/templates") },
    { group: "Befehle", label: "Einstellungen öffnen", ic: icon("sliders", 18), run: () => go("/settings") },
    { group: "Befehle", label: dark ? "Helles Design einschalten" : "Dunkles Design einschalten", ic: icon(dark ? "sun" : "moon", 18), run: () => { state.settings.theme = dark ? "light" : "dark"; saveState(); render(); } }
  ].filter(c => !words.length || hit(c.label));

  const kind = l => l.archived ? "Archiv" : l.template ? "Vorlage" : "Checkliste";
  const listIc = l => icon(LIST_ICONS.includes(l.icon) ? l.icon : "clipboard", 18);
  let lists = state.checklists.filter(l => !words.length || hit(`${l.title} ${l.description} ${l.category}`));
  lists = (words.length ? sortLists(lists) : sortLists(lists).slice(0, 5)).slice(0, 7)
    .map(l => ({ group: "Checklisten", label: l.title, sub: kind(l), ic: listIc(l), run: () => go(`/list/${l.id}`) }));

  const tasks = words.length
    ? state.checklists.flatMap(l => l.tasks.filter(t => hit(`${t.title} ${t.note} ${t.hint} ${t.category}`)).map(t => ({
        group: "Aufgaben", label: t.title, sub: l.title, ic: icon(t.completed ? "check" : "clipboard", 18),
        run: () => { ui.filter = "all"; ui.q = ""; ui.flash = t.id; ui.scrollTo = t.id; ui.lastList = l.id; go(`/list/${l.id}`); }
      }))).slice(0, 8)
    : [];
  return words.length ? [...lists, ...tasks, ...cmds] : [...cmds, ...lists];
}

function openPalette() {
  if (ui.focus) return;
  ui.palette = { q: "", sel: 0, items: [], returnTo: document.activeElement };
  $("#palette-root").innerHTML = `
    <div class="scrim top" data-scrim-pal>
      <div class="palette" role="dialog" aria-modal="true" aria-label="Suche und Befehle">
        <div class="pal-search">${icon("search", 20)}<input id="palInput" type="text" placeholder="Checkliste, Aufgabe oder Befehl …" role="combobox" aria-expanded="true" aria-controls="palList" aria-autocomplete="list" autocomplete="off" spellcheck="false"></div>
        <div class="pal-list" id="palList" role="listbox" aria-label="Ergebnisse"></div>
        <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> wählen</span><span><kbd>Enter</kbd> öffnen</span><span><kbd>Esc</kbd> schließen</span></div>
      </div>
    </div>`;
  document.body.classList.add("no-scroll");
  renderPalette();
  $("#palInput").focus();
}

function renderPalette() {
  const p = ui.palette;
  if (!p) return;
  const items = p.items = paletteItems(p.q);
  p.sel = Math.max(0, Math.min(p.sel, items.length - 1));
  let html = "", last = "";
  items.forEach((it, i) => {
    if (it.group !== last) { html += `<div class="pal-group" role="presentation">${it.group}</div>`; last = it.group; }
    html += `<div class="pal-item" role="option" id="pal-${i}" data-pal="${i}" aria-selected="${i === p.sel}"><span class="ic">${it.ic}</span><span class="grow"><span>${esc(it.label)}</span>${it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ""}</span></div>`;
  });
  $("#palList").innerHTML = html || `<div class="pal-empty">Nichts gefunden. Versuche einen anderen Begriff.</div>`;
  const input = $("#palInput");
  if (items.length) input.setAttribute("aria-activedescendant", `pal-${p.sel}`); else input.removeAttribute("aria-activedescendant");
}

function runPaletteItem() {
  const p = ui.palette;
  const it = p && p.items[p.sel];
  if (!it) return;
  closePalette(false);
  it.run();
}

function closePalette(restore = true) {
  const p = ui.palette;
  ui.palette = null;
  $("#palette-root").innerHTML = "";
  if (!dialogOpen() && !ui.focus) document.body.classList.remove("no-scroll");
  if (restore && p && p.returnTo && document.contains(p.returnTo)) p.returnTo.focus({ preventScroll: true });
}

function paletteKeys(e) {
  const p = ui.palette;
  if (e.key === "Escape") { e.preventDefault(); closePalette(); }
  else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const n = p.items.length;
    if (!n) return;
    p.sel = (p.sel + (e.key === "ArrowDown" ? 1 : -1) + n) % n;
    renderPalette();
    document.getElementById(`pal-${p.sel}`)?.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") { e.preventDefault(); runPaletteItem(); }
  else if (e.key === "Tab") trapTab(e, $(".palette"));
}

/* ==========================================================
   Abschluss-Animation: Warnband-Konfetti
   ========================================================== */
function celebrate() {
  if (!state.settings.animations || reducedMotion()) return;
  const cv = $("#confetti");
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ["#f6c200", "#f6c200", "#ffd21f", "#1b2125", "#1b7a4b", "#1f5fa8"];
  const parts = Array.from({ length: 110 }, () => {
    const a = -Math.PI / 2 + (Math.random() - .5) * 1.7;
    const v = 9 + Math.random() * 11;
    return { x: W / 2 + (Math.random() - .5) * 120, y: H * .72, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 6 + Math.random() * 9, h: 3 + Math.random() * 4, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: colors[Math.floor(Math.random() * colors.length)] };
  });
  const t0 = performance.now();
  (function frame(now) {
    const t = (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);
    parts.forEach(p => {
      p.vy += .32; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, 2.3 - t));
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (t < 2.3) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })(t0);
}

/* ==========================================================
   Tastatur
   ========================================================== */
document.addEventListener("keydown", e => {
  const a = document.activeElement;
  const tag = (a && a.tagName || "").toLowerCase();
  const typing = ["input", "textarea", "select"].includes(tag) || (a && a.isContentEditable);

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    if (ui.palette) closePalette(); else if (!dialogOpen()) openPalette();
    return;
  }
  if (ui.palette) { paletteKeys(e); return; }

  if (dialogOpen()) {
    if (e.key === "Escape") { e.preventDefault(); closeDialog(); }
    else if (e.key === "Tab") trapTab(e, $("#modal-root .dialog"));
    return;
  }

  if (ui.focus) {
    const f = ui.focus, list = getList(f.listId);
    if (e.key === "Escape") { e.preventDefault(); closeFocus(); }
    else if (e.key === "Tab") trapTab(e, $("#focus-root .focus-mode"));
    else if (!f.summary && list) {
      if (e.key === " " && tag !== "button" && tag !== "a") { e.preventDefault(); focusAction("f-done"); }
      else if (e.key === "ArrowRight") { e.preventDefault(); focusAction("f-next"); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); focusAction("f-prev"); }
    }
    return;
  }

  if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase() === "n") {
    e.preventDefault(); openListModal();
  }
});

document.addEventListener("click", e => {
  const el = e.target.closest("#focus-root [data-act]");
  if (el && ui.focus && /^f-/.test(el.dataset.act)) { e.stopPropagation(); focusAction(el.dataset.act, el); }
}, true);

/* ==========================================================
   Start
   ========================================================== */
function init() {
  const rolled = rollRepeats();
  if (rolled) saveState();
  window.addEventListener("hashchange", () => { if (!ui.focus) render({ top: true }); });
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const onScheme = () => { if (state.settings.theme === "system") render(); };
  if (mq.addEventListener) mq.addEventListener("change", onScheme); else if (mq.addListener) mq.addListener(onScheme);
  window.addEventListener("storage", e => {
    if (e.key === STORAGE_KEY && !ui.focus && !dialogOpen() && !ui.palette) { state = loadState(); render(); }
  });
  render({ top: true, initial: true });
  if (rolled) toast(rolled === 1 ? "1 wiederkehrende Checkliste wurde für heute zurückgesetzt." : `${rolled} wiederkehrende Checklisten wurden für heute zurückgesetzt.`, { ms: 5000 });
}
init();

})();
</script>
</body>
